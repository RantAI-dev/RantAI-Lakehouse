# gitleaks config for RantAI Lakehouse.
#
# This is the *working-tree* scan (CI's `security.yml` runs it with
# `--no-git`, i.e. against files on disk, not git history/blobs). It exists
# to catch a new secret before it's committed. See `security.yml` and
# docs/CI.md for the separate, allowed-to-fail `history-scan` job that
# covers git history, where a real leaked key predates this workflow and
# resolving it requires a history rewrite (not yet done).
title = "RantAI Lakehouse gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "Build artifacts and vendored dependencies, not source"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)rust/target/''',
  '''(^|/)target/''',
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)\.git/''',
  '''(^|/)coverage/''',
  '''(^|/)bun\.lock$''',
]

# Two synthetic JWTs used as `#[cfg(test)]` fixtures to exercise
# bearer-token-shape classification/redaction logic — not real credentials
# (no signing key exists for them; verified by reading both call sites).
[[allowlists]]
description = "test fixture JWT: rust/crates/lakehouse-api/src/auth.rs:226 (bearer_credential_kind classification test)"
regexes = ['''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJ1c2VyIn0\.c2lnbmF0dXJl''']

[[allowlists]]
description = "test fixture JWT: rust/crates/lakehouse-store/src/connectors.rs:624 (looks_like_raw_secret redaction test)"
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''']
