# gitleaks config for RantAI Lakehouse.
#
# This is the *working-tree* scan (CI's `security.yml` runs it with
# `--no-git`, i.e. against files on disk, not git history/blobs). It exists
# to catch a new secret before it's committed. See `security.yml` and
# docs/CI.md for the separate, allowed-to-fail `history-scan` job that
# covers git history, where a real leaked key predates this workflow and
# resolving it requires a history rewrite (not yet done).
title = "RantAI Lakehouse gitleaks config"

[extend]
useDefault = true

# ---------------------------------------------------------------------------
# Custom rules
#
# gitleaks' default ruleset does NOT match every key format this project has
# actually leaked. The `history-scan` job initially reported GREEN across all
# of git history even though a real internal LLM API key sits in two commits
# reachable from both `main` and `feat/rust-backend` — because that key uses an
# `sk-node-` prefix, which no default rule covers.
#
# A green scan that misses a known-present secret is worse than no scan: it
# tells a reviewer history is clean when it is not. These rules exist so the
# scan reports the truth.
# ---------------------------------------------------------------------------

[[rules]]
id = "rantai-llm-node-api-key"
description = "Internal LLM node API key (sk-node-… prefix; not covered by gitleaks defaults)"
regex = '''sk-node-[A-Za-z0-9]{24,}'''
tags = ["key", "llm", "internal"]

[[rules]]
id = "rantai-internal-lan-host"
description = "Internal infrastructure host baked into source (should be env-only)"
regex = '''192\.168\.18\.(187|197)'''
tags = ["internal", "infrastructure"]

[[allowlists]]
description = "Build artifacts and vendored dependencies, not source"
paths = [
  '''(^|/)node_modules/''',
  '''(^|/)rust/target/''',
  '''(^|/)target/''',
  '''(^|/)\.next/''',
  '''(^|/)dist/''',
  '''(^|/)build/''',
  '''(^|/)\.git/''',
  '''(^|/)coverage/''',
  '''(^|/)bun\.lock$''',
]

# Two synthetic JWTs used as `#[cfg(test)]` fixtures to exercise
# bearer-token-shape classification/redaction logic — not real credentials
# (no signing key exists for them; verified by reading both call sites).
[[allowlists]]
description = "test fixture JWT: rust/crates/lakehouse-api/src/auth.rs:226 (bearer_credential_kind classification test)"
regexes = ['''eyJhbGciOiJSUzI1NiJ9\.eyJzdWIiOiJ1c2VyIn0\.c2lnbmF0dXJl''']

[[allowlists]]
description = "test fixture JWT: rust/crates/lakehouse-store/src/connectors.rs:624 (looks_like_raw_secret redaction test)"
regexes = ['''eyJhbGciOiJIUzI1NiJ9\.eyJzdWIiOiIxMjM0NTY3ODkwIn0\.dozjgNryP4J3jVmNHl0w5N_XgL0n3I9PlFUP0THsR8U''']

# The rule file necessarily contains the very patterns it matches, and
# docs/CI.md references the key prefix when explaining why history-scan is
# red. Neither is a leak; without this the scanner flags its own config.
[[allowlists]]
description = "gitleaks config and CI docs legitimately reference the patterns"
paths = [
  '''^\.gitleaks\.toml$''',
  '''^docs/CI\.md$''',
]

# The SeaweedFS STS signing key that used to live in ops/seaweedfs/iam.json
# is gone from HEAD — iam.json is now rendered at bring-up from
# ops/seaweedfs/iam.template.json, and when SEAWEEDFS_STS_SIGNING_KEY is
# unset the init generates a random key per deployment rather than shipping
# a known one (see docker-compose.yml's `seaweedfs-iam-init`).
#
# This entry still has to exist, though, because deleting a file does not
# delete it from git HISTORY: the literal is still in commit b2ad885, and
# the Security workflow scans the FULL history, not the working tree. It was
# briefly removed on the theory that removing the file was enough — it is
# not, and the scan failed. Rewriting history to excise it is not worth it
# for a key that was self-describing as non-secret
# ("p2-matrix-local-only-signing-key-not-a-secret" in base64) and is now
# unused by anything.
#
# Delete this entry only together with a history rewrite that removes the
# literal, not before.
[[allowlists]]
description = "historical SeaweedFS STS signing key, removed from HEAD but still present in commit b2ad885"
regexes = ['''cDItbWF0cml4LWxvY2FsLW9ubHktc2lnbmluZy1rZXktbm90LWEtc2VjcmV0''']
