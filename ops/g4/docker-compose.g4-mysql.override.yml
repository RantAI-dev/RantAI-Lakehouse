# ops/g4/docker-compose.g4-mysql.override.yml -- SRC-4 slice 3 (plan T3.7), GATE-ONLY.
#
# The `g4-mysql` gate (ops/g4/g4_mysql_test.py) creates a MySQL change-capture connector through
# the API against the `mysql-g6` fixture. It is layered ON TOP of ops/g6/docker-compose.g6.override.yml,
# which already gives this stack what every connector gate needs: the `file:` credential store
# (`g6_secrets`, read-only at /run/secrets in `lakehouse-api`, writable at /gate-secrets in the
# runner), the gate-only internal-host switches (the API's probe and discovery, and the orchestrator,
# dial `mysql-g6` inside the compose network), and the fixture's root password. Used as
#
#   docker compose -p g4myci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml \
#     -f ops/g4/docker-compose.g4-mysql.override.yml --profile g6-sql --profile dagster --profile cdc \
#     --profile g4-mysql up -d --no-build ...
#
# What this file adds:
#
# 1. `KAFKA_CONNECT_URL` and `CDC_KAFKA_BOOTSTRAP` on the API (MySQL keeps its schema history in a Kafka
#    topic, so the API needs the broker's address too: SRC-4 decision S3-b) and the applier's
#    `CDC_KAFKA_BOOTSTRAP`. Both are empty in the template, which keeps change capture off.
# 2. The runner, built from the code-location image (it has `pymysql`, `requests` and `kafka-python`),
#    with `lakehouse_cdc_secrets` mounted READ-ONLY so the gate can prove that the password file
#    exists with the connector user's password and is removed on DELETE; production mounts that volume
#    in `lakehouse-api` and `kafka-connect` only.
services:
  lakehouse-api:
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      CDC_KAFKA_BOOTSTRAP: kafka:9092

  dagster-code-location:
    environment:
      CDC_KAFKA_BOOTSTRAP: kafka:9092

  g4-mysql-test-runner:
    profiles: ["g4-mysql"]
    image: ${LAKEHOUSE_DAGSTER_IMAGE:-rantai-lakehouse-dagster:local}
    working_dir: /work
    depends_on:
      mysql-g6:
        condition: service_healthy
      lakehouse-api:
        condition: service_started
      dagster-webserver:
        condition: service_healthy
    volumes:
      - ./ops/g4:/work
      # At /opt/gates for the reason `g4-test-runner` gives: a bind mount nested under the
      # bind-mounted /work would make Docker create the mount point on the host.
      - ./ops/gates:/opt/gates:ro
      - type: volume
        source: g6_secrets
        target: /gate-secrets
      - type: volume
        source: lakehouse_cdc_secrets
        target: /cdc-secrets
        read_only: true
    environment:
      PYTHONPATH: /opt/gates
      PYTHONDONTWRITEBYTECODE: "1"
      # The gate prints a marker line the CI job waits for: no buffering.
      PYTHONUNBUFFERED: "1"
      CH_URL: http://clickhouse:8123
      CH_USER: ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
      CH_LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      CH_RUSTFS_S3_ENDPOINT: http://rustfs:9000
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      CH_OAUTH_CLIENT_ID: clickhouse-reader
      CH_OAUTH_SERVER_URI: http://oidc-mock:8090/token
      API_URL: http://lakehouse-api:8080
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      CDC_KAFKA_BOOTSTRAP: kafka:9092
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      # The password of the connector's least-privilege user: the value the g6 fixture
      # already uses for its own reader, a throwaway of this stack.
      CONNECTOR_MYSQL_PASSWORD: ${CONNECTOR_MYSQL_PASSWORD:?}
    entrypoint: ["/bin/sh", "-c"]
    command: ["python g4_mysql_test.py"]
    restart: "no"
