# ops/g4/docker-compose.g4.override.yml -- SRC-9 plan task 6, GATE-ONLY.
#
# `ops/g4/g4_test.py` registers the demo CDC source in the connector registry
# (type `PostgreSQL CDC`) and calls the routes the console calls on it:
# `POST .../test` and the discovery routes, and it creates the connector in Kafka
# Connect through the API. Three things are needed that the
# default docker-compose.yml deliberately does not give a real deployment, and
# this file gives them to this gate's stack only, as
# ops/g6/docker-compose.g6.override.yml does for its fixtures:
#
# 1. `CONNECTOR_PROBE_ALLOW_INTERNAL_HOSTS`: the API blocks internal
#    addresses for the connection test, discovery and the save-time check of
#    an ingest spec (SEC-15); the demo source IS `postgres` inside the compose
#    network.
# 2. A `file:` credential store (ADR 0002 Addendum 3). `POST /api/connectors`
#    no longer takes a client-chosen secretRef: the server derives
#    `file:/run/secrets/connector_<id>_<suffix>` from the connector's own new
#    id, so the secret can only be written after the connector exists. The
#    volume is mounted read-only at /run/secrets in `lakehouse-api`
#    (`FileSecretResolver`'s fixed base directory) and read-write at
#    /gate-secrets in the runner, which writes the Postgres password there.
#    Nothing else in this stack reads it.
#
# 3. Change capture (SRC-4 slice 2). `KAFKA_CONNECT_URL` points the API at the
#    `cdc` profile's `kafka-connect` (unset in the template, which keeps change
#    capture off) and `CDC_KAFKA_BOOTSTRAP` points the applier at its broker. The
#    applier needs no `INGEST_ALLOW_INTERNAL_HOSTS`: it does not apply the SSRF
#    guard to its own broker (`cdc_apply.py`; SRC-4 S2 review SHOULD-FIX 1). The runner also mounts `lakehouse_cdc_secrets`
#    READ-ONLY so the gate can prove that the password file exists with the
#    source password and is removed on DELETE; production mounts that volume in
#    `lakehouse-api` and `kafka-connect` only (docker-compose.yml explains why).
#
# Used as
#   docker compose -p g4ci -f docker-compose.yml -f ops/g4/docker-compose.g4.override.yml \
#     --profile dagster --profile cdc up -d --build ...
volumes:
  g4_secrets:

services:
  lakehouse-api:
    environment:
      CONNECTOR_PROBE_ALLOW_INTERNAL_HOSTS: "true"
      KAFKA_CONNECT_URL: http://kafka-connect:8083
    volumes:
      - type: volume
        source: g4_secrets
        target: /run/secrets
        read_only: true

  dagster-code-location:
    environment:
      CDC_KAFKA_BOOTSTRAP: kafka:9092

  g4-test-runner:
    environment:
      KAFKA_CONNECT_URL: http://kafka-connect:8083
      # The gate prints a marker line the CI job waits for: no buffering.
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: volume
        source: g4_secrets
        target: /gate-secrets
      - type: volume
        source: lakehouse_cdc_secrets
        target: /cdc-secrets
        read_only: true
