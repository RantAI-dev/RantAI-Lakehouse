# ops/g6/docker-compose.g6-linklocal-secrets.override.yml -- a SECOND,
# narrower override for g6_linklocal_test.py only. Deliberately separate
# from docker-compose.g6.override.yml: that file sets
# INGEST_ALLOW_INTERNAL_HOSTS=true, which is exactly the property
# g6_linklocal_test.py exists to prove is FALSE by default (the DEFAULT
# compose file's dagster-code-location, override-free, still refuses a
# link-local target). This file adds NOTHING that widens the SSRF
# posture -- it only makes the REST connector's own credential
# resolvable, for a reason worth stating precisely:
#
# `ingest_factory.py::_resolve_object_secrets` resolves a connector's
# `secretRef` BEFORE the adapter's own SSRF-guarded dial ever runs (read
# in full, `_run_one_object`'s ordering) -- so a REST connector whose
# credential can never resolve fails with `SecretRefRejected`, which
# ALSO records an `ingest_run` row with `status = "rejected"`
# (`_run_one_object`'s `except SecretRefRejected` arm). Left unfixed,
# g6_linklocal_test.py's existing assertion ("a rejected row exists")
# would pass for the WRONG reason -- a missing credential, not the
# link-local host actually being dialed and refused by
# `ssrf_guard.resolve_checked` -- which is not a real proof of anything
# and would violate AGENTS.md principle 2 (never fabricate a passing
# result). ADR 0002 Addendum 3 derives a connector's credential name from
# its OWN server-generated id (unpredictable ahead of creation), so an
# `env:`-scheme credential can never be pre-provisioned into a container
# whose environment is fixed at boot -- only a `file:`-scheme credential,
# written into a shared volume AFTER the connector exists, is possible
# here. Hence this second, minimal override: it exists ONLY to make that
# one credential real, not to relax anything the link-local guard itself
# checks. See g6_linklocal_test.py for where the credential value is
# written.
#
# Invocation (see ops/g6/g6_linklocal_test.py's own header for the
# service this launches):
#   docker compose -p g6ci -f docker-compose.yml \
#     -f ops/g6/docker-compose.g6-linklocal-secrets.override.yml \
#     --profile dagster up ... g6-test-runner-linklocal
volumes:
  g6_linklocal_secrets:

services:
  dagster-code-location:
    volumes:
      - type: volume
        source: g6_linklocal_secrets
        target: /run/secrets
        read_only: true

  g6-test-runner-linklocal:
    volumes:
      - type: volume
        source: g6_linklocal_secrets
        target: /gate-secrets
