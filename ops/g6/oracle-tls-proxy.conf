# ops/g6/oracle-tls-proxy.conf -- SRC-4 T1.4: the TLS front of the Oracle
# gate fixture (`oracle-tls-g6` in docker-compose.g6-oracle.override.yml).
#
# Oracle Database Free listens in clear text on 1521, and giving its listener
# a TCPS endpoint needs a server wallet (`orapki`, an Oracle-format
# `cwallet.sso`) that this fixture cannot build or check without the
# database's own tooling. What the product controls is the CLIENT: the dial
# the orchestrator's thin-mode `oracledb` makes (`tcps`, the chain checked
# against a CA, the certificate's DN checked against `sslServerCertDn`). A
# TLS-terminating TCP proxy in front of the listener exercises exactly that:
# the client speaks TLS and the TNS inside it, the proxy hands the TNS to the
# listener unchanged. Limit, stated in the gate too: Oracle's own TCPS
# endpoint and wallet are not exercised.
pid /tmp/oracle-tls-proxy.pid;
error_log /dev/stderr info;
events {}
stream {
    server {
        listen 2484 ssl;
        ssl_certificate     /etc/oracle-tls/server.pem;
        ssl_certificate_key /etc/oracle-tls/server.key;
        ssl_protocols       TLSv1.2 TLSv1.3;
        proxy_pass          oracle-g6:1521;
    }
}
