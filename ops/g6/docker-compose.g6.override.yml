# ops/g6/docker-compose.g6.override.yml -- WS3 plan review Z11: this
# variable is GATE-ONLY. The default docker-compose.yml (no -f pointing
# here) leaves INGEST_ALLOW_INTERNAL_HOSTS unset on dagster-code-location,
# so a real deployment's Dagster ingestion jobs keep refusing internal
# hosts by default -- only this gate's own compose invocation
# (`docker compose -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml
# --profile g6 --profile dagster ...`) admits them, and only for the
# mysql-g6/mssql-g6/rest-stub-g6 fixtures this gate itself stands up.
#
# WS3 item 37: MYSQL_ROOT_PASSWORD, CONNECTOR_MYSQL_PASSWORD and
# MSSQL_SA_PASSWORD (mysql-g6, mssql-g6, g6-test-runner below) live here
# for the same reason as INGEST_ALLOW_INTERNAL_HOSTS above -- they are
# gate-only, and `${VAR:?}` in the default docker-compose.yml is
# interpolated for every service regardless of profile, so leaving them
# there broke `docker compose --profile '*' config --quiet` (the
# repo-wide check AGENTS.md prescribes) for every checkout, gate or not.
# They stay `${VAR:?}` here: fail-closed, just relocated.
#
# `g6_secrets`: a GATE-ONLY named volume backing
# `file:`-scheme connector credentials (ADR 0002 Addendum 3,
# docs/adr/0002-secretref-resolution.md). `POST /api/connectors` no
# longer accepts a client-chosen `secretRef`; the server derives one from
# the connector's own generated id and returns it once
# (`CreateConnectorResponse.credential`). A `file:` derived name is
# always shaped `file:/run/secrets/connector_<id>_<suffix>`
# (`lakehouse_store::connectors::derive_secret_ref`) -- `/run/secrets` is
# `FileSecretResolver`'s hardcoded base dir on BOTH the Rust side
# (`lakehouse-api/src/state.rs`) and the Python side
# (`dagster/dispar_orchestrate/secret_resolver.py`'s `_SECRETS_BASE_DIR`),
# so the SAME volume is mounted read-only at that exact path in both
# `lakehouse-api` and `dagster-code-location` (the service that actually
# EXECUTES a launched ingest run, per the run-launcher comment above
# `dagster-code-location` in docker-compose.yml) -- and read-write in
# `g6-test-runner`, which writes each connector's real credential value
# there (basename-only, validated against the `file:/run/secrets/
# connector_*` prefix before use -- see g6_ingest_matrix_test.py) right
# after `POST /api/connectors` hands back the derived name. A real
# deployment mounts this same way once it provisions real credentials as
# files (`secret_resolver.py`'s own doc comment already names this exact
# gap); it is "gate-only" here only in the sense that no OTHER compose
# profile references `g6_secrets`, not because the mechanism itself is a
# test-only shortcut.
volumes:
  g6_secrets:

services:
  dagster-code-location:
    environment:
      INGEST_ALLOW_INTERNAL_HOSTS: "true"
      # OpenSSL (Microsoft ODBC Driver 18's TLS implementation on Linux)
      # honours SSL_CERT_FILE for the default trust store -- pointed at
      # mssql-g6-cert-init's self-signed cert (mounted below) so the
      # `mssql` adapter's real `TrustServerCertificate=no` verification
      # has a CA it can actually verify `mssql-g6`'s certificate against.
      # Gate-only: a real deployment dials real, CA-issued SQL Server
      # certificates and needs no override of the system trust store.
      SSL_CERT_FILE: /etc/mssql-tls/mssql-g6.pem
    volumes:
      - type: volume
        source: g6_secrets
        target: /run/secrets
        read_only: true
      - type: volume
        source: mssql_g6_tls
        target: /etc/mssql-tls
        read_only: true

  lakehouse-api:
    environment:
      # SEC-15, GATE-ONLY: the default docker-compose.yml now blocks
      # internal addresses for the API's connection test, discovery and
      # delete clean-up, and `PUT .../ingest-spec` runs the same address
      # check at save time. This gate saves ingest specs that point at its
      # own mysql-g6/mssql-g6/rest-stub-g6/mongo-g6/kafka-g6 fixtures inside
      # the compose network, so the API must be allowed to reach them, the
      # same way INGEST_ALLOW_INTERNAL_HOSTS is set for Dagster above. Not
      # for a real deployment.
      CONNECTOR_PROBE_ALLOW_INTERNAL_HOSTS: "true"
    volumes:
      - type: volume
        source: g6_secrets
        target: /run/secrets
        read_only: true

  mysql-g6:
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_PASSWORD: ${CONNECTOR_MYSQL_PASSWORD:?}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD:?}"]

  # SRC-9 task 3: the MariaDB fixture, defined here and not in
  # docker-compose.yml for the reason the header gives (`${VAR:?}` is
  # interpolated for every service, so a gate-only credential in the default
  # file breaks `docker compose --profile '*' config --quiet`). Same shape as
  # `mysql-g6`: one database, a database-scoped reader user the connector
  # dials, root for the gate's seeding only. `11.4` is MariaDB's current
  # long-term-support series (supported to 2029), pinned by series tag like
  # the other fixtures. The healthcheck dials 127.0.0.1 over TCP, never the
  # socket: the image's entrypoint runs a temporary server with networking
  # off while it creates the database and users, and a socket ping would
  # report healthy during it (the same restart-after-ready trap as Postgres).
  mariadb-g6:
    image: mariadb:11.4
    profiles: ["g6"]
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_G6_ROOT_PASSWORD:?}
      MARIADB_DATABASE: g6_ingest
      MARIADB_USER: g6_reader
      MARIADB_PASSWORD: ${CONNECTOR_MARIADB_PASSWORD:?}
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping --protocol=tcp -h 127.0.0.1 -u root -p\"$$MARIADB_ROOT_PASSWORD\""]
      interval: 5s
      timeout: 5s
      retries: 20

  mssql-g6:
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
    healthcheck:
      test: ["CMD", "/opt/mssql-tools18/bin/sqlcmd", "-C", "-S", "localhost", "-U", "sa", "-P", "${MSSQL_SA_PASSWORD:?}", "-Q", "SELECT 1"]

  # Root credentials for mongo-g6, relocated here for the
  # same "breaks `--profile '*' config --quiet`" reason as
  # MYSQL_ROOT_PASSWORD above. Without this override mongo-g6 starts with
  # NO authentication at all (see docker-compose.yml's comment on that
  # service) -- fine for an override-free run, since nothing in this gate
  # dials it without the override anyway.
  mongo-g6:
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_G6_ROOT_USER:?}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_G6_ROOT_PASSWORD:?}

  g6-test-runner:
    # SRC-9 task 3: the runner seeds and dials mariadb-g6, so it waits for it.
    depends_on:
      mariadb-g6:
        condition: service_healthy
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      # SRC-9 task 3: root (seeding) and the connector's reader password for
      # mariadb-g6, provisioned by its own block above.
      MARIADB_G6_ROOT_PASSWORD: ${MARIADB_G6_ROOT_PASSWORD:?}
      CONNECTOR_MARIADB_PASSWORD: ${CONNECTOR_MARIADB_PASSWORD:?}
      # The mysql-g6/mssql-g6 dial CONNECTOR credentials (not root/sa) --
      # g6-test-runner needs the real values to write into each
      # connector's derived `file:` credential (ADR 0002 Addendum 3), the
      # SAME values mysql-g6's own override above provisions its
      # `g6_reader` user with.
      CONNECTOR_MYSQL_PASSWORD: ${CONNECTOR_MYSQL_PASSWORD:?}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?}
      MONGO_G6_ROOT_USER: ${MONGO_G6_ROOT_USER:?}
      MONGO_G6_ROOT_PASSWORD: ${MONGO_G6_ROOT_PASSWORD:?}
      # SRC-9 task 1: `ops/gates/gate_summary.py` and `coverage.json` are
      # shared by the connector gates but live outside `ops/g6` (the only
      # directory this runner mounts at /work). They are mounted at
      # /opt/gates, not under /work: a bind mount nested inside another one
      # makes Docker create the mount point on the host (see the comment on
      # `g4-test-runner`'s deprovision script). Read-only and
      # PYTHONDONTWRITEBYTECODE, so the root-owned runner leaves no
      # `__pycache__` in the checkout for the next `git clean`.
      PYTHONPATH: /opt/gates
      PYTHONDONTWRITEBYTECODE: "1"
    volumes:
      - ./ops/gates:/opt/gates:ro
      - type: volume
        source: g6_secrets
        target: /gate-secrets
