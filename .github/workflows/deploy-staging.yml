name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:  # manual trigger from GitHub UI

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging VM
    # Runs on the VM via self-hosted runner registered with label "staging"
    runs-on: [self-hosted, staging]
    environment:
      name: staging
      url: http://localhost:3000

    steps:
      # Self-hosted runner defense: compose services that bind-mount
      # this repo (the `ops/*` test runners) execute as container root,
      # and a single root-owned file `git clean -ffdx` cannot unlink
      # fails THIS step with EACCES — even though the write happened
      # during the PREVIOUS deploy, so the named step looks innocent.
      # Reclaim ownership before checkout; the runner has no
      # passwordless sudo, but its docker access is equivalent power
      # for a chown. Compose-side prevention (PYTHONDONTWRITEBYTECODE
      # on the ops/* runners) stops the known writer; this catches any
      # future one. Fails loudly on purpose — a docker daemon that is
      # down would kill the compose step later anyway.
      - name: Reclaim root-owned workspace leftovers
        run: docker run --rm -v "${{ github.workspace }}:/ws" alpine:3 chown -R "$(id -u):$(id -g)" /ws

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # compose.sh needs git rev-parse

      - name: Setup staging .env
        working-directory: ${{ github.workspace }}
        # bash, stated: the secret loop below uses indirect expansion.
        shell: bash
        # SEC-18: docker-compose.yml has no default credentials and
        # .env.example carries none, so the staging values come from
        # repository secrets, never from the repo. They MUST equal the
        # values the existing staging volumes were initialised with
        # (PostgreSQL only reads its password at first init; the Lakekeeper
        # encryption key cannot change without losing stored credentials),
        # or be rotated on purpose. The step fails before touching the
        # running stack when one is missing.
        run: |
          for name in POSTGRES_PASSWORD RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY \
            LAKEKEEPER_ENCRYPTION_KEY SEAWEEDFS_ACCESS_KEY SEAWEEDFS_SECRET_KEY; do
            var="STAGING_${name}"
            value="${!var}"
            if [ -z "$value" ]; then
              echo "::error::repository secret STAGING_$name is not set (SEC-18: no default credentials; see docs/OPERATIONS.md)"
              exit 1
            fi
          done
          cp .env.example .env
          cat .env.staging >> .env
          # Same newline guard as LLM_KEY below, and the same last-wins
          # reasoning: `.env.example` ships these keys empty.
          for name in POSTGRES_PASSWORD RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY \
            LAKEKEEPER_ENCRYPTION_KEY SEAWEEDFS_ACCESS_KEY SEAWEEDFS_SECRET_KEY; do
            var="STAGING_${name}"
            value="${!var}"
            sed -i "/^$name=/d" .env
            printf '\n%s=%s\n' "$name" "$value" >> .env
          done
          # TENANT_WAREHOUSE_S3_* are empty in the fresh-install template
          # (they used to fall back to the RustFS credentials, the same
          # value as the RustFS keys, ADR 0002 Addendum 2 "may equal, must
          # never alias"); keep staging's tenant provisioning working.
          sed -i '/^TENANT_WAREHOUSE_S3_ACCESS_KEY=/d;/^TENANT_WAREHOUSE_S3_SECRET_KEY=/d' .env
          printf '\nTENANT_WAREHOUSE_S3_ACCESS_KEY=%s\nTENANT_WAREHOUSE_S3_SECRET_KEY=%s\n' \
            "$STAGING_RUSTFS_ACCESS_KEY" "$STAGING_RUSTFS_SECRET_KEY" >> .env
          # File upload storage (DATA-9, DATA-17): compose defaults
          # RUSTFS_ACCESS_KEY_SECRET_REF / RUSTFS_SECRET_KEY_SECRET_REF to
          # env:UPLOAD_S3_ACCESS_KEY / env:UPLOAD_S3_SECRET_KEY, and since SEC-18
          # (#83) the template leaves both empty, so on staging every upload
          # answered "Upload storage is not configured." Same RustFS keys as the
          # tenant warehouse above; a separate upload key may replace them later.
          sed -i '/^UPLOAD_S3_ACCESS_KEY=/d;/^UPLOAD_S3_SECRET_KEY=/d' .env
          printf '\nUPLOAD_S3_ACCESS_KEY=%s\nUPLOAD_S3_SECRET_KEY=%s\n' \
            "$STAGING_RUSTFS_ACCESS_KEY" "$STAGING_RUSTFS_SECRET_KEY" >> .env
          # Paid provider credential, kept OUT of the repo (this repo is
          # public): inject it as the ONLY LLM_KEY= line in the file.
          # .env.example leaves `LLM_KEY` commented out; compose resolves
          # a duplicated .env key last-wins, but the line must actually
          # START a line — .env.staging historically ended without a
          # trailing newline, so a naive append glued LLM_KEY= onto its
          # final comment line and compose never saw the key (container
          # booted with LLM_KEY empty while the file held the real one;
          # that silent 503 cost a full deploy run to notice). Delete
          # existing LLM_KEY= lines, then force a leading newline:
          # exactly one line, always its own line. Unset secret -> that
          # single line is empty -> AI chat / agent / text-to-SQL keep
          # degrading to 503, never a broken deploy.
          sed -i '/^LLM_KEY=/d' .env
          printf '\nLLM_KEY=%s\n' "${{ secrets.LLM_KEY }}" >> .env
          # SEC-13: the staging admin password, the six service tokens and
          # the embed secret used to be committed in .env.staging, readable
          # by anyone (this repo is public). They now come from repo secrets
          # named STAGING_<NAME>, passed in through `env:` below rather than
          # interpolated into this script, so a value with a quote or a `$`
          # cannot change what the script does. Same rule as LLM_KEY: delete
          # any existing line, then append exactly one, on its own line.
          # Unlike LLM_KEY these are required: an empty token leaves the
          # scheduled pipelines inert and /api/pipelines answering 401/503
          # with nothing in the deploy log to say why, so a missing secret
          # fails the deploy here, by name, instead (fail closed).
          missing=""
          for name in AUTH_BOOTSTRAP_PASSWORD AGENT_RUN_TOKEN GOLD_EXPORT_RUN_TOKEN \
                      INGEST_SERVICE_TOKEN ALERTS_RUN_TOKEN PIPELINE_RUN_TOKEN \
                      LAKEHOUSE_MAINTENANCE_TOKEN EMBED_SECRET CONNECTOR_SECRETS_KEY \
                      KEYCLOAK_ADMIN_PASSWORD OIDC_CLIENT_SECRET \
                      SSO_USER_A_PASSWORD SSO_USER_B_PASSWORD SSO_USER_C_PASSWORD; do
            var="STAGING_${name}"
            value="${!var}"
            if [ -z "$value" ]; then
              missing="$missing $var"
              continue
            fi
            sed -i "/^${name}=/d" .env
            printf '\n%s=%s\n' "$name" "$value" >> .env
          done
          # BI-1: the address the Gotenberg container uses to reach the console,
          # which is deployed below as `lakehouse-frontend` on this network.
          # Not a secret; a plain line so the PDF item is on in staging.
          sed -i '/^CONSOLE_INTERNAL_URL=/d;/^RENDER_TOKEN_SECRET=/d' .env
          # BI-1 review fix (BLOCKER) R1: the PDF render token's own key. Optional
          # here: without the repo secret PDF export is simply not set up on staging.
          printf '\nRENDER_TOKEN_SECRET=%s\n' "$STAGING_RENDER_TOKEN_SECRET" >> .env
          printf '\nCONSOLE_INTERNAL_URL=%s\n' 'http://lakehouse-frontend:3000' >> .env
          # ── Single sign-on (Keycloak) ─────────────────────────────────────
          # The staging deployment signs in through the Keycloak this workflow
          # starts (`ops/sso/docker-compose.staging-keycloak.override.yml`).
          #
          # The ADDRESS is not a secret and not in the repository: it is this
          # deployment's own address, and `AGENTS.md` rule 12 keeps real
          # hostnames, IPs and ports out of the code and the docs. It comes
          # from the `staging` environment's variable `SSO_PUBLIC_BASE_URL`.
          # It is required, not optional: without it the stack would come up
          # with SSO silently off, and the next person would read "the login
          # button is missing" as a bug in the console instead of a missing
          # address here. Fail closed instead.
          if [ -z "$SSO_PUBLIC_BASE_URL" ]; then
            echo "::error::the staging environment variable SSO_PUBLIC_BASE_URL is not set (Settings > Environments > staging > Configuration variables); it is the address the browser reaches Keycloak on"
            exit 1
          fi
          # The realm's name is the last segment of the issuer
          # (`{base}/realms/{realm}`), and the API compares a token's `iss`
          # with the configured issuer byte for byte -- so the realm, the
          # issuer and Keycloak's own hostname are all built from this one
          # value.
          sso_realm="${SSO_REALM:-lakehouse}"
          sso_issuer="${SSO_PUBLIC_BASE_URL%/}/realms/${sso_realm}"
          # The console's own address is where the browser comes back to, and
          # the session cookie is set on THAT origin -- so the callback is
          # the console's address, not the API's. The console proxies
          # `/api/*` to the API (`next.config.ts`'s rewrites), so the callback
          # reaches the API through the same origin the person signed in on.
          sso_console="${SSO_CONSOLE_URL:-${SSO_PUBLIC_BASE_URL%/}}"
          sso_redirect="${sso_console%/}/api/auth/oidc/callback"
          # Every setting the browser flow needs is written here, because the
          # console's own SSO form refuses an issuer that is not `https://`
          # and an address that resolves inside the deployment's network
          # (the SSRF guard) -- see "Internal IdP via .env" in
          # docs/OPERATIONS.md. Staging is plain HTTP on the office LAN, so
          # the connection is owned by the environment.
          for name in OIDC_ISSUER OIDC_CLIENT_ID OIDC_PROVIDER_NAME \
                      OIDC_AUTHORIZE_URL OIDC_TOKEN_URL OIDC_JWKS_URL \
                      OIDC_REDIRECT_URI OIDC_GROUPS_CLAIM OIDC_ROLE_MAP \
                      OIDC_JIT_PROVISIONING OIDC_TRUST_EMAIL OIDC_PROMPT \
                      SSO_PUBLIC_BASE_URL SSO_REALM; do
            sed -i "/^${name}=/d" .env
          done
          {
            printf '\nSSO_PUBLIC_BASE_URL=%s\n' "$SSO_PUBLIC_BASE_URL"
            printf 'SSO_REALM=%s\n' "$sso_realm"
            printf 'OIDC_ISSUER=%s\n' "$sso_issuer"
            printf 'OIDC_CLIENT_ID=lakehouse\n'
            printf 'OIDC_PROVIDER_NAME=keycloak\n'
            printf 'OIDC_AUTHORIZE_URL=%s/protocol/openid-connect/auth\n' "$sso_issuer"
            printf 'OIDC_TOKEN_URL=%s/protocol/openid-connect/token\n' "$sso_issuer"
            # Not `{issuer}/.well-known/jwks.json`: Keycloak publishes its
            # keys at the discovery document's `jwks_uri`.
            printf 'OIDC_JWKS_URL=%s/protocol/openid-connect/certs\n' "$sso_issuer"
            printf 'OIDC_REDIRECT_URI=%s\n' "$sso_redirect"
            printf 'OIDC_GROUPS_CLAIM=groups\n'
            # The two groups the realm's mapper emits (bare names, because the
            # mapper runs with full.path=false) and the roles they map to.
            printf 'OIDC_ROLE_MAP=analysts=Analyst,lakehouse-admins=Platform Admin\n'
            # First sign-in creates the local account: the realm's users have
            # no `auth_identity` row in the API's database.
            printf 'OIDC_JIT_PROVISIONING=true\n'
            # The provider confirms the email address (`email_verified`), so
            # the safer default stays: a sign-in never joins an existing
            # account on an unconfirmed address.
            printf 'OIDC_TRUST_EMAIL=false\n'
            # The provider shows its login form on every sign-in, so the
            # account is the person's choice: without it, "sign out, then
            # sign in" lands on whoever used that browser last, because the
            # provider still holds the session it created for it.
            printf 'OIDC_PROMPT=login\n'
          } >> .env
          if [ -n "$missing" ]; then
            echo "::error::staging secrets not set:$missing (Settings > Secrets and variables > Actions)"
            exit 1
          fi
          echo "=== staging .env ready ==="
        env:
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_RUSTFS_ACCESS_KEY: ${{ secrets.STAGING_RUSTFS_ACCESS_KEY }}
          STAGING_RUSTFS_SECRET_KEY: ${{ secrets.STAGING_RUSTFS_SECRET_KEY }}
          STAGING_LAKEKEEPER_ENCRYPTION_KEY: ${{ secrets.STAGING_LAKEKEEPER_ENCRYPTION_KEY }}
          STAGING_SEAWEEDFS_ACCESS_KEY: ${{ secrets.STAGING_SEAWEEDFS_ACCESS_KEY }}
          STAGING_SEAWEEDFS_SECRET_KEY: ${{ secrets.STAGING_SEAWEEDFS_SECRET_KEY }}
          STAGING_AUTH_BOOTSTRAP_PASSWORD: ${{ secrets.STAGING_AUTH_BOOTSTRAP_PASSWORD }}
          STAGING_AGENT_RUN_TOKEN: ${{ secrets.STAGING_AGENT_RUN_TOKEN }}
          STAGING_GOLD_EXPORT_RUN_TOKEN: ${{ secrets.STAGING_GOLD_EXPORT_RUN_TOKEN }}
          STAGING_INGEST_SERVICE_TOKEN: ${{ secrets.STAGING_INGEST_SERVICE_TOKEN }}
          STAGING_ALERTS_RUN_TOKEN: ${{ secrets.STAGING_ALERTS_RUN_TOKEN }}
          STAGING_PIPELINE_RUN_TOKEN: ${{ secrets.STAGING_PIPELINE_RUN_TOKEN }}
          STAGING_LAKEHOUSE_MAINTENANCE_TOKEN: ${{ secrets.STAGING_LAKEHOUSE_MAINTENANCE_TOKEN }}
          # SRC-12: the key managed connector credentials are sealed with;
          # required, like the tokens above (compose refuses to start without it).
          STAGING_CONNECTOR_SECRETS_KEY: ${{ secrets.STAGING_CONNECTOR_SECRETS_KEY }}
          STAGING_EMBED_SECRET: ${{ secrets.STAGING_EMBED_SECRET }}
          STAGING_RENDER_TOKEN_SECRET: ${{ secrets.STAGING_RENDER_TOKEN_SECRET }}
          # Single sign-on: the provider's admin password, the confidential
          # client's secret (the same value the realm renderer injects), and
          # the three test users' passwords. All required: the realm renderer
          # refuses to render a realm without them, and compose refuses to
          # start the provider without its admin password.
          STAGING_KEYCLOAK_ADMIN_PASSWORD: ${{ secrets.STAGING_KEYCLOAK_ADMIN_PASSWORD }}
          STAGING_OIDC_CLIENT_SECRET: ${{ secrets.STAGING_OIDC_CLIENT_SECRET }}
          STAGING_SSO_USER_A_PASSWORD: ${{ secrets.STAGING_SSO_USER_A_PASSWORD }}
          STAGING_SSO_USER_B_PASSWORD: ${{ secrets.STAGING_SSO_USER_B_PASSWORD }}
          STAGING_SSO_USER_C_PASSWORD: ${{ secrets.STAGING_SSO_USER_C_PASSWORD }}
          # The address the browser reaches Keycloak on (not a secret; it is
          # an environment variable, not a repository secret).
          SSO_PUBLIC_BASE_URL: ${{ vars.SSO_PUBLIC_BASE_URL }}
          # The console's own address, when it differs from the provider's
          # (the callback returns to the console's origin, so the session
          # cookie is set where the person signed in).
          SSO_CONSOLE_URL: ${{ vars.SSO_CONSOLE_URL }}
          SSO_REALM: ${{ vars.SSO_REALM }}

      - name: Build & start backend stack (core + seaweedfs + dagster + trino + sso)
        working-directory: ${{ github.workspace }}
        # Retry: transient registry/PyPI flakes fail the whole compose build;
        # each retry reuses BuildKit layer cache, so a re-attempt is cheap.
        #
        # `-f docker-compose.yml` is named explicitly because `-f` REPLACES
        # the default file list; the second `-f` is the Keycloak the staging
        # deployment signs in through (its own services, its own profile).
        run: |
          for attempt in 1 2 3; do
            echo "=== compose up attempt ${attempt}/3 ==="
            if scripts/compose.sh \
              -f docker-compose.yml \
              -f ops/sso/docker-compose.staging-keycloak.override.yml \
              --profile sso \
              --profile seaweedfs \
              --profile dagster \
              --profile trino \
              up -d --build --remove-orphans; then
              exit 0
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
        timeout-minutes: 120

      - name: Health-check lakehouse-api
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo "lakehouse-api healthy"
              exit 0
            fi
            echo "waiting ... ${i}/30"
            sleep 2
          done
          echo "::error::lakehouse-api did not become healthy"
          exit 1

      # The provider answers a browser, not the API: the API fetches the key
      # set lazily on the first sign-in, so it is up before Keycloak is. This
      # step waits for the realm's discovery document, which is the address
      # the sign-in flow starts from -- a provider that never publishes it
      # (a wrong `KC_HOSTNAME`, an import that failed) is a deploy failure,
      # not something to discover at the login form.
      - name: Health-check Keycloak (the SSO provider)
        env:
          SSO_PUBLIC_BASE_URL: ${{ vars.SSO_PUBLIC_BASE_URL }}
          SSO_REALM: ${{ vars.SSO_REALM }}
        run: |
          realm="${SSO_REALM:-lakehouse}"
          discovery="${SSO_PUBLIC_BASE_URL%/}/realms/${realm}/.well-known/openid-configuration"
          for i in $(seq 1 60); do
            if curl -sf "$discovery" > /dev/null; then
              echo "keycloak discovery reachable"
              exit 0
            fi
            echo "waiting for keycloak ... ${i}/60"
            sleep 5
          done
          echo "::error::keycloak did not publish its discovery document at ${discovery}"
          exit 1

      # Postgres gets its 20 migrations from the API entrypoint, but
      # ClickHouse has no equivalent - without this step every analytics
      # page (and the builtin BI dashboards) query tables that don't
      # exist yet, e.g. `serving.mart_wisman` -> UNKNOWN_TABLE.
      # Idempotent: all objects are IF NOT EXISTS + TRUNCATE (demo data
      # is refreshed on each deploy by design).
      - name: Seed ClickHouse demo data
        working-directory: ${{ github.workspace }}
        run: scripts/seed-clickhouse.sh

      - name: Build frontend image
        working-directory: ${{ github.workspace }}
        # `NEXT_PUBLIC_SSO_ENABLED` is a BUILD-time flag: the login page
        # renders the SSO button only when it is baked into the bundle
        # (`src/features/auth/login-page.tsx`). The value is read from the
        # `.env` this deploy wrote, so the standalone image and the compose
        # `console` service (which reads the same variable through its build
        # args) agree on one flag.
        run: |
          sso_flag="$(sed -n 's/^NEXT_PUBLIC_SSO_ENABLED=//p' .env | tail -n 1)"
          docker build -f Dockerfile.frontend -t lakehouse-frontend:staging \
            --build-arg NEXT_PUBLIC_SSO_ENABLED="$sso_flag" .
        timeout-minutes: 20

      - name: Deploy frontend
        run: |
          docker stop  lakehouse-frontend 2>/dev/null || true
          docker rm    lakehouse-frontend 2>/dev/null || true
          docker run -d \
            --name lakehouse-frontend \
            --network rantai-lakehouse_default \
            -p 3000:3000 \
            -e RUST_API_URL=http://lakehouse-api:8080 \
            --restart unless-stopped \
            lakehouse-frontend:staging

      - name: Verify frontend
        run: |
          sleep 3
          curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000 || true
          echo ""

      - name: Summary
        run: |
          echo "### Staging services" >> "$GITHUB_STEP_SUMMARY"
          docker compose ps --format 'table {{.Name}}\t{{.Status}}\t{{.Ports}}' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Endpoint | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | http://localhost:3000 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API      | http://localhost:8080 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dagster  | http://localhost:3001 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trino    | http://localhost:8091 |" >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true