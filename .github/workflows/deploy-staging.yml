name: Deploy Staging

on:
  push:
    branches:
      - main
  workflow_dispatch:  # manual trigger from GitHub UI

concurrency:
  group: staging
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to staging VM
    # Runs on the VM via self-hosted runner registered with label "staging"
    runs-on: [self-hosted, staging]
    environment:
      name: staging
      url: http://localhost:3000

    steps:
      # Self-hosted runner defense: compose services that bind-mount
      # this repo (the `ops/*` test runners) execute as container root,
      # and a single root-owned file `git clean -ffdx` cannot unlink
      # fails THIS step with EACCES — even though the write happened
      # during the PREVIOUS deploy, so the named step looks innocent.
      # Reclaim ownership before checkout; the runner has no
      # passwordless sudo, but its docker access is equivalent power
      # for a chown. Compose-side prevention (PYTHONDONTWRITEBYTECODE
      # on the ops/* runners) stops the known writer; this catches any
      # future one. Fails loudly on purpose — a docker daemon that is
      # down would kill the compose step later anyway.
      - name: Reclaim root-owned workspace leftovers
        run: docker run --rm -v "${{ github.workspace }}:/ws" alpine:3 chown -R "$(id -u):$(id -g)" /ws

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # compose.sh needs git rev-parse

      - name: Setup staging .env
        working-directory: ${{ github.workspace }}
        # SEC-18: docker-compose.yml has no default credentials and
        # .env.example carries none, so the staging values come from
        # repository secrets, never from the repo. They MUST equal the
        # values the existing staging volumes were initialised with
        # (PostgreSQL only reads its password at first init; the Lakekeeper
        # encryption key cannot change without losing stored credentials),
        # or be rotated on purpose. The step fails before touching the
        # running stack when one is missing.
        env:
          STAGING_POSTGRES_PASSWORD: ${{ secrets.STAGING_POSTGRES_PASSWORD }}
          STAGING_RUSTFS_ACCESS_KEY: ${{ secrets.STAGING_RUSTFS_ACCESS_KEY }}
          STAGING_RUSTFS_SECRET_KEY: ${{ secrets.STAGING_RUSTFS_SECRET_KEY }}
          STAGING_LAKEKEEPER_ENCRYPTION_KEY: ${{ secrets.STAGING_LAKEKEEPER_ENCRYPTION_KEY }}
          STAGING_SEAWEEDFS_ACCESS_KEY: ${{ secrets.STAGING_SEAWEEDFS_ACCESS_KEY }}
          STAGING_SEAWEEDFS_SECRET_KEY: ${{ secrets.STAGING_SEAWEEDFS_SECRET_KEY }}
        run: |
          for name in POSTGRES_PASSWORD RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY \
            LAKEKEEPER_ENCRYPTION_KEY SEAWEEDFS_ACCESS_KEY SEAWEEDFS_SECRET_KEY; do
            eval "value=\${STAGING_$name:-}"
            if [ -z "$value" ]; then
              echo "::error::repository secret STAGING_$name is not set (SEC-18: no default credentials; see docs/OPERATIONS.md)"
              exit 1
            fi
          done
          cp .env.example .env
          cat .env.staging >> .env
          # Same newline guard as LLM_KEY below, and the same last-wins
          # reasoning: `.env.example` ships these keys empty.
          for name in POSTGRES_PASSWORD RUSTFS_ACCESS_KEY RUSTFS_SECRET_KEY \
            LAKEKEEPER_ENCRYPTION_KEY SEAWEEDFS_ACCESS_KEY SEAWEEDFS_SECRET_KEY; do
            eval "value=\$STAGING_$name"
            sed -i "/^$name=/d" .env
            printf '\n%s=%s\n' "$name" "$value" >> .env
          done
          # TENANT_WAREHOUSE_S3_* were `rustfsadmin` in .env.example (the
          # same value as the RustFS keys, ADR 0002 Addendum 2 "may equal,
          # must never alias"); keep staging's tenant provisioning working.
          sed -i '/^TENANT_WAREHOUSE_S3_ACCESS_KEY=/d;/^TENANT_WAREHOUSE_S3_SECRET_KEY=/d' .env
          printf '\nTENANT_WAREHOUSE_S3_ACCESS_KEY=%s\nTENANT_WAREHOUSE_S3_SECRET_KEY=%s\n' \
            "$STAGING_RUSTFS_ACCESS_KEY" "$STAGING_RUSTFS_SECRET_KEY" >> .env
          # Paid provider credential, kept OUT of the repo (this repo is
          # public): inject it as the ONLY LLM_KEY= line in the file.
          # .env.example ships an empty `LLM_KEY=` too; compose resolves
          # a duplicated .env key last-wins, but the line must actually
          # START a line — .env.staging historically ended without a
          # trailing newline, so a naive append glued LLM_KEY= onto its
          # final comment line and compose never saw the key (container
          # booted with LLM_KEY empty while the file held the real one;
          # that silent 503 cost a full deploy run to notice). Delete
          # existing LLM_KEY= lines, then force a leading newline:
          # exactly one line, always its own line. Unset secret -> that
          # single line is empty -> AI chat / agent / text-to-SQL keep
          # degrading to 503, never a broken deploy.
          sed -i '/^LLM_KEY=/d' .env
          printf '\nLLM_KEY=%s\n' "${{ secrets.LLM_KEY }}" >> .env
          echo "=== staging .env ready ==="

      - name: Build & start backend stack (core + seaweedfs + dagster + trino)
        working-directory: ${{ github.workspace }}
        # Retry: transient registry/PyPI flakes fail the whole compose build;
        # each retry reuses BuildKit layer cache, so a re-attempt is cheap.
        run: |
          for attempt in 1 2 3; do
            echo "=== compose up attempt ${attempt}/3 ==="
            if scripts/compose.sh \
              --profile seaweedfs \
              --profile dagster \
              --profile trino \
              up -d --build --remove-orphans; then
              exit 0
            fi
            [ "$attempt" = 3 ] && exit 1
            sleep 10
          done
        timeout-minutes: 120

      - name: Health-check lakehouse-api
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8080/health; then
              echo "lakehouse-api healthy"
              exit 0
            fi
            echo "waiting ... ${i}/30"
            sleep 2
          done
          echo "::error::lakehouse-api did not become healthy"
          exit 1

      # Postgres gets its 20 migrations from the API entrypoint, but
      # ClickHouse has no equivalent - without this step every analytics
      # page (and the builtin BI dashboards) query tables that don't
      # exist yet, e.g. `serving.mart_wisman` -> UNKNOWN_TABLE.
      # Idempotent: all objects are IF NOT EXISTS + TRUNCATE (demo data
      # is refreshed on each deploy by design).
      - name: Seed ClickHouse demo data
        working-directory: ${{ github.workspace }}
        run: scripts/seed-clickhouse.sh

      - name: Build frontend image
        working-directory: ${{ github.workspace }}
        run: |
          docker build -f Dockerfile.frontend -t lakehouse-frontend:staging .
        timeout-minutes: 20

      - name: Deploy frontend
        run: |
          docker stop  lakehouse-frontend 2>/dev/null || true
          docker rm    lakehouse-frontend 2>/dev/null || true
          docker run -d \
            --name lakehouse-frontend \
            --network rantai-lakehouse_default \
            -p 3000:3000 \
            -e RUST_API_URL=http://lakehouse-api:8080 \
            --restart unless-stopped \
            lakehouse-frontend:staging

      - name: Verify frontend
        run: |
          sleep 3
          curl -sf -o /dev/null -w '%{http_code}' http://localhost:3000 || true
          echo ""

      - name: Summary
        run: |
          echo "### Staging services" >> "$GITHUB_STEP_SUMMARY"
          docker compose ps --format 'table {{.Name}}\t{{.Status}}\t{{.Ports}}' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Endpoint | URL |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|-----|" >> "$GITHUB_STEP_SUMMARY"
          echo "| Frontend | http://localhost:3000 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| API      | http://localhost:8080 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Dagster  | http://localhost:3001 |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Trino    | http://localhost:8091 |" >> "$GITHUB_STEP_SUMMARY"
        continue-on-error: true