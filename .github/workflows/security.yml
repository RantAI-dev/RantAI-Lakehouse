name: Security

on:
  push:
    branches: [main]
  pull_request:
    # `lakehouse/**` as well as main: the lakehouse foundation work ships as a
    # stack of PRs that target each other rather than main, so a `[main]`-only
    # filter means every PR above the first gets ZERO check runs and merges
    # unverified.
    branches: [main, 'lakehouse/**']

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  # F4: a push to main must finish its run; cancelling it made its ci-required read as failed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  cargo-audit:
    name: cargo audit (advisories)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@cargo-audit

      # RUSTSEC-2023-0071 ("Marvin Attack" timing side-channel in `rsa`
      # 0.9.10) is a dev-only test dependency of lakehouse-auth
      # (crates/lakehouse-auth/tests/oidc.rs) with no upstream fix
      # available. See rust/deny.toml for the full justification — the
      # same exception is mirrored here since cargo-audit and cargo-deny
      # read separate ignore lists.
      - name: cargo audit
        run: cargo audit --ignore RUSTSEC-2023-0071
        working-directory: rust

  cargo-deny:
    name: cargo deny check (all)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          cache-targets: false

      - name: cargo deny check
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          manifest-path: rust/Cargo.toml
          command: check all

  # Working-tree secret scan: guards against a *new* secret being
  # committed. Configured with `--no-git` so it scans files on disk, not
  # git blobs/history — see the separate `history-scan` job below for why
  # history itself is not scanned here.
  gitleaks:
    name: gitleaks (working tree)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # taiki-e/install-action doesn't package gitleaks, so install the
      # pinned binary release directly instead of trusting a floating
      # third-party wrapper action.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      - name: gitleaks detect (working tree only, --no-git)
        run: gitleaks detect --no-git --source . --config .gitleaks.toml --redact -v

  # ── Separate on purpose; see docs/CI.md for the full, honest status. ──
  #
  # A Phase 1 audit reported a real LLM API key leaked in git history, and
  # the custom rules in `.gitleaks.toml` found it (plus staging tokens and
  # private LAN addresses). The product owner confirmed on 2026-10-14 that
  # every real secret found is rotated, and a history rewrite would break
  # every open branch, so those findings are baselined in `.gitleaksignore`
  # by exact fingerprint (commit, file, rule, line); see SEC-1 and
  # docs/superpowers/plans/2026-10-14-sec-1-gitleaks-baseline.md.
  #
  # This job therefore reports only findings that are NOT in the baseline:
  # a new secret, or the same secret in a new commit, turns it red. That is
  # its purpose. It is intentionally still not part of required status
  # checks, so a red run needs a human to look at it rather than silently
  # blocking merges.
  #
  # Scoped to HEAD (SEC-36, D1): on push to main or pull_request, gitleaks
  # scans the history reachable from HEAD (main's history, plus the PR's
  # commits on a PR) rather than every remote branch. A separate daily
  # workflow (`security-all-branches.yml`, D2) scans all branches.
  #
  # Do NOT set `continue-on-error: true` here and do NOT fold this into
  # the `gitleaks` job above — keep its result independently visible
  # regardless of which way it goes.
  history-scan:
    name: gitleaks (full git history) — see job summary and docs/CI.md
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Explain this job's purpose and known status
        run: |
          cat <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          ## history-scan

          Scans the git history reachable from HEAD with `.gitleaks.toml`
          (SEC-36, D1). On push to main, this scans main's history; on a
          pull request, it scans main plus the PR's commits. Unrelated
          branches are not scanned here so their findings cannot turn
          another PR red; all branches are scanned daily by the separate
          `security-all-branches.yml` workflow (D2).

          Findings listed in `.gitleaksignore` are the rotated or
          false-positive findings from the Phase 1 audit and the staging
          tokens (SEC-1); they are not reported. Any other finding,
          including the same secret in a new commit, turns this job red:
          treat it as a new leak, rotate the secret first, then decide
          whether to baseline it. This job is intentionally not part of
          required status checks, so a red run needs a human to look at it.
          See docs/CI.md ("history-scan") and
          docs/superpowers/plans/2026-10-14-sec-1-gitleaks-baseline.md.
          EOF

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Same .gitleaks.toml as the working-tree job (only excludes the two
      # verified-synthetic test-fixture JWTs and gitignored build dirs —
      # neither masks a real secret). `.gitleaksignore` at the repository
      # root is read from `--source` and baselines the SEC-1 findings by
      # exact fingerprint.
      #
      # Scoped to HEAD (SEC-36, D1): scans the history reachable from HEAD
      # (`git log -p -U0 HEAD` under the hood) rather than every branch,
      # so findings on unrelated branches do not fail checks on main or PRs.
      # Full branch coverage is handled by the daily scheduled workflow.
      - name: gitleaks detect (HEAD history)
        run: gitleaks detect --source . --config .gitleaks.toml --redact -v --log-opts="HEAD"

  # `dependency-review-action` calls GitHub's Dependency Graph diff API,
  # which historically required GitHub Advanced Security for *private*
  # repositories — this org was on the free plan, so the job failed at the
  # "Dependency review" step with "Dependency review is not supported on
  # this repository." As of the repository going public, GHAS dependency
  # review is free for public repos, and this was verified directly: a
  # throwaway PR (#23, closed without merging) ran this job and it passed.
  # See docs/CI.md for the verification details. Left out of required
  # status checks for now (not because it's expected to fail — it isn't —
  # but so it can prove itself stable over a few real PRs first); promote
  # it once that's established.
  dependency-review:
    name: "Dependency review (PR only)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Dependency review
        uses: actions/dependency-review-action@v5
        with:
          # GHSA-2f9f-gq7v-9h6m (moderate) — `thrift` 0.17.0, reached only as
          # parquet <- iceberg <- lakehouse-iceberg. There is no version to
          # bump to: `parquet` 58.4.0 declares `thrift ^0.17`, and no fixed
          # 0.17.x exists (0.24 is the first fixed line and is
          # semver-incompatible with that requirement). Verified with
          # `cargo tree -i thrift` and `cargo update -p thrift`, which locks
          # 0 packages.
          #
          # Not reachable from this codebase's own use: `thrift` is the
          # Parquet *footer* metadata codec, exercised on files written and
          # read inside the warehouse via `iceberg-rust`. The advisory
          # concerns a decoder fed hostile input; the input here is Parquet
          # this stack produced, in a bucket only this stack writes.
          #
          # `cargo audit`/`cargo deny` pass because RustSec has not mirrored
          # this GHSA — so this exception is what keeps the finding VISIBLE
          # and dated rather than silently absent. Re-check when arrow/parquet
          # bumps its thrift requirement; drop this line the moment it does.
          allow-ghsas: GHSA-2f9f-gq7v-9h6m
