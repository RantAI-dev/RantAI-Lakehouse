      - name: Compose logs (on failure)
        if: failure()
        run: $COMPOSE logs

      - name: Tear down the project
        if: always()
        run: $COMPOSE down -v

  # ── SRC-13 (table discovery, decisions D9 and D12): a PostgreSQL schema of
  # 10,000 tables is listed through the API within two minutes and one table
  # is found by a search; the seconds are printed and the step fails above 120.
  # Own job, so no existing connector gate grows: it needs only the API and the
  # PostgreSQL the API's seeded `conn-pg-lakehouse` connector points at (no
  # Dagster, no MySQL, no Iceberg writer), plus the API's own dependencies
  # (ClickHouse, oidc-mock). The first CI runs are its measurement; the estimate
  # is 8 to 12 minutes (image load, the API stack, about a minute for the
  # tables, a few seconds for the calls). `ops/g6/docker-compose.g6.override.yml`
  # supplies the gate-only SSRF opt-in that lets the API dial the `postgres`
  # service, and its `${VAR:?}` fixtures need the same fake `.env` values as
  # `g6-ops`. Scope gate as g6-ingest. ──
  g6-discovery-scale:
    name: Rust · SRC-13 discovery of 10,000 tables
    needs: [changes, images]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      LAKEHOUSE_API_IMAGE: rantai-lakehouse-api:ci
      LAKEHOUSE_DAGSTER_IMAGE: rantai-lakehouse-dagster:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Images from the `images` job; see `g3a-dagster`'s download step. The
      # Dagster image is the runner's only (it holds `requests` and psycopg2).
      - name: Download image artifacts (lakehouse-api + dagster)
        uses: actions/download-artifact@v8
        with:
          pattern: image-lakehouse-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load images
        run: |
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do
            zstd -dc "$f" | docker load
          done

      - name: Write CI-only .env
        # Obviously fake values of a throwaway stack. The mysql/mssql/mariadb/
        # sftp/mongo values are only here because the g6 override interpolates
        # `${VAR:?}` for every service, started or not.
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          MYSQL_ROOT_PASSWORD=ci-mysql-not-real-123
          CONNECTOR_MYSQL_PASSWORD=ci-mysql-connector-not-real-123
          MSSQL_SA_PASSWORD=Ci-Mssql-Not-Real-123!
          MARIADB_G6_ROOT_PASSWORD=ci-mariadb-not-real-123
          CONNECTOR_MARIADB_PASSWORD=ci-mariadb-connector-not-real-123
          SFTP_G6_PASSWORD=ci-sftp-not-real-123
          MONGO_G6_ROOT_USER=ci-mongo-root-not-real
          MONGO_G6_ROOT_PASSWORD=ci-mongo-not-real-123
          INGEST_SERVICE_TOKEN=ci-ingest-service-token-not-real-123
          PIPELINE_RUN_TOKEN=ci-pipeline-run-token-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          UPLOAD_S3_ACCESS_KEY=ci-only-rustfs-access
          UPLOAD_S3_SECRET_KEY=ci-only-rustfs-secret-0001
          # SEC-18: docker-compose.yml has no default credentials. CI-ONLY
          # throwaway values for this job's own throwaway stack; they protect
          # nothing and are never used outside it.
          POSTGRES_PASSWORD=ci-only-pg-password-0001
          RUSTFS_ACCESS_KEY=ci-only-rustfs-access
          RUSTFS_SECRET_KEY=ci-only-rustfs-secret-0001
          LAKEKEEPER_ENCRYPTION_KEY=ci-only-lakekeeper-key-0001
          EOF
          # SEC-36: generated per run; no key-shaped literal in the repository.
          echo "CONNECTOR_SECRETS_KEY=$(openssl rand -base64 32)" >> .env

      - name: Build the oidc-mock fixture image
        run: >
          docker compose -p src13scaleci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml
          --profile src13-scale build oidc-mock

      - name: Bring up the API and its PostgreSQL
        # Explicit service list: the API starts its own `depends_on` (postgres,
        # clickhouse, oidc-mock) and nothing else.
        run: >
          docker compose -p src13scaleci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml
          --profile src13-scale up -d --no-build lakehouse-api

      - name: Run the SRC-13 discovery scale gate inside the compose network
        shell: bash
        run: |
          docker compose -p src13scaleci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml \
            --profile src13-scale run --rm -T --no-deps src13-scale-test-runner 2>&1 | tee "$RUNNER_TEMP/src13-run.log"

      - name: Add the measured seconds to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/src13-run.log" ]; then
            {
              echo '### SRC-13 discovery of 10,000 tables (limit 120 s)'
              echo '```'
              grep -E '^\[src13\]' "$RUNNER_TEMP/src13-run.log" || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p src13scaleci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml --profile src13-scale logs

      - name: Tear down the project
        if: always()
        run: docker compose -p src13scaleci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml --profile src13-scale down -v

  # ── ADR 0010 acceptance — Gold export to Iceberg, from Rust:
  # `lakehouse-api::routes::gold` reads a real `serving.*` Gold mart from
  # ClickHouse and appends it to the `gold` Iceberg namespace through
  # Lakekeeper, then reads it back through `iceberg-rust`. Same
  # `g1-rustfs`/`g3a-dagster` shape; no Dagster webserver dependency (the
  # export route is called directly), so this uses the `test` profile
  # like `g1-rustfs`. `GOLD_EXPORT_RUN_TOKEN` must be identical for both
  # `lakehouse-api` (brought up first) and `gold-export-test-runner`
  # (run second) — both read it from this job's `.env`. See
  # ops/gold_export/gold_export_test.py. ──
  gold-export:
    name: Rust · Gold export to Iceberg (ADR 0010)
    needs: [changes, images]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    # DATA-2: raised from 20 by measured acceptance test execution time
    # (327s, ~6 minutes) plus 5 minutes of slack (11 minutes total raise).
    timeout-minutes: 31
    env:
      LAKEHOUSE_API_IMAGE: rantai-lakehouse-api:ci
      LAKEHOUSE_DAGSTER_IMAGE: rantai-lakehouse-dagster:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

