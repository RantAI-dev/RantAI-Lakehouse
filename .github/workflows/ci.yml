name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  parity-corpus-secrets:
    name: Parity corpus · no leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The parity corpus is captured from a live system and committed to git.
      # capture.ts strips credentials on every run; this is the backstop that
      # catches a corpus sanitized by hand or captured with a stale script.
      - name: Scan corpus for credential-shaped values
        run: ./rust/tests/parity/check-no-secrets.sh

  rust:
    name: Rust · fmt · clippy · test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      # Needed by lakehouse-bi's specs_match_typescript drift guard, which
      # shells out to `bun` to cross-check lakehouse_bi::specs against
      # src/lib/dashboard-specs.ts. It skips cleanly without bun, but this
      # job is where it should actually run.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Format
        run: cargo fmt --check
        working-directory: rust

      - name: Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: rust

      - name: Test
        run: cargo test --workspace --locked
        working-directory: rust
