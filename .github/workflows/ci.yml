name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `lakehouse/**` as well as main: the lakehouse foundation work ships as a
    # stack of PRs that target each other rather than main, so a `[main]`-only
    # filter means every PR above the first gets ZERO check runs and merges
    # unverified.
    branches: [main, 'lakehouse/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────
  verify:
    name: Frontend · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  parity-corpus-secrets:
    name: Parity corpus · no leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The parity corpus is captured from a live system and committed to git.
      # capture.ts strips credentials on every run; this is the backstop that
      # catches a corpus sanitized by hand or captured with a stale script.
      - name: Scan corpus for credential-shaped values
        run: ./rust/tests/parity/check-no-secrets.sh

  # ── Rust: fast feedback ──────────────────────────────────────────────
  fmt:
    name: Rust · fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: rust

  clippy:
    name: Rust · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: rust

  build:
    name: Rust · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build --locked
        run: cargo build --locked
        working-directory: rust

  # ── Rust: tests (Docker/testcontainers required — Postgres) ─────────
  test:
    name: Rust · test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # "stable" for the current toolchain the project actually ships
        # with; the workspace's declared MSRV (rust/Cargo.toml
        # `rust-version`) so a regression there fails CI honestly instead
        # of silently drifting. See docs/CI.md for how 1.88 was derived.
        toolchain: ["stable", "1.88.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.toolchain }}

      # Needed by lakehouse-bi's specs_match_typescript drift guard, which
      # shells out to `bun` to cross-check lakehouse_bi::specs against
      # src/lib/dashboard-specs.ts. It skips cleanly without bun, but this
      # job is where it should actually run.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      # ubuntu-latest ships Docker; lakehouse-test-support's integration
      # tests spin up real Postgres via testcontainers.
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
        working-directory: rust

  # ── Rust: G1 acceptance (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md §3,
  # G1-RESULT.md) — half (a) only, run INSIDE the compose network via the
  # `g1-test-runner` service (docker-compose.yml). Half (b) stays
  # `#[ignore]`d; it is blocked on an upstream ClickHouse defect, not
  # something this job should chase. ──
  g1-rustfs:
    name: Rust · G1 acceptance (RustFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          EOF

      # `docker compose run` honors `depends_on` conditions for whatever
      # it's given, so this single command brings up the whole RustFS →
      # Lakekeeper → ClickHouse dependency chain itself (no separate
      # `up -d` needed) before running the test in-network.
      - name: Run G1 half (a) inside the compose network
        run: docker compose -p g1ci --profile test run --rm g1-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g1ci logs

      - name: Tear down
        if: always()
        run: docker compose -p g1ci down -v

  # ── Rust: G2 storage-boundary matrix (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md
  # §3, docs/STORAGE-COMPATIBILITY.md) — same G1 half-(a) suite against
  # SeaweedFS instead of RustFS, by profile/env change only. Proves the S3
  # API, not a specific store, is the architectural boundary. ──
  g2-seaweedfs:
    name: Rust · G2 storage boundary (SeaweedFS)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          EOF

      - name: Bring up SeaweedFS + its warehouse registration
        run: >
          docker compose -p g2ci --profile seaweedfs up -d
          seaweedfs seaweedfs-bucket-init lakekeeper-warehouse-init-seaweedfs

      - name: Run G1 half (a) inside the compose network, against SeaweedFS
        run: >
          docker compose -p g2ci --profile test --profile seaweedfs run --rm
          -e LAKEKEEPER_WAREHOUSE=seaweedfs
          -e CH_RUSTFS_S3_ENDPOINT=http://seaweedfs:8333
          g1-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g2ci logs

      - name: Tear down
        if: always()
        run: docker compose -p g2ci down -v

  # ── G3a acceptance (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md §3) — dlt,
  # running inside Dagster, reads a real Postgres table and writes it to
  # Bronze Iceberg through Lakekeeper; the result is visible in the
  # console catalog, and lineage is recorded. See
  # docs/adr/0005-dagster-code-location-ownership-and-packaging.md and
  # ops/g3a/g3a_test.py. ──
  g3a-dagster:
    name: Rust · G3a Dagster + dlt Bronze ingest
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          EOF

      - name: Bring up lakehouse-api + Dagster + the G3a source table
        run: >
          docker compose -p g3aci --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          g3a-source-init

      - name: Run the G3a end-to-end test inside the compose network
        run: docker compose -p g3aci --profile dagster run --rm g3a-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g3aci logs

      - name: Tear down
        if: always()
        run: docker compose -p g3aci down -v
