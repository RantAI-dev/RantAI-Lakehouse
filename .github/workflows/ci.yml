  # ── SRC-12 part C (decisions 6, 7, 8, 12): OAuth sign-in for a REST connector
  # against a provider the gate runs itself (`ops/g6/src12_oauth_test.py`): PKCE
  # S256 sign-in driven as a browser would, a load that outlives one 5-second
  # access token, the rotated refresh token sealed and used by the next load, a
  # wrong and a replayed `state` refused, a refresh token the provider no longer
  # honours failing once as `sign_in_refused`, and sign-out and delete calling
  # the revocation address. Own job (the bring-up of `g6-credentials` is 12 to 14
  # minutes and the gate itself about 3 more); the stack is the one
  # `g6-secret-managers` uses, without the two secret-manager fixtures. The
  # provider is a thread of the gate's runner; the two gate-only settings
  # (`CONNECTOR_OAUTH_ALLOW_HTTP`, and the callback address, the same string the
  # gate computes) are in the CI-only `.env` below. Not run against a real
  # stack before it reached CI; the first runs are its measurement. ──
  g6-oauth:
    name: Rust · SRC-12 OAuth sign-in
    needs: [changes, images]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAKEHOUSE_API_IMAGE: rantai-lakehouse-api:ci
      LAKEHOUSE_DAGSTER_IMAGE: rantai-lakehouse-dagster:ci
      COMPOSE: >-
        docker compose -p src12oci -f docker-compose.yml
        -f ops/g6/docker-compose.g6.override.yml
        -f ops/g6/docker-compose.src12.override.yml
        --profile g6-sql --profile g6-ops --profile dagster
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download image artifacts (lakehouse-api + dagster)
        uses: actions/download-artifact@v8
        with:
          pattern: image-lakehouse-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load images
        run: |
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do
            zstd -dc "$f" | docker load
          done

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          MYSQL_ROOT_PASSWORD=ci-mysql-not-real-123
          CONNECTOR_MYSQL_PASSWORD=ci-mysql-connector-not-real-123
          MSSQL_SA_PASSWORD=Ci-Mssql-Not-Real-123!
          MARIADB_G6_ROOT_PASSWORD=ci-mariadb-not-real-123
          CONNECTOR_MARIADB_PASSWORD=ci-mariadb-connector-not-real-123
          SFTP_G6_PASSWORD=ci-sftp-not-real-123
          MONGO_G6_ROOT_USER=ci-mongo-root-not-real
          MONGO_G6_ROOT_PASSWORD=ci-mongo-not-real-123
          INGEST_SERVICE_TOKEN=ci-ingest-service-token-not-real-123
          PIPELINE_RUN_TOKEN=ci-pipeline-run-token-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          UPLOAD_S3_ACCESS_KEY=ci-only-rustfs-access
          UPLOAD_S3_SECRET_KEY=ci-only-rustfs-secret-0001
          CONNECTOR_AUTO_DISABLE_AFTER=3
          CONNECTOR_OAUTH_REDIRECT_URI=http://lakehouse-api:8080/api/connectors/oauth/callback
          CONNECTOR_OAUTH_ALLOW_HTTP=true
          # SEC-18: docker-compose.yml has no default credentials. CI-ONLY
          # throwaway values for this job's own throwaway stack; they protect
          # nothing and are never used outside it.
          POSTGRES_PASSWORD=ci-only-pg-password-0001
          RUSTFS_ACCESS_KEY=ci-only-rustfs-access
          RUSTFS_SECRET_KEY=ci-only-rustfs-secret-0001
          LAKEKEEPER_ENCRYPTION_KEY=ci-only-lakekeeper-key-0001
          EOF
          # SEC-36: generated per run; no key-shaped literal in the repository.
          echo "CONNECTOR_SECRETS_KEY=$(openssl rand -base64 32)" >> .env

      - name: Build the oidc-mock fixture image
        run: $COMPOSE build oidc-mock

      - name: Bring up the stack
        run: >
          $COMPOSE up -d --no-build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          mysql-g6 clickhouse-iceberg-init

      - name: Gate, OAuth sign-in
        shell: bash
        run: |
          $COMPOSE run --rm -T --no-deps g6-ops-test-runner \
            "pip install -q requests && python src12_oauth_test.py" 2>&1 | tee "$RUNNER_TEMP/src12o.log"

      - name: Add the gate's lines to the job summary
        if: always()
