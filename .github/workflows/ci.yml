  # ── Image smoke test (moved from docker.yml) ────────────────────────
  # The container's own boot path, not the compose stack: does the image the
  # acceptance jobs share start and answer /health? It used to be the Docker
  # workflow's `build-and-smoke-test`, which built its OWN copy of the API
  # image (702s of the Docker workflow's ~750s) on every PR. It now runs the
  # image the `images` job built, so it costs seconds and still runs on
  # every PR that can change the image (same `if:` as `images`).
  image-smoke:
    name: Image smoke test · lakehouse-api /health
    needs: [changes, images]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Download image artifact (lakehouse-api)
        uses: actions/download-artifact@v8
        with:
          name: image-lakehouse-api
          path: ${{ runner.temp }}/images

      - name: Load image
        run: zstd -dc "$RUNNER_TEMP"/images/lakehouse-api.tar.zst | docker load

      # No DATABASE_URL: the entrypoint skips migrations when it's unset,
      # and lakehouse-api is designed to boot and serve its
      # Postgres/ClickHouse-independent routes (including /health) even
      # without either dependency running — see entrypoint.api.sh and
      # lakehouse_store::connect_lazy's doc comment. This intentionally
      # smoke-tests the container's own boot path, not the full
      # docker-compose stack.
      # SRC-12 decision 4 (SRC-12 review 1 BLOCKER 1): the API refuses to start
      # without `CONNECTOR_SECRETS_KEY`, and this job runs the image outside
      # compose, so it passes the key itself. The same obviously fake CI-only
      # value every other job writes into its `.env`; the start-up check stays.
      - name: Run container
        run: |
          # SEC-36: generated for this run; no key-shaped literal in the repository.
          # Exported: `docker run -e NAME` forwards only an exported variable.
          export CONNECTOR_SECRETS_KEY="$(openssl rand -base64 32)"
          docker run -d --name lakehouse-api -p 8080:8080 \
            -e CONNECTOR_SECRETS_KEY \
            rantai-lakehouse-api:ci
          for i in $(seq 1 30); do
            if docker inspect -f '{{.State.Running}}' lakehouse-api 2>/dev/null | grep -q true; then
              break
            fi
            sleep 1
          done

      - name: Wait for /health and assert 200
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8080/health || echo "000")
            if [ "$code" = "200" ]; then
              echo "got 200 from /health"
              exit 0
            fi
            echo "attempt $i: got $code, retrying..."
            sleep 2
          done
          echo "::error::/health never returned 200"
          exit 1

      - name: Container logs (always, for debugging)
        if: always()
        run: docker logs lakehouse-api || true

      - name: Stop container
        if: always()
        run: docker rm -f lakehouse-api || true

  # ── DATA-16 (F2) — time travel keeps the policy. A Bronze table is
  # loaded twice through bronze_ingest_job and read at its OLDER version:
  # the admin gets clear text, a masked and row-filtered Analyst gets ***
  # and only the allowed rows, also with the pin inside a subquery or CTE.
  # See ops/g8/g8_time_travel_test.py. Needs the Bronze-ingest stack, so it
  # is shaped like g3a-dagster above (same .env, same services) plus
  # clickhouse-iceberg-init, which the runner's depends_on starts. ──
  g8-time-travel:
    name: Rust · G8 time travel keeps the policy
    needs: [changes, images]
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LAKEHOUSE_API_IMAGE: rantai-lakehouse-api:ci
      LAKEHOUSE_DAGSTER_IMAGE: rantai-lakehouse-dagster:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Images from the `images` job; see `g3a-dagster`'s download step.
      - name: Download image artifacts (lakehouse-api + dagster)
        uses: actions/download-artifact@v8
        with:
          pattern: image-lakehouse-*
          merge-multiple: true
          path: ${{ runner.temp }}/images

      - name: Load images
        run: |
          for f in "$RUNNER_TEMP"/images/*.tar.zst; do
            zstd -dc "$f" | docker load
          done

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          # PR #83 review round 2, BLOCKER 1: SEC-18 docker-compose.yml has no
          # default credentials. CI-ONLY throwaway values for this job's own
          # throwaway stack; they protect nothing and are never used outside it.
          POSTGRES_PASSWORD=ci-only-pg-password-0001
          RUSTFS_ACCESS_KEY=ci-only-rustfs-access
          RUSTFS_SECRET_KEY=ci-only-rustfs-secret-0001
          LAKEKEEPER_ENCRYPTION_KEY=ci-only-lakekeeper-key-0001
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          # Same as g3a-dagster's .env: bronze_ingest_job dials this compose
          # network's own `postgres`, which the dlt SSRF guard refuses unless
          # the gate opts in for itself.
          INGEST_ALLOW_INTERNAL_HOSTS=true
          EOF
          # SEC-36: generated per run; no key-shaped literal in the repository.
          echo "CONNECTOR_SECRETS_KEY=$(openssl rand -base64 32)" >> .env

      # Fixture image, built here rather than shared; see `g3a-dagster`.
      - name: Build the oidc-mock fixture image
        run: docker compose -p g8ttci --profile dagster build oidc-mock

      - name: Bring up lakehouse-api + Dagster + the demo source table + the Iceberg query database
        run: >
          docker compose -p g8ttci --profile dagster up -d --no-build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          g3a-source-init clickhouse-iceberg-init

      - name: Run the time-travel acceptance test inside the compose network
        run: docker compose -p g8ttci --profile dagster run --rm g8-time-travel-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g8ttci logs

      - name: Tear down
        if: always()
        run: docker compose -p g8ttci down -v

  # ── CI Required Gate ────────────────────────────────────────────────
  # The single gate job that evaluates the entire CI run and enforces that
  # all required jobs passed or were legitimately skipped based on the
  # detected change scope.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - repo-lints
      - verify
      - fmt
      - clippy
      - build
      - test
      - msrv
      - dagster-unit-tests
      - dagster-loader-tests
      - g1-rustfs
      - g2-seaweedfs
      - g3a-dagster
      - g3-maintenance
      - g4-cdc
      - g6-ingest
      - g6-ingest-other
      - g6-oracle
      - g9-upload
      - g6-alerts
      - g6-ops
      - g6-credentials
      - g6-secret-managers
      - g6-oauth
      - g6-discovery-scale
      - gold-export
      - g8-governance
      - g8-time-travel
      - images
      - image-smoke
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-test required gate
        run: bash ./scripts/ci/tests/test_required_gate.sh

      - name: Enforce required gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RUST: ${{ needs.changes.outputs.rust }}
          SCOPE_FRONTEND: ${{ needs.changes.outputs.frontend }}
          SCOPE_DAGSTER: ${{ needs.changes.outputs.dagster }}
          SCOPE_STACK: ${{ needs.changes.outputs.stack }}
          SCOPE_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SCOPE_ALL: ${{ needs.changes.outputs.all }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_LINTS_RESULT: ${{ needs.repo-lints.result }}
          FRONTEND_RESULT: ${{ needs.verify.result }}
          RUST_FMT_RESULT: ${{ needs.fmt.result }}
          RUST_CLIPPY_RESULT: ${{ needs.clippy.result }}
          RUST_BUILD_RESULT: ${{ needs.build.result }}
          RUST_TEST_RESULT: ${{ needs.test.result }}
          RUST_MSRV_RESULT: ${{ needs.msrv.result }}
          DAGSTER_TESTS_RESULT: ${{ needs.dagster-unit-tests.result }}
          DAGSTER_LOADER_TESTS_RESULT: ${{ needs.dagster-loader-tests.result }}
          G1_RUSTFS_RESULT: ${{ needs.g1-rustfs.result }}
          G2_SEAWEEDFS_RESULT: ${{ needs.g2-seaweedfs.result }}
          G3A_DAGSTER_RESULT: ${{ needs.g3a-dagster.result }}
          G3_MAINTENANCE_RESULT: ${{ needs.g3-maintenance.result }}
          G4_CDC_RESULT: ${{ needs.g4-cdc.result }}
          G6_INGEST_RESULT: ${{ needs.g6-ingest.result }}
          G6_INGEST_OTHER_RESULT: ${{ needs.g6-ingest-other.result }}
          G6_ORACLE_RESULT: ${{ needs.g6-oracle.result }}
          G9_UPLOAD_RESULT: ${{ needs.g9-upload.result }}
          G6_ALERTS_RESULT: ${{ needs.g6-alerts.result }}
          G6_OPS_RESULT: ${{ needs.g6-ops.result }}
          G6_CREDENTIALS_RESULT: ${{ needs.g6-credentials.result }}
          G6_SECRET_MANAGERS_RESULT: ${{ needs.g6-secret-managers.result }}
          G6_OAUTH_RESULT: ${{ needs.g6-oauth.result }}
          G6_DISCOVERY_SCALE_RESULT: ${{ needs.g6-discovery-scale.result }}
          GOLD_EXPORT_RESULT: ${{ needs.gold-export.result }}
          G8_GOVERNANCE_RESULT: ${{ needs.g8-governance.result }}
          G8_TIME_TRAVEL_RESULT: ${{ needs.g8-time-travel.result }}
          IMAGES_RESULT: ${{ needs.images.result }}
          IMAGE_SMOKE_RESULT: ${{ needs.image-smoke.result }}
        run: ./scripts/ci/required_gate.sh
