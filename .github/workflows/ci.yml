name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Frontend ──────────────────────────────────────────────────────────
  verify:
    name: Frontend · Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  parity-corpus-secrets:
    name: Parity corpus · no leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The parity corpus is captured from a live system and committed to git.
      # capture.ts strips credentials on every run; this is the backstop that
      # catches a corpus sanitized by hand or captured with a stale script.
      - name: Scan corpus for credential-shaped values
        run: ./rust/tests/parity/check-no-secrets.sh

  # ── Rust: fast feedback ──────────────────────────────────────────────
  fmt:
    name: Rust · fmt
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: rust

  clippy:
    name: Rust · clippy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: rust

  build:
    name: Rust · build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build --locked
        run: cargo build --locked
        working-directory: rust

  # ── Rust: tests (Docker/testcontainers required — Postgres) ─────────
  test:
    name: Rust · test (${{ matrix.toolchain }})
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        # "stable" for the current toolchain the project actually ships
        # with; the workspace's declared MSRV (rust/Cargo.toml
        # `rust-version`) so a regression there fails CI honestly instead
        # of silently drifting. See docs/CI.md for how 1.88 was derived.
        toolchain: ["stable", "1.88.0"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.toolchain }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: ${{ matrix.toolchain }}

      # Needed by lakehouse-bi's specs_match_typescript drift guard, which
      # shells out to `bun` to cross-check lakehouse_bi::specs against
      # src/lib/dashboard-specs.ts. It skips cleanly without bun, but this
      # job is where it should actually run.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      # ubuntu-latest ships Docker; lakehouse-test-support's integration
      # tests spin up real Postgres via testcontainers.
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
        working-directory: rust
