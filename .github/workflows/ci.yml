name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `lakehouse/**` as well as main: the lakehouse foundation work ships as a
    # stack of PRs that target each other rather than main, so a `[main]`-only
    # filter means every PR above the first gets ZERO check runs and merges
    # unverified.
    branches: [main, 'lakehouse/**']

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # F4: a push to main must finish its run; cancelling it made its ci-required read as failed.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  # ── Change Scope Detection ──────────────────────────────────────────
  # Classifies the pull request diff or push into change scopes. Downstream
  # jobs condition their execution on these scope outputs, allowing docs-only
  # or frontend-only PRs to skip expensive Rust builds and acceptance tests.
  changes:
    name: Detect Change Scope
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      rust: ${{ steps.scope.outputs.rust }}
      frontend: ${{ steps.scope.outputs.frontend }}
      dagster: ${{ steps.scope.outputs.dagster }}
      stack: ${{ steps.scope.outputs.stack }}
      docs_only: ${{ steps.scope.outputs.docs_only }}
      all: ${{ steps.scope.outputs.all }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Self-test runs before the scope script is executed to ensure
      # classification invariants are preserved.
      - name: Self-test change-scope detection
        run: bash ./scripts/ci/tests/test_detect_change_scope.sh

      - name: Detect change scope
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: ./scripts/ci/detect_change_scope.sh

  # ── Repo Lints (merged: parity corpus, R11, compose init, Dagster imports) ──
  # Folded into a single job with one step each: these four fast static checks
  # (5-8 seconds each) run unconditionally on every push/PR without wasting
  # separate runner slots.
  repo-lints:
    name: Repo lints
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The parity corpus is captured from a live system and committed to git.
      # capture.ts strips credentials on every run; this is the backstop that
      # catches a corpus sanitized by hand or captured with a stale script.
      - name: Scan corpus for credential-shaped values (parity corpus)
        run: ./rust/tests/parity/check-no-secrets.sh

      # docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md §5, R11 (measured in
      # docs/plans/P5-RESULT.md): ClickHouse 26.3's bare, unqualified
      # count() against a merge-on-read Iceberg table silently overcounts
      # once equality deletes are present — a wrong number, not an error.
      # See ops/lint/check_bare_iceberg_count.py for exactly what this
      # does and does not cover.
      - name: Check for bare count() against Bronze Iceberg tables (R11)
        run: python3 ops/lint/check_bare_iceberg_count.py

      # WS0 items 8-9: the postgres healthcheck must probe TCP (not the
      # image's temporary init-phase Unix-socket-only server), and
      # openfga-db-init must retry its CREATE DATABASE instead of
      # failing outright on a transient race. See
      # ops/lint/check_compose_init_readiness.py for exactly what this
      # does and does not cover — it is a static check on the checked-in
      # YAML, not a substitute for the `docker compose up` proof in this
      # task's own commit body.
      - name: Check compose init-container readiness (WS0)
        run: python3 ops/lint/check_compose_init_readiness.py

      # A dangling `from dispar_orchestrate.X import Y` is an ImportError at
      # code-location load, which takes down EVERY job in the location — the
      # visible symptom is G3a failing with "'bronze_ingest_job' not in
      # GET /api/pipelines", which points nowhere near the cause. `py_compile`
      # cannot catch it (per-file syntax only, no import resolution). See
      # ops/lint/check_intra_package_imports.py for the limits of this check.
      - name: Check intra-package imports (Dagster)
        run: python3 ops/lint/check_intra_package_imports.py

      # SRC-9 task 8 (decision 6): every connector type the migrations list as
      # supported has a gate in ops/gates/coverage.json, with all four steps
      # covered or an explicit, printed waiver. Fails on a migration that
      # touches connector_type in a shape it cannot read, so a new supported
      # type cannot slip in unnoticed. See ops/lint/check_connector_gate_coverage.py.
      - name: Check connector gate coverage (SRC-9)
        run: python3 ops/lint/check_connector_gate_coverage.py

      # The unit tests of that check and of the gates' registry and result
      # table module (no network, no containers; seconds).
      - name: Unit-test the connector gate coverage tooling (SRC-9)
        run: |
          python3 -m unittest discover -s ops/lint -p 'test_*.py'
          python3 -m unittest discover -s ops/gates -p 'test_*.py'

  # ── Frontend ────────────────────────────────────────────────────────
  verify:
    name: Frontend · Lint · Typecheck · Test · Build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.frontend == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit tests
        run: bun run test

      - name: Build
        run: bun run build

  dagster-unit-tests:
    name: Dagster · unit tests
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      # `dagster/dispar_orchestrate/test_maintenance.py` existed and was run
      # by nobody — it asserts, among other things, that Bronze maintenance
      # skips `gold.*` tables, which is a regression guard for applied
      # maintenance running against the Gold export's data. A test that no
      # job executes is documentation, not a guard.
      #
      # Installs the code location's real pinned dependencies rather than a
      # reduced set, so the test runs against the same `dagster` version the
      # compose image builds. That costs install time but means a passing
      # run actually says something about the shipped artifact.
      - name: Install the code location and test deps
        run: |
          python -m pip install --upgrade pip
          pip install ./dagster pytest==8.3.4

      - name: pytest
        run: python -m pytest dispar_orchestrate -v
        working-directory: dagster

  # ── Rust: fast feedback ─────────────────────────────────────────────
  fmt:
    name: Rust · fmt
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: rust

  clippy:
    name: Rust · clippy
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings
        working-directory: rust

  build:
    name: Rust · build
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust

      - name: cargo build --locked
        run: cargo build --locked
        working-directory: rust

  # ── Rust: tests (Docker/testcontainers required — Postgres) ───────────
  test:
    name: Rust · test (stable)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: stable

      # Needed by lakehouse-bi's specs_match_typescript drift guard, which
      # shells out to `bun` to cross-check lakehouse_bi::specs against
      # src/lib/dashboard-specs.ts. It skips cleanly without bun, but this
      # job is where it should actually run.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.12"

      # ubuntu-latest ships Docker; lakehouse-test-support's integration
      # tests spin up real Postgres via testcontainers.
      - name: cargo test --workspace --locked
        run: cargo test --workspace --locked
        working-directory: rust

  # ── Rust: MSRV compile check ─────────────────────────────────────────
  # In PR 1, the 1.88.0 MSRV test run is converted into a fast compile check
  # (cargo check --workspace --all-targets --locked) so we ensure MSRV
  # compatibility without duplicating the full integration test run time.
  msrv:
    name: Rust · MSRV check (1.88.0)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88.0"

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
          key: msrv-1.88.0

      - name: cargo check --workspace --all-targets --locked
        run: cargo check --workspace --all-targets --locked
        working-directory: rust

  # ── Rust: G1 acceptance (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md §3,
  # G1-RESULT.md) — half (a) only, run INSIDE the compose network via the
  # `g1-test-runner` service (docker-compose.yml). Half (b) stays
  # `#[ignore]`d; it is blocked on an upstream ClickHouse defect, not
  # something this job should chase. ──
  g1-rustfs:
    name: Rust · G1 acceptance (RustFS)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          EOF

      # `docker compose run` honors `depends_on` conditions for whatever
      # it's given, so this single command brings up the whole RustFS →
      # Lakekeeper → ClickHouse dependency chain itself (no separate
      # `up -d` needed) before running the test in-network.
      - name: Run G1 half (a) inside the compose network
        run: docker compose -p g1ci --profile test run --rm g1-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g1ci logs

      - name: Tear down
        if: always()
        run: docker compose -p g1ci down -v

  # ── Rust: G2 storage-boundary matrix (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md
  # §3, docs/STORAGE-COMPATIBILITY.md) — same G1 half-(a) suite against
  # SeaweedFS instead of RustFS, by profile/env change only. Proves the S3
  # API, not a specific store, is the architectural boundary. ──
  g2-seaweedfs:
    name: Rust · G2 storage boundary (SeaweedFS)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          EOF

      - name: Bring up SeaweedFS + its warehouse registration
        run: >
          docker compose -p g2ci --profile seaweedfs up -d
          seaweedfs seaweedfs-bucket-init lakekeeper-warehouse-init-seaweedfs

      # R1 (ADR 0011) flipped Lakekeeper's authz backend to `openfga`, so a
      # principal with no relation on a warehouse gets 404
      # NoSuchWarehouseException (Lakekeeper hides existence rather than
      # returning 403). Grants are per-warehouse-id, so the `default`/RustFS
      # grants made by `lakekeeper-authz-init` do NOT cover the `seaweedfs`
      # warehouse — without this step the G1 suite fails with
      # "A warehouse 'seaweedfs' does not exist". Run (not `up -d`) so the
      # step blocks until the grants are actually applied: `g1-test-runner`
      # only `depends_on` the default `lakekeeper-authz-init`, so nothing
      # else sequences this one.
      - name: Grant the test principals on the SeaweedFS warehouse
        run: >
          docker compose -p g2ci --profile seaweedfs run --rm
          lakekeeper-authz-init-seaweedfs

      - name: Run G1 half (a) inside the compose network, against SeaweedFS
        run: >
          docker compose -p g2ci --profile test --profile seaweedfs run --rm
          -e LAKEKEEPER_WAREHOUSE=seaweedfs
          -e CH_RUSTFS_S3_ENDPOINT=http://seaweedfs:8333
          g1-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g2ci logs

      - name: Tear down
        if: always()
        run: docker compose -p g2ci down -v

  # ── G3a acceptance (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md §3) — dlt,
  # running inside Dagster, reads a real Postgres table and writes it to
  # Bronze Iceberg through Lakekeeper; the result is visible in the
  # console catalog, and lineage is recorded. See
  # docs/adr/0005-dagster-code-location-ownership-and-packaging.md and
  # ops/g3a/g3a_test.py. ──
  g3a-dagster:
    name: Rust · G3a Dagster + dlt Bronze ingest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          # dagster-code-location's `dlt` SSRF guard fail-closed refuses
          # to dial `BRONZE_SOURCE_DB_HOST` (hardcoded to this compose
          # network's own `postgres`, docker-compose.yml) unless this is
          # set -- the guard's default posture, unchanged for every OTHER
          # deployment (docker-compose.yml's own comment on this var).
          # This gate's `bronze_ingest_job` run IS that co-located,
          # operator-configured source, so it opts in for itself here,
          # the same "gate sets it in its own .env" shape
          # `ops/g6/docker-compose.g6.override.yml`'s header comment
          # documents for its own fixtures.
          INGEST_ALLOW_INTERNAL_HOSTS=true
          EOF

      - name: Bring up lakehouse-api + Dagster + the G3a source table
        run: >
          docker compose -p g3aci --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          g3a-source-init

      - name: Run the G3a end-to-end test inside the compose network
        run: docker compose -p g3aci --profile dagster run --rm g3a-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g3aci logs

      - name: Tear down
        if: always()
        run: docker compose -p g3aci down -v

  # ── P4 (G3) acceptance (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md §3) —
  # the Bronze maintenance job (expire_snapshots, the one measured-working
  # verb — see docs/plans/G3-RESULT.md for why remove_orphan_files and
  # OPTIMIZE are NOT run in-engine) and the dry_run metrics console
  # surface (GET /api/governance/maintenance). Same shape as g3a-dagster
  # above; see ops/g3/g3_test.py. ──
  g3-maintenance:
    name: Rust · G3 Bronze maintenance job
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          # Same as g3a-dagster's own .env above: `ops/g3/g3_test.py`
          # triggers `bronze_ingest_job` too (its own module doc, "if no
          # Bronze table is registered yet"), which hits the same `dlt`
          # SSRF guard against this compose network's own `postgres`.
          INGEST_ALLOW_INTERNAL_HOSTS=true
          EOF

      - name: Bring up lakehouse-api + Dagster + the G3a source table
        run: >
          docker compose -p g3ci --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          g3a-source-init

      - name: Run the G3/P4 maintenance acceptance test inside the compose network
        run: docker compose -p g3ci --profile dagster run --rm g3-maintenance-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g3ci logs

      - name: Tear down
        if: always()
        run: docker compose -p g3ci down -v

  # ── P5 (G4) acceptance (docs/plans/LAKEHOUSE-FOUNDATION-PLAN.md §3,
  # docs/plans/P5-RESULT.md) — Debezium Server + debezium-server-iceberg
  # captures a real Postgres table via logical replication; INSERT/UPDATE/
  # DELETE are all visible in ClickHouse within the agreed latency, and
  # replication-slot cleanup on connector delete is verified. WS5 item C3:
  # this job ALSO now needs the Dagster webserver/daemon and
  # lakehouse-api -- g4_test.py's step_wal_breach_produces_a_
  # silenceable_alert_instance (WS5 acceptance) logs into lakehouse-api,
  # launches replication_slot_check_job through the Dagster webserver's
  # GraphQL `launchRun` (the daemon's run queue actually executes it),
  # and drives /api/alerts/run + /api/overview/alerts. Brought up with
  # the same lakehouse-api/dagster-code-location/dagster-webserver/
  # dagster-daemon set g3a-dagster/g3-maintenance already use, for the
  # same reason. See ops/g4/g4_test.py. ──
  g4-cdc:
    name: Rust · G4 Debezium CDC into Bronze
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          # WS5 item C3: step_wal_breach_produces_a_silenceable_alert_instance
          # calls POST /api/alerts/run with a bootstrap-admin (human)
          # session, never a service-identity principal. With
          # ALERTS_RUN_TOKEN unset, routes::alerts::check_run_token
          # (D4, fail-closed) refuses anything but a service principal,
          # so the gate needs a shared token here -- an obviously-fake
          # CI value, same style as AUTH_BOOTSTRAP_PASSWORD above.
          ALERTS_RUN_TOKEN=ci-alerts-run-token-not-real-123
          # The OIDC authorization-code round trip (g4_test.py's last
          # step) needs lakehouse-api pointed at oidc-mock; unset, the
          # /api/auth/oidc/* routes answer 503 "not configured". The
          # client id is oidc-mock's configured token audience.
          OIDC_ISSUER=http://oidc-mock:8090
          OIDC_CLIENT_ID=lakekeeper
          OIDC_JWKS_URL=http://oidc-mock:8090/jwks.json
          OIDC_AUTHORIZE_URL=http://oidc-mock:8090/authorize
          OIDC_TOKEN_URL=http://oidc-mock:8090/token
          OIDC_REDIRECT_URI=http://lakehouse-api:8080/api/auth/oidc/callback
          OIDC_JIT_PROVISIONING=true
          OIDC_ROLE_MAP=lakehouse-analysts=Analyst
          EOF

      - name: Bring up Postgres/ClickHouse/RustFS/Lakekeeper, the demo CDC source, Debezium Server, and Dagster
        # SRC-9 task 6: the `-f` pair on every compose call of this job (the
        # override adds the `file:` credential store and the internal-host
        # flag the connect and discover steps of the gate need).
        run: >
          docker compose -p g4ci -f docker-compose.yml -f ops/g4/docker-compose.g4.override.yml
          --profile dagster up -d --build
          postgres clickhouse rustfs rustfs-bucket-init
          lakekeeper-db-init lakekeeper-migrate lakekeeper lakekeeper-warehouse-init
          g4-source-init debezium-server
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon

      - name: Run the G4 acceptance test inside the compose network
        # `tee` and `-T`: the gate prints its connector table between two
        # marker lines and the next step copies it to the job summary (same
        # as g6-ingest). `shell: bash` for pipefail.
        shell: bash
        run: |
          docker compose -p g4ci -f docker-compose.yml -f ops/g4/docker-compose.g4.override.yml \
            --profile dagster run --rm -T g4-test-runner 2>&1 | tee "$RUNNER_TEMP/g4-run.log"

      - name: Add the connector gate table to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/g4-run.log" ]; then
            awk '/^GATE-SUMMARY-BEGIN$/{inside=1; next} /^GATE-SUMMARY-END$/{inside=0} inside' \
              "$RUNNER_TEMP/g4-run.log" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g4ci -f docker-compose.yml -f ops/g4/docker-compose.g4.override.yml --profile dagster logs

      - name: Tear down
        if: always()
        run: docker compose -p g4ci -f docker-compose.yml -f ops/g4/docker-compose.g4.override.yml --profile dagster down -v

  # ── WS3 (G6) acceptance — the Tier 1 ingestion matrix: one connector
  # per adapter is registered, given an ingest-spec, run, and its rows
  # verified in Bronze through ClickHouse; plus the column gate, CDC's honest
  # supported:false, and Sheets' honest supported:false. Same
  # g1-rustfs/g3a-dagster/g4-cdc shape.
  #
  # SRC-9 decision 9: the gate is ONE script (ops/g6/g6_ingest_matrix_test.py)
  # run by TWO jobs, selected by G6_GROUP, so each stays under 20 minutes.
  # This job is G6_GROUP=sql: PostgreSQL, MySQL, MariaDB and SQL Server, the
  # SRC-7 (wrong-password MySQL connector) and SRC-8 (schema drift on MySQL)
  # steps, which use the MySQL fixture, and the column gate, the CDC refusal
  # and the Sheets refusal, which need only the API and Dagster. Object
  # storage, REST, MongoDB, Kafka and SFTP, and the link-local half (it
  # needs a Kafka fixture), are in `g6-ingest-other`. Each job's table shows
  # the other's types as `skipped`, "covered by job <name>". ──
  g6-ingest:
    name: Rust · G6 ingest matrix (SQL sources)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    # 25, not 20, as the job timeout (PR #101, product owner 2026-10-10): it
    # is the cut-off, not the target. Before the split this one job took
    # 21m56s to 22m48s, 13 of them bringing the stack up (the API image build
    # dominates). SRC-9 decision 9 split it so each half's TARGET is under 20
    # minutes; the CI runs of the final commit are the measurement
    # (docs/plans/SRC-9-RESULT.md).
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        # The same nine fixture secrets as `g6-ingest-other`, though this half
        # starts only the SQL fixtures: ops/g6/docker-compose.g6.override.yml
        # makes each fixture's password `${VAR:?}`, and compose interpolates
        # that for every service in the files it loads, whatever the
        # profile, so a smaller .env fails at `up` ("required variable ... is
        # missing a value", checked with `docker compose config`). They are
        # obviously fake values of a throwaway stack, not defaults in a
        # compose file.
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          MYSQL_ROOT_PASSWORD=ci-mysql-not-real-123
          CONNECTOR_MYSQL_PASSWORD=ci-mysql-connector-not-real-123
          MSSQL_SA_PASSWORD=Ci-Mssql-Not-Real-123!
          MARIADB_G6_ROOT_PASSWORD=ci-mariadb-not-real-123
          CONNECTOR_MARIADB_PASSWORD=ci-mariadb-connector-not-real-123
          SFTP_G6_PASSWORD=ci-sftp-not-real-123
          MONGO_G6_ROOT_USER=ci-mongo-root-not-real
          MONGO_G6_ROOT_PASSWORD=ci-mongo-not-real-123
          INGEST_SERVICE_TOKEN=ci-ingest-service-token-not-real-123
          PIPELINE_RUN_TOKEN=ci-pipeline-run-token-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          EOF

      - name: Bring up the g6 SQL matrix (gate-only INGEST_ALLOW_INTERNAL_HOSTS override)
        # Explicit service list, not a bare `up` on the activated
        # profiles: this project also activates "dagster" (for
        # dagster-webserver/-daemon, which g6_ingest_matrix_test.py polls
        # while a triggered connector run executes), and that profile
        # also contains `debezium-server`, pinned to a Debezium image
        # digest no longer resolvable upstream (g4-cdc's own known,
        # unrepinned gap — a human decision, out of this job's scope). A
        # bare `up` with no service names starts every service in an
        # active profile, including that one, and fails the whole step;
        # naming exactly what the SQL half of
        # `ops/g6/g6_ingest_matrix_test.py` needs starts only those
        # services' own dependency closures, which does not reach
        # `debezium-server`. `--profile g6-sql`, not `g6`: the runner's
        # `depends_on` then skips the fixtures of the other half.
        run: >
          docker compose -p g6ci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml
          --profile g6-sql --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          g3a-source-init mysql-g6 mariadb-g6 mssql-g6 mssql-g6-cert-init

      - name: Run the G6 ingest matrix test inside the compose network
        # Same `-f` pair as the "up" step above -- `g6-test-runner`'s OWN
        # `MYSQL_ROOT_PASSWORD`/`CONNECTOR_MYSQL_PASSWORD`/`MSSQL_SA_PASSWORD`/
        # `MONGO_G6_ROOT_USER`/`MONGO_G6_ROOT_PASSWORD` env and its
        # `g6_secrets` volume mount (the REST/mysql/mssql connectors'
        # `file:`-derived credentials) are added by the override, not the
        # base file; omitting `-f` here would run this service from the
        # base file's definition alone, missing all of that. Also
        # `--profile dagster`, not only `--profile g6`: `g6-test-runner`
        # depends on `dagster-code-location`, which is profile "dagster"
        # -- the same "compose validates depends_on against the active
        # profile set" mechanism the kafka-g6-spoofed/g6-test-runner-
        # linklocal fix above explains, here on the other side of the
        # same edge. `dagster-code-location` is already running from the
        # "up" step above; activating its profile for this `run` only
        # satisfies validation, it does not start anything new.
        #
        # SRC-9 task 1: the output is also written to a file, because the gate
        # prints its coverage table between two marker lines and the next step
        # copies it into the job summary (the gate runs in a container and
        # cannot write the host's GITHUB_STEP_SUMMARY). `shell: bash` gives
        # `pipefail`, so the gate's exit code still fails this step; `-T`
        # stops compose allocating a pseudo-terminal, which would add carriage
        # returns to every line.
        shell: bash
        run: |
          docker compose -p g6ci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml \
            --profile g6-sql --profile dagster run --rm -T -e G6_GROUP=sql g6-test-runner 2>&1 | tee "$RUNNER_TEMP/g6-run.log"

      - name: Add the connector gate table to the job summary
        # `always()`: a failed gate prints its table too, and that table is
        # what says which type and step failed. Nothing is appended if the
        # gate never reached the point where it prints it.
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/g6-run.log" ]; then
            awk '/^GATE-SUMMARY-BEGIN$/{inside=1; next} /^GATE-SUMMARY-END$/{inside=0} inside' \
              "$RUNNER_TEMP/g6-run.log" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g6ci logs

      - name: Tear down the g6 matrix project
        if: always()
        run: docker compose -p g6ci down -v

  # ── SRC-9 decision 9: the second half of the G6 gate (G6_GROUP=other),
  # in a job of its own so each half stays under 20 minutes: object storage,
  # REST, MongoDB, Kafka and SFTP, the MongoDB Debezium-template check, and
  # the SEPARATE, override-free link-local project (it needs a Kafka
  # fixture). It brings up only the fixtures these need (profile `g6-other`,
  # no MySQL, MariaDB, SQL Server or `g3a-source-init`). Same script, same
  # override and same scope gate as `g6-ingest`. ──
  g6-ingest-other:
    name: Rust · G6 ingest matrix (files, APIs, streams)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    # The cut-off, as in `g6-ingest`; the target is under 20 minutes.
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        # All nine fixture secrets although only the REST, MongoDB, Kafka and
        # SFTP fixtures start here: see `g6-ingest`'s .env step for why a
        # smaller file fails at `up`. Obviously fake, throwaway.
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          MYSQL_ROOT_PASSWORD=ci-mysql-not-real-123
          CONNECTOR_MYSQL_PASSWORD=ci-mysql-connector-not-real-123
          MSSQL_SA_PASSWORD=Ci-Mssql-Not-Real-123!
          MARIADB_G6_ROOT_PASSWORD=ci-mariadb-not-real-123
          CONNECTOR_MARIADB_PASSWORD=ci-mariadb-connector-not-real-123
          SFTP_G6_PASSWORD=ci-sftp-not-real-123
          MONGO_G6_ROOT_USER=ci-mongo-root-not-real
          MONGO_G6_ROOT_PASSWORD=ci-mongo-not-real-123
          INGEST_SERVICE_TOKEN=ci-ingest-service-token-not-real-123
          PIPELINE_RUN_TOKEN=ci-pipeline-run-token-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          EOF

      - name: Bring up the g6 files, APIs and streams matrix (gate-only INGEST_ALLOW_INTERNAL_HOSTS override)
        # Explicit service list, as `g6-ingest` explains (the dagster profile
        # also holds debezium-server). `--profile g6-other`: the runner's
        # `depends_on` skips the SQL fixtures.
        run: >
          docker compose -p g6otherci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml
          --profile g6-other --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          sftp-g6 sftp-g6-hostkey-init rest-stub-g6 mongo-g6 kafka-g6

      - name: Run the G6 ingest matrix test (files, APIs, streams) inside the compose network
        # Same `-f` pair and profiles as the "up" step, and the same reasons
        # for `tee`, `-T` and `shell: bash` as `g6-ingest`'s run step.
        # `-e G6_GROUP=other` selects this half of the one gate script.
        shell: bash
        run: |
          docker compose -p g6otherci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml \
            --profile g6-other --profile dagster run --rm -T -e G6_GROUP=other g6-test-runner 2>&1 | tee "$RUNNER_TEMP/g6-other-run.log"

      - name: Add the connector gate table to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/g6-other-run.log" ]; then
            awk '/^GATE-SUMMARY-BEGIN$/{inside=1; next} /^GATE-SUMMARY-END$/{inside=0} inside' \
              "$RUNNER_TEMP/g6-other-run.log" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g6otherci logs

      - name: Tear down the g6 files, APIs and streams project
        if: always()
        run: docker compose -p g6otherci down -v

      - name: Bring up a SEPARATE, override-free (for INGEST_ALLOW_INTERNAL_HOSTS) project for the link-local assertion
        # "Override-free" means no `ops/g6/docker-compose.g6.override.yml`
        # (that is the file that sets INGEST_ALLOW_INTERNAL_HOSTS=true —
        # exactly the property this test proves is false by default).
        # `ops/g6/docker-compose.g6-linklocal-secrets.override.yml` is a
        # SEPARATE, narrower file that widens nothing this test checks —
        # see its own header — and is required: without it, neither
        # `dagster-code-location` nor `g6-test-runner-linklocal` has the
        # `g6_linklocal_secrets` mount the REST connector's credential
        # write needs. Explicit service list, same "debezium-server is
        # profile dagster too" reason as the g6 matrix `up` step above —
        # a bare `up` here would try to start it and fail. `dagster-
        # webserver`/`dagster-daemon` are both needed too, same as the g6
        # matrix half above: `POST /api/connectors/{id}/ingest/run`
        # launches the run through `lakehouse-api`'s own `DAGSTER_URL`
        # (this job's `.env`), and the daemon is what actually executes a
        # queued run — without them the script's very first launch call
        # fails outright ("fetch failed"), never reaching the link-local
        # assertion at all.
        run: >
          docker compose -p g6ci-linklocal -f docker-compose.yml -f ops/g6/docker-compose.g6-linklocal-secrets.override.yml
          --profile g6-linklocal --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon kafka-g6-spoofed

      - name: Run the link-local rejection test (default compose, flag unset)
        run: >
          docker compose -p g6ci-linklocal -f docker-compose.yml -f ops/g6/docker-compose.g6-linklocal-secrets.override.yml
          --profile g6-linklocal --profile dagster run --rm g6-test-runner-linklocal

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g6ci-linklocal logs

      - name: Tear down the link-local project
        if: always()
        run: docker compose -p g6ci-linklocal down -v

  # ── SRC-9 plan task 5 (decision 5): the Oracle connector gate, in a job of
  # its own. Oracle Database Free is a ~1.3 GB image that needs about 2 GB of
  # memory (a GitHub-hosted runner has 16 GB) and opens its pluggable database
  # in a minute or two, and g6-ingest is already at 22 of its 25 minutes. It
  # brings up only what ONE batch sql connector needs: the API, the Dagster
  # code location that runs the ingest, and their dependencies, plus the
  # Oracle fixture. See ops/g6/g6_oracle_test.py and
  # ops/g6/docker-compose.g6-oracle.override.yml. Scope gate as g6-ingest. ──
  g6-oracle:
    name: Rust · G6 Oracle connector
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        # Alphanumeric on purpose: the Oracle image creates the application
        # user from CONNECTOR_ORACLE_PASSWORD, and the SQLAlchemy URL the
        # adapter builds carries it too. Obviously fake, a throwaway stack.
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          ORACLE_G6_PASSWORD=CiOracleSysNotReal123
          CONNECTOR_ORACLE_PASSWORD=CiOracleConnectorNotReal123
          INGEST_SERVICE_TOKEN=ci-ingest-service-token-not-real-123
          PIPELINE_RUN_TOKEN=ci-pipeline-run-token-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          EOF

      - name: Bring up the Oracle gate stack (gate-only INGEST_ALLOW_INTERNAL_HOSTS override)
        # Explicit service list, as g6-ingest explains (the dagster profile
        # also holds debezium-server). No mysql/mssql/mongo/kafka/mariadb/sftp
        # fixtures and no g3a-source-init: this gate loads no other connector.
        run: >
          docker compose -p g6oracleci -f docker-compose.yml -f ops/g6/docker-compose.g6-oracle.override.yml
          --profile g6-oracle --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon oracle-g6

      - name: Run the G6 Oracle gate inside the compose network
        # `shell: bash` for pipefail, `-T` for no pseudo-terminal: the same
        # reasons as the g6-ingest run step. The gate prints its table
        # between two marker lines and the next step copies it to the summary.
        shell: bash
        run: |
          docker compose -p g6oracleci -f docker-compose.yml -f ops/g6/docker-compose.g6-oracle.override.yml \
            --profile g6-oracle --profile dagster run --rm -T g6-oracle-test-runner 2>&1 | tee "$RUNNER_TEMP/g6-oracle-run.log"

      - name: Add the connector gate table to the job summary
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/g6-oracle-run.log" ]; then
            awk '/^GATE-SUMMARY-BEGIN$/{inside=1; next} /^GATE-SUMMARY-END$/{inside=0} inside' \
              "$RUNNER_TEMP/g6-oracle-run.log" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g6oracleci -f docker-compose.yml -f ops/g6/docker-compose.g6-oracle.override.yml --profile g6-oracle --profile dagster logs

      - name: Tear down
        if: always()
        run: docker compose -p g6oracleci -f docker-compose.yml -f ops/g6/docker-compose.g6-oracle.override.yml --profile g6-oracle --profile dagster down -v

  # ── DATA-9 (G9) acceptance, in CI since SRC-9 plan task 7: the upload gate
  # (ops/g9/upload_test.py) uploads a delimited file, a workbook and a
  # Parquet file, previews and loads each through file_ingest_job into a raw
  # table, loads again with append, deletes the upload, and reads the rows
  # back through ClickHouse. Same condition as g6-ingest: the scope gate, so
  # a documentation-only change skips it and anything under rust/, dagster/,
  # ops/, scripts/ or compose runs it (scripts/ci/detect_change_scope.sh). ──
  g9-upload:
    name: Rust · G9 file upload
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          # lakehouse-api has no default upload credential (unset, every
          # upload answers 503 "Upload storage is not configured"). RustFS
          # 1.0.0-rc.4 has no non-root S3 identity (docker-compose.yml, the
          # CONNECTOR_S3_* note), so the gate hands the API RustFS's own root
          # key, which this stack takes from the compose default
          # (RUSTFS_ACCESS_KEY / RUSTFS_SECRET_KEY unset here), the same
          # value the Dagster services already default to. A throwaway CI
          # stack, never a deployment value.
          UPLOAD_S3_ACCESS_KEY=rustfsadmin
          UPLOAD_S3_SECRET_KEY=rustfsadmin
          EOF

      - name: Bring up lakehouse-api, Dagster and the API's Iceberg query database
        # Explicit service list, as g6-ingest explains: a bare `up` on the
        # dagster profile would also start debezium-server. clickhouse-
        # iceberg-init is named because nothing but the gate depends on it.
        run: >
          docker compose -p g9ci --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          clickhouse-iceberg-init

      - name: Run the G9 upload test inside the compose network
        run: docker compose -p g9ci --profile dagster run --rm g9-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g9ci logs

      - name: Tear down
        if: always()
        run: docker compose -p g9ci down -v

  # ── SRC-17 (finding F4, the delivery review of 2026-10-12): the alert
  # delivery gate (ops/g6/src17_alert_delivery_test.py). A real failed
  # connector run and a real failed upload each reach a webhook the gate
  # receives within 5 minutes of the run's end (the seconds are printed), and
  # a webhook that answers 500 is listed as not delivered with a fixed reason
  # and none of the receiver's text. E-mail is not measured (the sender has no
  # mode without verified TLS; the plan's D-d says why). It is a job of its own
  # so no existing gate job grows: g6-ingest is at 19m54s of its 20 minutes.
  # It brings up only the API, Dagster, the MySQL fixture (a wrong password
  # makes a run fail in seconds) and the ClickHouse database an upload load
  # asks about, with the same override as g6-ingest.
  #
  # SEC-10 (alert webhooks cannot reach internal addresses) is NOT built yet.
  # The receiver is a listener in the gate's own container, on the compose
  # network. When SEC-10 lands it will refuse that address by default and must
  # give this gate its documented opt-in; the gate must not weaken the default.
  # Scope gate as g6-ingest. ──
  g6-alerts:
    name: Rust · SRC-17 alert delivery
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        # The nine fixture secrets of g6-ingest, though only the MySQL
        # fixture starts: ops/g6/docker-compose.g6.override.yml makes each
        # `${VAR:?}`, which compose interpolates for every service in the
        # files it loads. UPLOAD_S3_* as in g9-upload (the API has no default
        # upload credential). PIPELINE_RUN_TOKEN is what lets the sensors
        # report a failed run to the API, which is the path under test.
        # Obviously fake values of a throwaway stack.
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          MYSQL_ROOT_PASSWORD=ci-mysql-not-real-123
          CONNECTOR_MYSQL_PASSWORD=ci-mysql-connector-not-real-123
          MSSQL_SA_PASSWORD=Ci-Mssql-Not-Real-123!
          MARIADB_G6_ROOT_PASSWORD=ci-mariadb-not-real-123
          CONNECTOR_MARIADB_PASSWORD=ci-mariadb-connector-not-real-123
          SFTP_G6_PASSWORD=ci-sftp-not-real-123
          MONGO_G6_ROOT_USER=ci-mongo-root-not-real
          MONGO_G6_ROOT_PASSWORD=ci-mongo-not-real-123
          INGEST_SERVICE_TOKEN=ci-ingest-service-token-not-real-123
          PIPELINE_RUN_TOKEN=ci-pipeline-run-token-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          UPLOAD_S3_ACCESS_KEY=rustfsadmin
          UPLOAD_S3_SECRET_KEY=rustfsadmin
          EOF

      - name: Bring up the alert delivery stack (gate-only INGEST_ALLOW_INTERNAL_HOSTS override)
        # Explicit service list, as g6-ingest explains (the dagster profile
        # also holds debezium-server). `--profile g6-sql` makes `mysql-g6`
        # a valid dependency of the runner; only the services named here start.
        run: >
          docker compose -p g6alertsci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml
          --profile g6-sql --profile g6-alerts --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          mysql-g6 clickhouse-iceberg-init

      - name: Run the SRC-17 alert delivery gate inside the compose network
        # `shell: bash` for pipefail and `-T` for no pseudo-terminal, as the
        # g6-ingest run step explains; the same `-f` pair as the "up" step.
        shell: bash
        run: |
          docker compose -p g6alertsci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml \
            --profile g6-sql --profile g6-alerts --profile dagster run --rm -T g6-alerts-test-runner 2>&1 | tee "$RUNNER_TEMP/g6-alerts-run.log"

      - name: Add the measured seconds to the job summary
        # `always()`: a failed gate prints its lines too. Only the gate's own
        # `SRC-17` lines are copied.
        if: always()
        shell: bash
        run: |
          if [ -f "$RUNNER_TEMP/g6-alerts-run.log" ]; then
            {
              echo '### SRC-17 alert delivery'
              echo '```'
              grep -E '^\[g6-alerts\]' "$RUNNER_TEMP/g6-alerts-run.log" | grep -E 'SRC-17|PASS|FAILED' || true
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g6alertsci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml --profile g6-sql --profile g6-alerts --profile dagster logs

      - name: Tear down the alert delivery project
        if: always()
        run: docker compose -p g6alertsci -f docker-compose.yml -f ops/g6/docker-compose.g6.override.yml --profile g6-sql --profile g6-alerts --profile dagster down -v

  # ── ADR 0010 acceptance — Gold export to Iceberg, from Rust:
  # `lakehouse-api::routes::gold` reads a real `serving.*` Gold mart from
  # ClickHouse and appends it to the `gold` Iceberg namespace through
  # Lakekeeper, then reads it back through `iceberg-rust`. Same
  # `g1-rustfs`/`g3a-dagster` shape; no Dagster webserver dependency (the
  # export route is called directly), so this uses the `test` profile
  # like `g1-rustfs`. `GOLD_EXPORT_RUN_TOKEN` must be identical for both
  # `lakehouse-api` (brought up first) and `gold-export-test-runner`
  # (run second) — both read it from this job's `.env`. See
  # ops/gold_export/gold_export_test.py. ──
  gold-export:
    name: Rust · Gold export to Iceberg (ADR 0010)
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          GOLD_EXPORT_RUN_TOKEN=ci-gold-export-token-not-a-real-secret
          EOF

      - name: Bring up lakehouse-api (and its full Lakekeeper/authz chain)
        run: docker compose -p goldci up -d --build lakehouse-api

      - name: Run the Gold export acceptance test inside the compose network
        run: docker compose -p goldci --profile test run --rm gold-export-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p goldci logs

      - name: Tear down
        if: always()
        run: docker compose -p goldci down -v

  # ── WS7 (Hard Requirement 10, item H2) — an authored masking policy
  # masks a column for an Analyst and shows it in clear text for an
  # admin; a bare SELECT */CTE-wrapped SELECT * bypass attempt is masked
  # or refused identically. See ops/g8/g8_governance_test.py. Brings up
  # only lakehouse-api (which pulls in postgres+clickhouse via its own
  # depends_on, docker-compose.yml:99-102) — same shape as the
  # `gold-export` job above, not `g4-cdc` below (that one needs the full
  # CDC/dagster chain for unrelated reasons this gate has no part of). ──
  g8-governance:
    name: Rust · G8 governance masking
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          EOF

      - name: Bring up lakehouse-api (and postgres/clickhouse via its own depends_on)
        run: docker compose -p g8ci up -d --build lakehouse-api

      - name: Run the G8 governance acceptance test inside the compose network
        run: docker compose -p g8ci --profile test run --rm g8-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g8ci logs

      - name: Tear down
        if: always()
        run: docker compose -p g8ci down -v

  # ── DATA-16 (F2) — time travel keeps the policy. A Bronze table is
  # loaded twice through bronze_ingest_job and read at its OLDER version:
  # the admin gets clear text, a masked and row-filtered Analyst gets ***
  # and only the allowed rows, also with the pin inside a subquery or CTE.
  # See ops/g8/g8_time_travel_test.py. Needs the Bronze-ingest stack, so it
  # is shaped like g3a-dagster above (same .env, same services) plus
  # clickhouse-iceberg-init, which the runner's depends_on starts. ──
  g8-time-travel:
    name: Rust · G8 time travel keeps the policy
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.rust == 'true' || needs.changes.outputs.dagster == 'true' || needs.changes.outputs.stack == 'true' || needs.changes.outputs.all == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          # Same as g3a-dagster's .env: bronze_ingest_job dials this compose
          # network's own `postgres`, which the dlt SSRF guard refuses unless
          # the gate opts in for itself.
          INGEST_ALLOW_INTERNAL_HOSTS=true
          EOF

      - name: Bring up lakehouse-api + Dagster + the demo source table + the Iceberg query database
        run: >
          docker compose -p g8ttci --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          g3a-source-init clickhouse-iceberg-init

      - name: Run the time-travel acceptance test inside the compose network
        run: docker compose -p g8ttci --profile dagster run --rm g8-time-travel-test-runner

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g8ttci logs

      - name: Tear down
        if: always()
        run: docker compose -p g8ttci down -v

  # ── CI Required Gate ────────────────────────────────────────────────
  # The single gate job that evaluates the entire CI run and enforces that
  # all required jobs passed or were legitimately skipped based on the
  # detected change scope.
  ci-required:
    name: ci-required
    runs-on: ubuntu-latest
    if: always()
    needs:
      - changes
      - repo-lints
      - verify
      - fmt
      - clippy
      - build
      - test
      - msrv
      - dagster-unit-tests
      - g1-rustfs
      - g2-seaweedfs
      - g3a-dagster
      - g3-maintenance
      - g4-cdc
      - g6-ingest
      - g6-ingest-other
      - g6-oracle
      - g9-upload
      - g6-alerts
      - gold-export
      - g8-governance
      - g8-time-travel
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Self-test required gate
        run: bash ./scripts/ci/tests/test_required_gate.sh

      - name: Enforce required gate
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCOPE_RUST: ${{ needs.changes.outputs.rust }}
          SCOPE_FRONTEND: ${{ needs.changes.outputs.frontend }}
          SCOPE_DAGSTER: ${{ needs.changes.outputs.dagster }}
          SCOPE_STACK: ${{ needs.changes.outputs.stack }}
          SCOPE_DOCS_ONLY: ${{ needs.changes.outputs.docs_only }}
          SCOPE_ALL: ${{ needs.changes.outputs.all }}
          CHANGES_RESULT: ${{ needs.changes.result }}
          REPO_LINTS_RESULT: ${{ needs.repo-lints.result }}
          FRONTEND_RESULT: ${{ needs.verify.result }}
          RUST_FMT_RESULT: ${{ needs.fmt.result }}
          RUST_CLIPPY_RESULT: ${{ needs.clippy.result }}
          RUST_BUILD_RESULT: ${{ needs.build.result }}
          RUST_TEST_RESULT: ${{ needs.test.result }}
          RUST_MSRV_RESULT: ${{ needs.msrv.result }}
          DAGSTER_TESTS_RESULT: ${{ needs.dagster-unit-tests.result }}
          G1_RUSTFS_RESULT: ${{ needs.g1-rustfs.result }}
          G2_SEAWEEDFS_RESULT: ${{ needs.g2-seaweedfs.result }}
          G3A_DAGSTER_RESULT: ${{ needs.g3a-dagster.result }}
          G3_MAINTENANCE_RESULT: ${{ needs.g3-maintenance.result }}
          G4_CDC_RESULT: ${{ needs.g4-cdc.result }}
          G6_INGEST_RESULT: ${{ needs.g6-ingest.result }}
          G6_INGEST_OTHER_RESULT: ${{ needs.g6-ingest-other.result }}
          G6_ORACLE_RESULT: ${{ needs.g6-oracle.result }}
          G9_UPLOAD_RESULT: ${{ needs.g9-upload.result }}
          G6_ALERTS_RESULT: ${{ needs.g6-alerts.result }}
          GOLD_EXPORT_RESULT: ${{ needs.gold-export.result }}
          G8_GOVERNANCE_RESULT: ${{ needs.g8-governance.result }}
          G8_TIME_TRAVEL_RESULT: ${{ needs.g8-time-travel.result }}
        run: ./scripts/ci/required_gate.sh
