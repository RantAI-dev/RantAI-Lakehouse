    timeout-minutes: 15
    env:
      LAKEHOUSE_API_IMAGE: rantai-lakehouse-api:ci
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The API image comes from the `images` job, built once per run; this
      # job never compiles it. This job starts no Dagster service, so it
      # does not download the (larger) Dagster image.
      - name: Download image artifact (lakehouse-api)
