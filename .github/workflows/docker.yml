name: Docker

# Tag pushes only. On pushes to `main` and on pull requests the API image is
# built, smoke-tested and shared by `ci.yml` (`images` and `image-smoke`
# jobs, CI-SPEED-PLAN §4.2), so building it here as well was a second,
# 12-minute copy of the same release build on every PR. What is left is the
# one thing `ci.yml` does not do: check that a release tag still builds, and
# hold the (inert) GHCR job below.
on:
  push:
    tags: ["v*"]

concurrency:
  group: docker-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-image:
    name: Build lakehouse-api image (tags only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      # Same build arguments and contexts as `ci.yml`'s `images` job, so the
      # `api-image` layer cache that job writes from `main` is a hit here;
      # a different `CARGO_TARGET_DIR` would be a different layer and a cold
      # 10-minute build. This workflow only READS that cache: a tag build
      # writing its own would add to the repository's Actions cache, which
      # is at its 10 GB cap (docs/CI.md, "Caches").
      #
      # `cacheonly` because nothing here consumes the image: the build is the
      # check. The `/health` smoke test it used to run now lives in `ci.yml`
      # (`image-smoke`), which runs it on every push to `main`.
      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: rust
          file: rust/Dockerfile
          # The Dockerfile copies the Dagster pipeline source from a named
          # build context, as docker-compose.yml's `additional_contexts`
          # provides it. Without this, buildx resolves `pipeline_src` as an
          # image on Docker Hub and the build fails.
          build-contexts: |
            pipeline_src=dagster/dispar_orchestrate
          build-args: |
            CARGO_TARGET_DIR=/build/target-layer
          push: false
          outputs: type=cacheonly
          cache-from: type=gha,scope=api-image

  # Not run today: gated on tags only, and inert even then — no registry
  # credentials are configured, so a tag push would fail loudly at
  # `docker/login-action` rather than silently publishing. Publishing to
  # GHCR is a deliberate, separate decision for a later release phase; see
  # docs/CI.md.
  push-ghcr:
    name: Push to GHCR (tags only — currently inert)
    if: startsWith(github.ref, 'refs/tags/')
    needs: build-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Not wired up yet
        run: |
          echo "::notice::GHCR publishing is intentionally not enabled yet."
          echo "This job is gated on tag pushes so it stays inert on every"
          echo "normal branch/PR run. Actually publishing requires a"
          echo "deliberate follow-up: add docker/login-action with a GHCR"
          echo "credential, then docker/build-push-action with push: true."
          echo "Not done here — see docs/CI.md and the Phase 5 handoff notes."
          exit 0
