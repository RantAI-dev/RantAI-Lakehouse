# DATA-24 T3 (decision D3): the catalog search benchmark, run by hand.
#
# `ops/bench/catalog_search_bench.py` measures how long a search takes on a
# catalog of 10,000 tables of 20 columns, against the 500 ms target in
# `docs/core/features/catalog-search.md`. The harness has never run against a
# stack, so there is no measured number to write into
# `docs/plans/DATA-11-RESULT.md` yet.
#
# This workflow is that run: it starts the stack the bench needs on a GitHub
# runner, seeds a THROWAWAY catalog, times the searches, and writes the JSON
# to the step summary. The planner reads the numbers from the summary and
# writes the result document.
#
# A workflow of its own, started only with "Run workflow", for three reasons:
#
# - It is a MEASUREMENT, not an acceptance gate. It builds the API image,
#   starts a stack, seeds 10,000 tables and waits out the search copy's age
#   before it searches. Nothing about a pull request should wait for that.
# - ci.yml's jobs are scoped by a change detector that has no meaning for a
#   manual run, and a manual run of ci.yml would start every other job too.
# - It is therefore not in `ci-required` (ci.yml's aggregator), and cannot
#   block a merge.
#
# It is MANUAL on purpose: `seed` WRITES synthetic rows into the two Bronze
# registry tables. It refuses to run without `BENCH_THROWAWAY_CATALOG=true`,
# and the stack it writes into is a throwaway compose project that is deleted
# again at the end of the job.
#
# The stack is the API and what the API needs (Postgres, ClickHouse, the
# OIDC mock), NOT the Iceberg side (Lakekeeper, RustFS, the Dagster code
# location). The search reads the catalog out of ClickHouse's registry
# tables; the Iceberg enrichment the same route does is bounded to 300 ms
# and degrades to "the list is unchanged" when Lakekeeper is not there, so
# leaving it out keeps this job to the part being measured.
name: catalog-search-bench

on:
  workflow_dispatch:
    inputs:
      datasets:
        description: "How many tables to seed (the measured configuration is 10000)."
        default: "10000"
        type: string
      columns:
        description: "How many columns per seeded table (the measured configuration is 20)."
        default: "20"
        type: string
      rounds:
        description: "How many searches per route (the measured configuration is 50)."
        default: "50"
        type: string

permissions:
  contents: read

jobs:
  catalog-search-bench:
    name: Catalog search bench (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Free disk first: the runner image carries toolchains this job never
      # uses, and the API image this job builds is a Rust build.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          # SEC-18: no default credentials in docker-compose.yml. CI-ONLY
          # throwaway values for this job's own throwaway stack (as g9-upload).
          POSTGRES_PASSWORD=ci-only-pg-password-0001
          RUSTFS_ACCESS_KEY=ci-only-rustfs-access
          RUSTFS_SECRET_KEY=ci-only-rustfs-secret-0001
          LAKEKEEPER_ENCRYPTION_KEY=ci-only-lakekeeper-key-0001
          EOF
          echo "CONNECTOR_SECRETS_KEY=$(openssl rand -base64 32)" >> .env

      - name: Bring up the API and what it needs
        # Builds the API image here. `lakehouse-api` pulls in Postgres,
        # ClickHouse and the OIDC mock (its `depends_on`); the OIDC mock
        # mints the token files the API mounts before it becomes healthy,
        # so the API's container can be created.
        run: >
          docker compose -p benchsearch up -d --build
          lakehouse-api

      - name: Wait for the API
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://localhost:8080/health
          docker compose -p benchsearch ps

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Seed the throwaway catalog
        env:
          # The promise the bench asks for before it writes anything: this
          # catalog is thrown away with the stack, never a shared one.
          BENCH_THROWAWAY_CATALOG: "true"
          # ClickHouse publishes 8123 on the host (`CH_HTTP_HOST_PORT`).
          BENCH_CLICKHOUSE_URL: http://localhost:8123
          # The stack's `default` user has no password: `docker-compose.yml`
          # leaves `CH_PASSWORD` empty, and that user is allowed to connect
          # without one.
          CLICKHOUSE_USER: default
          CLICKHOUSE_PASSWORD: ""
          BENCH_DATASETS: ${{ inputs.datasets }}
          BENCH_COLUMNS: ${{ inputs.columns }}
        run: |
          python3 -m pip install --quiet requests
          python3 ops/bench/catalog_search_bench.py seed \
            --datasets "$BENCH_DATASETS" \
            --columns "$BENCH_COLUMNS"

      - name: Time the searches
        env:
          LAKEHOUSE_API_URL: http://localhost:8080
          # The account the API seeds at boot (`AUTH_BOOTSTRAP_*` in the
          # .env above); the bench signs in with it and rotates the
          # credential when the API says a rotation is pending.
          AUTH_BOOTSTRAP_EMAIL: ci@example.com
          AUTH_BOOTSTRAP_PASSWORD: ci-password-not-real-123
          BENCH_ROUNDS: ${{ inputs.rounds }}
          BENCH_DATASETS: ${{ inputs.datasets }}
        run: |
          # Fail closed: without pipefail the pipe into `tee` takes tee's exit
          # status and a failed bench reports a green job (the same lesson as
          # g9-upload-large).
          set -o pipefail
          python3 ops/bench/catalog_search_bench.py run \
            --rounds "$BENCH_ROUNDS" \
            --datasets "$BENCH_DATASETS" \
            | tee "$RUNNER_TEMP/bench.json"
          {
            echo '### Catalog search bench'
            echo
            echo 'Command:'
            echo
            echo '```'
            echo "python3 ops/bench/catalog_search_bench.py run --rounds $BENCH_ROUNDS --datasets $BENCH_DATASETS"
            echo '```'
            echo
            echo '```json'
            cat "$RUNNER_TEMP/bench.json"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p benchsearch logs --tail 300

      - name: Tear down
        if: always()
        run: docker compose -p benchsearch down -v
