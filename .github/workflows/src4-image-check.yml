# TEMPORARY (SRC-4 slice 2, stop point S2-a): reads the pinned Kafka Connect image's
# entrypoint on a runner, because the dev VM may not pull images. Deleted in the next commit.
name: src4-image-check
on:
  push:
    branches: [feat/data-phase-4-src-4]
    paths: [.github/workflows/src4-image-check.yml]
jobs:
  entrypoint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          IMG=quay.io/debezium/connect:3.8@sha256:d67d678c726d1659f458e057e4a3a50a3b14c3e85a3be7f31de9db53dfb46668
          docker pull -q "$IMG" >/dev/null
          docker inspect "$IMG" --format 'entrypoint={{json .Config.Entrypoint}} cmd={{json .Config.Cmd}}'
          docker run --rm --entrypoint sh "$IMG" -c 'grep -n "CONNECT_\|config.providers\|PROPERTIES" /docker-entrypoint.sh | head -60'
          echo "--- providers on the classpath:"
          docker run --rm --entrypoint sh "$IMG" -c 'ls /kafka/libs | grep -i "connect-runtime\|connect-api"; unzip -l /kafka/libs/connect-api-*.jar | grep -i "DirectoryConfigProvider"; ls /kafka/config | head'
