# DATA-17 T2.3 / T6.1: the large-file upload harness (ops/g9/large_upload.py), run by hand.
#
# DEFAULTS: 200 MiB per format, well inside the cap, so a manual run on any branch that
# has T6.2 (the session cap and the unpacked cap are both 2 GiB, `MAX_SESSION_BYTES` and
# `MAX_UNPACKED_BYTES` in the API) works as it is, with no throwaway branch.
#
# FULL SIZE (T6.1, opt-in: type these in "Run workflow"): csv_mb=2048 parquet_mb=1945
# parquet_files=10 jsonl_mb=2048 gzip_mb=2048. 2048 MiB is the cap itself, exactly
# 2,147,483,648 bytes, which the API accepts; a size above it is refused by design. The
# figures of these runs are docs/plans/DATA-17-RESULT.md.
#
# CONCURRENT LOADS AND THE FORMATS NOT YET MEASURED (DATA-33, DATA-34): `concurrent`
# (1 by default) is how many loads of the same file run at once; `avro_mb`, `zip_mb`
# and `parquet_one_group_mb` (0 by default, which skips them) add the Avro file, the
# zip of CSVs and the Parquet file of one row group. Their figures are read into
# docs/plans/DATA-17-RESULT.md as well.
#
# A workflow of its own, started only with "Run workflow", for three reasons:
#
# - It is a MEASUREMENT, not an acceptance gate. It takes a long time at full size
#   (a 2 GiB CSV and 1.9 GiB of Parquet through the chunked routes and the load
#   job), and nothing about a pull request should wait for it.
# - ci.yml's jobs are scoped by a change detector that has no meaning for a manual
#   run, and a manual run of ci.yml would start every other job too.
# - It is therefore not in `ci-required` (ci.yml's aggregator), and cannot block a
#   merge. Its numbers are read into docs/plans/DATA-17-RESULT.md (slice 6) by the
#   planner.
#
# It builds the two images in the job (no artifact hand-off from ci.yml), brings
# up the same services as `g9-upload`, and runs the harness ON THE RUNNER, not in
# the compose network, because it reads the containers' cgroups with `docker
# exec` (`memory.current`, `memory.peak`). The first thing it does is free the
# runner's disk: a 2 GiB file is generated, sent and loaded, and the runner has
# about 14 GB free before this step.
name: g9-upload-large

on:
  workflow_dispatch:
    inputs:
      csv_mb:
        description: "Size of the generated CSV in MiB (0 skips it). 2048 is the 2 GiB cap (full T6.1 size, opt-in)."
        default: "200"
        type: string
      parquet_mb:
        description: "MiB of Parquet in all, over the files below (0 skips them). 1945 is 1.9 GiB (full T6.1 size, opt-in); the session cap is 2 GiB per file."
        default: "200"
        type: string
      parquet_files:
        description: "Number of Parquet files"
        default: "10"
        type: string
      jsonl_mb:
        description: "Size of the generated JSON Lines file in MiB (0 skips it). 2048 is the 2 GiB cap (full T6.1 size, opt-in)."
        default: "200"
        type: string
      gzip_mb:
        description: "MiB a generated gzipped CSV unpacks to (0 skips it). The 2 GiB cap counts the unpacked size; 2048 is the full T6.1 size, opt-in."
        default: "200"
        type: string
      concurrent:
        description: "How many loads of the same file run at once (DATA-33). 1 is one load at a time; the loads start together, each into its own table."
        default: "1"
        type: string
      avro_mb:
        description: "Size of the generated Avro file in MiB (0 skips it). DATA-34: the null codec and string fields only."
        default: "0"
        type: string
      zip_mb:
        description: "MiB the CSVs of one generated zip unpack to (0 skips it). DATA-34: the unpacked size is what the 2 GiB cap counts."
        default: "0"
        type: string
      parquet_one_group_mb:
        description: "MiB of the generated Parquet file that holds exactly one row group (0 skips it). DATA-34: the reader decodes a row group whole."
        default: "0"
        type: string

permissions:
  contents: read

jobs:
  g9-upload-large:
    name: Rust · G9 large upload (manual)
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Free disk first: the runner image carries toolchains this job never uses.
      - name: Free runner disk
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force
          df -h /

      - name: Write CI-only .env
        run: |
          cat > .env <<'EOF'
          AUTH_BOOTSTRAP_EMAIL=ci@example.com
          AUTH_BOOTSTRAP_PASSWORD=ci-password-not-real-123
          # SEC-18: no default credentials in docker-compose.yml. CI-ONLY
          # throwaway values for this job's own throwaway stack (as g9-upload).
          POSTGRES_PASSWORD=ci-only-pg-password-0001
          RUSTFS_ACCESS_KEY=ci-only-rustfs-access
          RUSTFS_SECRET_KEY=ci-only-rustfs-secret-0001
          LAKEKEEPER_ENCRYPTION_KEY=ci-only-lakekeeper-key-0001
          LAKEKEEPER_BASE_URI=http://lakekeeper:8181
          DAGSTER_URL=http://dagster-webserver:3000/graphql
          UPLOAD_S3_ACCESS_KEY=ci-only-rustfs-access
          UPLOAD_S3_SECRET_KEY=ci-only-rustfs-secret-0001
          PIPELINE_RUN_TOKEN=ci-pipeline-run-token-not-real-123
          # An upload that does not finish is swept after this many hours; the
          # run is far shorter, and this proves the passthrough of
          # UPLOAD_SESSION_TTL_HOURS (rule 8: a compose edit is proven by `up`).
          UPLOAD_SESSION_TTL_HOURS=48
          EOF
          echo "CONNECTOR_SECRETS_KEY=$(openssl rand -base64 32)" >> .env

      - name: Bring up lakehouse-api, Dagster and the API's Iceberg query database
        # Builds the images here. The service list is g9-upload's.
        run: >
          docker compose -p g9large --profile dagster up -d --build
          lakehouse-api dagster-code-location dagster-webserver dagster-daemon
          clickhouse-iceberg-init

      - name: Wait for the API and the code location
        run: |
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8080/health >/dev/null 2>&1 && break
            sleep 5
          done
          curl -fsS http://localhost:8080/health
          docker compose -p g9large --profile dagster ps

      - name: The API holds the session lifetime it was given
        run: |
          docker compose -p g9large exec -T lakehouse-api printenv UPLOAD_SESSION_TTL_HOURS | grep -x 48

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run the harness
        env:
          LAKEHOUSE_API_URL: http://localhost:8080
          AUTH_BOOTSTRAP_EMAIL: ci@example.com
          AUTH_BOOTSTRAP_PASSWORD: ci-password-not-real-123
          ICEBERG_QUERY_DB: icecat_api
        run: |
          # Fail closed: without pipefail the pipe into `tee` takes tee's exit
          # status and a failed harness reports a green job (g9-upload-large
          # run 39795803595).
          set -o pipefail
          python3 -m pip install --quiet requests pyarrow fastavro
          python3 ops/g9/large_upload.py \
            --csv-mb "${{ inputs.csv_mb }}" \
            --parquet-mb "${{ inputs.parquet_mb }}" \
            --parquet-files "${{ inputs.parquet_files }}" \
            --jsonl-mb "${{ inputs.jsonl_mb }}" \
            --gzip-mb "${{ inputs.gzip_mb }}" \
            --concurrent "${{ inputs.concurrent }}" \
            --avro-mb "${{ inputs.avro_mb }}" \
            --zip-mb "${{ inputs.zip_mb }}" \
            --parquet-one-group-mb "${{ inputs.parquet_one_group_mb }}" \
            --scratch "$RUNNER_TEMP/large" \
            --containers "api=g9large-lakehouse-api-1,dagster=g9large-dagster-code-location-1" \
            | tee "$RUNNER_TEMP/large-upload.txt"
          { echo '### G9 large upload'; echo '```'; tail -n 40 "$RUNNER_TEMP/large-upload.txt"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

      - name: Compose logs (on failure)
        if: failure()
        run: docker compose -p g9large --profile dagster logs --tail 300

      - name: Tear down
        if: always()
        run: docker compose -p g9large --profile dagster down -v
