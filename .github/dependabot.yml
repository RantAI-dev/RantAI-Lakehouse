version: 2
updates:
  # Rust workspace (rust/Cargo.toml, rust/Cargo.lock)
  - package-ecosystem: "cargo"
    directory: "/rust"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      cargo-patch-and-minor:
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore(deps)"

  # Frontend (package.json, bun.lock)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      npm-patch-and-minor:
        update-types: ["patch", "minor"]
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used across .github/workflows/*.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(ci)"
