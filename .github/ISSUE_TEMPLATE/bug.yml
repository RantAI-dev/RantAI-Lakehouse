name: Bug report
description: Report a reproducible problem with RantAI Lakehouse.
title: "fix: <short description>"
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please search existing
        issues first to avoid duplicates.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Tell us what you saw.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Minimal steps to reproduce the behavior.
      placeholder: |
        1. Start the stack with `docker compose up ...`
        2. Call `GET /api/...`
        3. Observe ...
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      multiple: true
      options:
        - Frontend (Next.js / src/)
        - Rust backend (rust/lakehouse-api)
        - Rust backend (other crate)
        - Auth / OIDC
        - Dashboards / BI
        - Pipelines / Dagster
        - Alerts / notifications
        - Docs
        - CI / build
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Commit / version
      description: Output of `git rev-parse HEAD`, or the release tag.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: OS, Bun version, Rust toolchain version, Docker version, etc.
      placeholder: |
        - OS:
        - Bun: `bun --version`
        - Rust: `rustc --version`
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs / output
      render: shell
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and this isn't a duplicate.
          required: true
        - label: I've read the "Status / Known limitations" section of README.md and this isn't one of the documented, intentional limitations.
          required: true
