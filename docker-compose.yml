services:
  # Phase 2 OLTP store (mutation state that ClickHouse — analytics-only, no
  # transactions — is a poor fit for). ClickHouse remains the analytics
  # store; this is additive. Not wired into `depends_on` for lakehouse-api
  # as a hard *ordering* requirement in the "must be healthy before the API
  # even starts" sense — `lakehouse-api` deliberately boots and serves
  # Phase 1 routes even when this container is down (see
  # `lakehouse_store::connect_lazy`'s doc comment). We do still wait for it
  # to report healthy before starting the API purely so first-boot
  # migrations and the bootstrap-admin seed (which both need Postgres) have
  # a real chance to run instead of racing container start order.
  postgres:
    image: postgres:16
    # `wal_level=logical` (+ enough slots/senders for a handful of CDC
    # connectors): P5 needs Postgres logical replication for
    # `debezium-server` to capture `p5_cdc.orders` at all — `replica`
    # (the image's own default) cannot create a logical replication slot.
    # This is on by default for every deployment of this stack now, not
    # gated behind the `dagster` profile, because it is a server restart
    # to change later — cheaper to always run with it than to make an
    # operator recreate this container the first time they need CDC.
    command:
      [
        "postgres",
        "-c", "wal_level=logical",
        "-c", "max_wal_senders=10",
        "-c", "max_replication_slots=10",
      ]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - lakehouse_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse} -d ${POSTGRES_DB:-lakehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  # Analytics store. Most read routes (catalog, overview, governance,
  # dashboards, ...) go through ClickHouse and return 503 without it, so
  # unlike Postgres this one is a genuinely required local dependency, not
  # an optional Phase 2 add-on.
  #
  # Pinned to 26.8 (LTS), not 24.8: Iceberg writes via `DataLakeCatalog`
  # need >= 26.2 (`allow_database_iceberg`), and 26.8 is the version whose
  # behaviour the rest of this stack is actually built against —
  # `docs/plans/CLICKHOUSE-26.8-REMEASUREMENT.md` re-measured every 26.3
  # finding here. It matters at THIS point in the stack rather than later:
  # the Bronze maintenance job's verb set (`remove_orphan_files` works,
  # `expire_snapshots` is refused) is a 26.8 fact, so a branch running 26.3
  # with 26.8-shaped verbs fails its own gate.
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_USER: ${CH_USER:-default}
      CLICKHOUSE_PASSWORD: ${CH_PASSWORD:-}
      CLICKHOUSE_DB: ${CH_DB:-default}
      # Local dev only: lets the default user connect without a password
      # when CH_PASSWORD is left empty (the documented default).
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ports:
      - "${CH_HTTP_HOST_PORT:-8123}:8123"
      - "${CH_NATIVE_HOST_PORT:-9000}:9000"
    volumes:
      - lakehouse_clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  lakehouse-api:
    build:
      context: ./rust
      dockerfile: Dockerfile
    ports:
      - "${API_HOST_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    environment:
      PORT: "8080"
      APP_ENV: ${APP_ENV:-local}
      # ── ClickHouse: points at the compose service by default ──
      CH_URL: ${CH_URL:-http://clickhouse:8123}
      CH_USER: ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
      # ── Dagster: out of scope for the local stack. Left unset/unreachable
      #    on purpose — orchestration-backed routes (pipeline trigger/runs)
      #    degrade to 503 rather than the API refusing to boot. See
      #    docs/OPERATIONS.md "Unavailable in the local stack". ──
      DAGSTER_URL: ${DAGSTER_URL:-http://dagster.invalid:13030/graphql}
      DAGSTER_REPO: ${DAGSTER_REPO:-__repository__}
      DAGSTER_LOCATION: ${DAGSTER_LOCATION:-dispar_orchestrate.definitions}
      # ── LLM: out of scope for the local stack. Needs a real API key, so
      #    AI/agent routes degrade to 503 unless you set LLM_KEY yourself
      #    (e.g. in a local .env). See docs/OPERATIONS.md. ──
      LLM_URL: ${LLM_URL:-https://api.minimax.io/v1}
      LLM_MODEL: ${LLM_MODEL:-MiniMax-M3}
      LLM_KEY: ${LLM_KEY:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-rantai-lake@localhost}
      ALERTS_RUN_TOKEN: ${ALERTS_RUN_TOKEN:-}
      EMBED_SECRET: ${EMBED_SECRET:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_PROVIDER_NAME: ${OIDC_PROVIDER_NAME:-default}
      OIDC_JWKS_URL: ${OIDC_JWKS_URL:-}
      OIDC_JIT_PROVISIONING: ${OIDC_JIT_PROVISIONING:-false}
      OIDC_ROLE_MAP: ${OIDC_ROLE_MAP:-}
      OIDC_GROUPS_CLAIM: ${OIDC_GROUPS_CLAIM:-groups}
      OIDC_CLOCK_SKEW_SECONDS: ${OIDC_CLOCK_SKEW_SECONDS:-60}
      # ── Bootstrap admin: REQUIRED to be able to log in at all. There is
      #    deliberately no default credential — see docs/OPERATIONS.md. ──
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres:5432/${POSTGRES_DB:-lakehouse}}
    restart: unless-stopped

  # P1 — S3-compatible object store, the default self-hosted implementation
  # for the lakehouse warehouse. RustFS, not MinIO (locked decision: MinIO
  # is not a supported target). All access — including bucket bootstrap
  # below — goes through the plain S3 API, never a proprietary admin call.
  #
  # Failure mode: if this is down, Iceberg reads/writes through Lakekeeper
  # fail (object I/O has nowhere to land); it surfaces as connection
  # errors from `lakehouse-iceberg` (P1b) and from Lakekeeper's own REST
  # calls, not as a `lakehouse-api` boot failure — nothing in this phase
  # wires RustFS into the API's own startup path.
  rustfs:
    image: rustfs/rustfs:1.0.0-rc.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      # SECURITY: these defaults are public and well-known — override
      # before exposing this listener beyond localhost.
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      RUSTFS_OBS_LOGGER_LEVEL: info
    ports:
      - "${RUSTFS_HOST_PORT:-9010}:9000"
      - "${RUSTFS_CONSOLE_HOST_PORT:-9011}:9001"
    volumes:
      - lakehouse_rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # One-shot: create the lakehouse warehouse bucket via the plain S3 API
  # (aws-cli `s3api create-bucket`) — never RustFS's admin API. Idempotent:
  # re-running against an already-created bucket is a no-op success.
  rustfs-bucket-init:
    image: amazon/aws-cli:2.36.34
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        aws --endpoint-url http://rustfs:9000 s3api head-bucket
        --bucket ${LAKEHOUSE_WAREHOUSE_BUCKET:-lakehouse-warehouse} 2>/dev/null ||
        aws --endpoint-url http://rustfs:9000 s3api create-bucket
        --bucket ${LAKEHOUSE_WAREHOUSE_BUCKET:-lakehouse-warehouse}
    restart: "no"

  # P1 — one-shot: create Lakekeeper's own Postgres database on the
  # EXISTING `postgres` service. Deliberately a separate database, not a
  # schema mixed into the `lakehouse` application database's `console`
  # schema — Lakekeeper owns and migrates its own schema independently.
  lakekeeper-db-init:
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lakehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      PGDATABASE: ${POSTGRES_DB:-lakehouse}
      LAKEKEEPER_PG_DB: ${LAKEKEEPER_PG_DB:-lakekeeper}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -v ON_ERROR_STOP=1 -tc
        "SELECT 1 FROM pg_database WHERE datname = '$${LAKEKEEPER_PG_DB}'" |
        grep -q 1 ||
        psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$${LAKEKEEPER_PG_DB}\""
    restart: "no"

  # P1 — one-shot: Lakekeeper's own `migrate` subcommand, not hand-written
  # DDL. Must complete before `lakekeeper` (serve) starts.
  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.3
    depends_on:
      lakekeeper-db-init:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-this-is-not-a-secure-key-change-me}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres:5432/${LAKEKEEPER_PG_DB:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres:5432/${LAKEKEEPER_PG_DB:-lakekeeper}
    command: ["migrate"]
    restart: "no"

  # P1 — Iceberg REST catalog (Rust, Apache-2.0). Only path for Iceberg
  # writes — no path-based `IcebergS3` tables in product code. Backed by
  # its own database (`lakekeeper-db-init`, above) on the existing
  # `postgres` service.
  #
  # Failure mode: if this is down, `lakehouse-iceberg` (P1b) and any
  # ClickHouse `DataLakeCatalog` database pointed at it fail closed —
  # metadata operations (create table, commit snapshot, list tables) error
  # out; it does not affect `lakehouse-api`'s own boot or its existing
  # Postgres/ClickHouse-backed routes, which have no dependency on this
  # service in this phase.
  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.3
    # Empty search domain: on hosts whose own /etc/resolv.conf carries a
    # search suffix (VPN/corporate DNS, Tailscale MagicDNS, ...), that
    # suffix leaks into the container's resolv.conf too. Lakekeeper's
    # Rust DNS resolver does not fall back to the bare name the way glibc
    # does, so `postgres` gets expanded to `postgres.<suffix>`, NXDOMAINs,
    # and the process exits — verified against this exact failure mode
    # during P1a verification. See docs/OPERATIONS.md.
    dns_search: ["."]
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY:-this-is-not-a-secure-key-change-me}
      LAKEKEEPER__PG_DATABASE_URL_READ: postgres://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres:5432/${LAKEKEEPER_PG_DB:-lakekeeper}
      LAKEKEEPER__PG_DATABASE_URL_WRITE: postgres://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres:5432/${LAKEKEEPER_PG_DB:-lakekeeper}
      LAKEKEEPER__BASE_URI: ${LAKEKEEPER_BASE_URI:-http://localhost:8181}
    command: ["serve"]
    ports:
      - "${LAKEKEEPER_HOST_PORT:-8181}:8181"
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  # P1b — one-shot: bootstrap the Lakekeeper SERVER (accept-terms-of-use,
  # idempotent — a second call against an already-bootstrapped server is
  # tolerated, not retried into an error) and register the
  # `lakehouse-iceberg` warehouse against the RustFS bucket
  # `rustfs-bucket-init` created above.
  #
  # `sts-enabled: true` is deliberate, not a placeholder: P1b's G1
  # verification found that Lakekeeper only returns short-lived
  # `s3.access-key-id`/`s3.secret-access-key`/`s3.session-token` values on
  # `X-Iceberg-Access-Delegation: vended-credentials` when the warehouse's
  # storage profile has STS enabled. With `sts-enabled: false` (the
  # profile's own default), Lakekeeper instead responds with a
  # `remote-signing` configuration (`s3.signer.uri`/`s3.signer.endpoint`,
  # no key material at all) — a different delegation mechanism this
  # crate deliberately does not implement (see
  # `lakehouse-iceberg::catalog`'s module doc and ADR 0002). RustFS accepts
  # `sts-role-arn` as an opaque string and does not validate it against a
  # real IAM identity, so the placeholder ARN below is sufficient for a
  # local/CI RustFS-backed warehouse; a real AWS S3 deployment would need a
  # real assumable role instead.
  lakekeeper-warehouse-init:
    image: alpine:3.20
    depends_on:
      lakekeeper:
        condition: service_healthy
      rustfs-bucket-init:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER_BASE_URI: ${LAKEKEEPER_BASE_URI:-http://localhost:8181}
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      LAKEHOUSE_WAREHOUSE_BUCKET: ${LAKEHOUSE_WAREHOUSE_BUCKET:-lakehouse-warehouse}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache curl jq >/dev/null
        base="http://lakekeeper:8181"
        already=$$(curl -fsS "$$base/management/v1/info" | jq -r '.bootstrapped')
        if [ "$$already" != "true" ]; then
          curl -fsS -X POST "$$base/management/v1/bootstrap" \
            -H 'Content-Type: application/json' \
            -d '{"accept-terms-of-use": true}'
        fi
        exists=$$(curl -fsS "$$base/management/v1/warehouse" | \
          jq -r --arg name "$$LAKEKEEPER_WAREHOUSE" \
          '.warehouses[]? | select(.name == $$name) | .name')
        if [ "$$exists" != "$$LAKEKEEPER_WAREHOUSE" ]; then
          curl -fsS -X POST "$$base/management/v1/warehouse" \
            -H 'Content-Type: application/json' \
            -d '{
              "warehouse-name": "'"$$LAKEKEEPER_WAREHOUSE"'",
              "storage-profile": {
                "type": "s3",
                "bucket": "'"$$LAKEHOUSE_WAREHOUSE_BUCKET"'",
                "region": "us-east-1",
                "endpoint": "http://rustfs:9000",
                "path-style-access": true,
                "sts-enabled": true,
                "sts-role-arn": "arn:aws:iam::000000000000:role/lakekeeper"
              },
              "storage-credential": {
                "type": "s3",
                "credential-type": "access-key",
                "aws-access-key-id": "'"$$RUSTFS_ACCESS_KEY"'",
                "aws-secret-access-key": "'"$$RUSTFS_SECRET_KEY"'"
              }
            }'
        fi
    restart: "no"

  # P2 — runs the G1 acceptance suite
  # (`lakehouse-iceberg/tests/g1_lakekeeper.rs`) INSIDE the compose network,
  # where `rustfs`/`lakekeeper`/`clickhouse` resolve by their compose
  # service DNS names. This is the fix for the "not CI-runnable" defect
  # recorded in docs/plans/G1-RESULT.md: Lakekeeper vends this test's S3
  # client the `http://rustfs:9000` endpoint (the compose-internal name),
  # which only resolves from inside this network — a host-run `cargo test`
  # cannot reach it without editing /etc/hosts. Never starts on a plain
  # `docker compose up` (opt-in `test` profile).
  #
  # Only half (a) is run here (`-- g1_half_a`) — half (b) stays
  # `#[ignore]`d and is a standing marker for the upstream ClickHouse
  # defect documented in G1-RESULT.md; it is not expected to pass and is
  # deliberately excluded from this regression guard.
  #
  # Usage (RustFS, the default store):
  #   docker compose -p <project> --profile test run --rm g1-test-runner
  #
  # Usage (SeaweedFS, G2 matrix — env/config only, no compose file edit).
  # BOTH steps are required: `run` only starts this service's own
  # `depends_on` chain, which covers `lakekeeper-warehouse-init` (the
  # `default`/RustFS warehouse) but NOT
  # `lakekeeper-warehouse-init-seaweedfs`. Skipping step 1 fails with
  # `A warehouse 'seaweedfs' does not exist` (404 NoSuchWarehouseException).
  #   1. docker compose -p <project> --profile seaweedfs up -d
  #   2. docker compose -p <project> --profile test --profile seaweedfs run --rm \
  #        -e LAKEKEEPER_WAREHOUSE=seaweedfs \
  #        -e CH_RUSTFS_S3_ENDPOINT=http://seaweedfs:8333 \
  #        g1-test-runner
  # This is what `.github/workflows/ci.yml`'s `g2-seaweedfs` job does.
  g1-test-runner:
    profiles: ["test"]
    image: rust:1.96.1-slim
    working_dir: /workspace
    volumes:
      - ./rust:/workspace
      - lakehouse_g1_cargo_registry:/usr/local/cargo/registry
      - lakehouse_g1_target:/workspace/target
    depends_on:
      clickhouse:
        condition: service_healthy
      lakekeeper-warehouse-init:
        condition: service_completed_successfully
    environment:
      # These four all resolve from INSIDE the compose network (this
      # container's own perspective), unlike the host-facing defaults in
      # `.env.example` — see the module doc on `g1_lakekeeper.rs`'s
      # `G1Env` for why the host-facing and container-facing values must
      # not be collapsed into one.
      LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      CH_LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      CH_RUSTFS_S3_ENDPOINT: http://rustfs:9000
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      CH_URL: http://clickhouse:8123
      CH_USER: ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        set -eu &&
        apt-get update && apt-get install -y --no-install-recommends pkg-config libssl-dev >/dev/null &&
        cargo test -p lakehouse-iceberg --test g1_lakekeeper --locked -- --ignored --nocapture g1_half_a
    restart: "no"

  # P2 (G2) — SeaweedFS: a second S3-compatible store used to prove the
  # storage boundary. Opt-in via the `seaweedfs` profile; never starts on a
  # plain `docker compose up` (RustFS stays the default). Image confirmed
  # to exist on Docker Hub as `chrislusf/seaweedfs:4.44` (pulled and
  # inspected during P2 verification — see docs/STORAGE-COMPATIBILITY.md).
  #
  # `weed server -s3` runs master+volume+filer+the S3 gateway in one
  # process — sufficient for this matrix check, not a production topology.
  seaweedfs:
    profiles: ["seaweedfs"]
    image: chrislusf/seaweedfs:4.44
    command:
      - server
      - -dir=/data
      - -s3
      - -s3.port=8333
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -s3.iam.readOnly=false
      - -master.volumeSizeLimitMB=100
    volumes:
      - lakehouse_seaweedfs_data:/data
      - ./ops/seaweedfs/iam.json:/etc/seaweedfs/iam.json:ro
    ports:
      - "${SEAWEEDFS_S3_HOST_PORT:-8333}:8333"
    healthcheck:
      # `127.0.0.1`, not `localhost`: this image's S3 listener only binds
      # IPv4 loopback, and busybox `wget` resolves `localhost` to `::1`
      # first, which connection-refuses — confirmed during P2 verification.
      # `curl -f` would also treat the unauthenticated 403 the S3 API
      # correctly returns as unhealthy, so this only checks that something
      # is listening and speaking HTTP at all (any response code).
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8333/ | grep -qE '^[0-9]{3}$' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s
    restart: unless-stopped

  # P2 (G2) — mirrors `rustfs-bucket-init`: create the warehouse bucket via
  # the plain S3 API only. Opt-in with `seaweedfs`.
  seaweedfs-bucket-init:
    profiles: ["seaweedfs"]
    image: amazon/aws-cli:2.36.34
    depends_on:
      seaweedfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:-seaweedfsadmin}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfsadmin}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
    entrypoint: ["/bin/sh", "-c"]
    # Retries instead of trying once. `seaweedfs`'s healthcheck curls
    # 127.0.0.1 from INSIDE its own container, which proves something in
    # that container speaks HTTP — not that the S3 listener is reachable
    # from a peer container. `server -s3` brings up master/volume/filer/s3
    # in sequence, so there is a window where the healthcheck passes and a
    # peer still gets "Could not connect to the endpoint URL" (observed:
    # this job failed on one branch and passed on another with identical
    # code). Widening the healthcheck cannot close that window from inside;
    # retrying from the client side does.
    command:
      - |
        set -eu
        bucket="${LAKEHOUSE_WAREHOUSE_BUCKET:-lakehouse-warehouse}"
        endpoint="http://seaweedfs:8333"
        for attempt in $$(seq 1 30); do
          if aws --endpoint-url "$$endpoint" s3api head-bucket --bucket "$$bucket" 2>/dev/null; then
            echo "bucket $$bucket already present"; exit 0
          fi
          if aws --endpoint-url "$$endpoint" s3api create-bucket --bucket "$$bucket" 2>/dev/null; then
            echo "created bucket $$bucket"; exit 0
          fi
          echo "seaweedfs S3 not usable yet (attempt $$attempt/30), retrying" >&2
          sleep 2
        done
        echo "seaweedfs S3 endpoint never became usable after 60s" >&2
        # One last unsuppressed attempt so the actual AWS CLI error is in
        # the logs rather than swallowed by 2>/dev/null.
        aws --endpoint-url "$$endpoint" s3api create-bucket --bucket "$$bucket"
    restart: "no"

  # P2 (G2) — mirrors `lakekeeper-warehouse-init` exactly (same bootstrap +
  # warehouse-registration shape), pointed at SeaweedFS instead of RustFS
  # and registered under a DIFFERENT warehouse name (`seaweedfs`, not
  # `default`) so both stores' warehouses can coexist under one Lakekeeper
  # server without colliding. This is config, not a code fork: the only
  # deltas from `lakekeeper-warehouse-init` are the endpoint, credentials,
  # and warehouse name baked into the JSON body.
  lakekeeper-warehouse-init-seaweedfs:
    profiles: ["seaweedfs"]
    image: alpine:3.20
    depends_on:
      lakekeeper:
        condition: service_healthy
      seaweedfs-bucket-init:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER_WAREHOUSE: seaweedfs
      LAKEHOUSE_WAREHOUSE_BUCKET: ${LAKEHOUSE_WAREHOUSE_BUCKET:-lakehouse-warehouse}
      SEAWEEDFS_ACCESS_KEY: ${SEAWEEDFS_ACCESS_KEY:-seaweedfsadmin}
      SEAWEEDFS_SECRET_KEY: ${SEAWEEDFS_SECRET_KEY:-seaweedfsadmin}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        apk add --no-cache curl jq >/dev/null
        base="http://lakekeeper:8181"
        already=$$(curl -fsS "$$base/management/v1/info" | jq -r '.bootstrapped')
        if [ "$$already" != "true" ]; then
          curl -fsS -X POST "$$base/management/v1/bootstrap" \
            -H 'Content-Type: application/json' \
            -d '{"accept-terms-of-use": true}'
        fi
        exists=$$(curl -fsS "$$base/management/v1/warehouse" | \
          jq -r --arg name "$$LAKEKEEPER_WAREHOUSE" \
          '.warehouses[]? | select(.name == $$name) | .name')
        if [ "$$exists" != "$$LAKEKEEPER_WAREHOUSE" ]; then
          curl -fsS -X POST "$$base/management/v1/warehouse" \
            -H 'Content-Type: application/json' \
            -d '{
              "warehouse-name": "'"$$LAKEKEEPER_WAREHOUSE"'",
              "storage-profile": {
                "type": "s3",
                "bucket": "'"$$LAKEHOUSE_WAREHOUSE_BUCKET"'",
                "region": "us-east-1",
                "endpoint": "http://seaweedfs:8333",
                "path-style-access": true,
                "sts-enabled": true,
                "sts-role-arn": "arn:aws:iam::000000000000:role/lakekeeper"
              },
              "storage-credential": {
                "type": "s3",
                "credential-type": "access-key",
                "aws-access-key-id": "'"$$SEAWEEDFS_ACCESS_KEY"'",
                "aws-secret-access-key": "'"$$SEAWEEDFS_SECRET_KEY"'"
              }
            }'
        fi
    restart: "no"

  # P3 (G3a) — Dagster's own run/event-log/schedule storage, on the
  # EXISTING `postgres` service via a dedicated database (mirrors
  # `lakekeeper-db-init` exactly — separate database, not a schema mixed
  # into the `lakehouse` app database). See
  # docs/adr/0005-dagster-code-location-ownership-and-packaging.md.
  dagster-db-init:
    profiles: ["dagster"]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lakehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      PGDATABASE: ${POSTGRES_DB:-lakehouse}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -v ON_ERROR_STOP=1 -tc
        "SELECT 1 FROM pg_database WHERE datname = '$${DAGSTER_PG_DB}'" |
        grep -q 1 ||
        psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE \"$${DAGSTER_PG_DB}\""
    restart: "no"

  # P3 (G3a) — the code location: a gRPC server serving
  # `dispar_orchestrate.definitions` (built from `dagster/Dockerfile`, see
  # ADR 0005). This is also where a launched run actually EXECUTES (Dagster's
  # `DefaultRunLauncher` calls back into the code location's own process),
  # so it carries every env var the dlt pipeline
  # (`dagster/dispar_orchestrate/dlt_pipeline.py`) and the catalog
  # registration step (`bronze_catalog.py`) need — the Postgres source, the
  # Lakekeeper catalog, the RustFS/SeaweedFS S3 endpoint, and ClickHouse.
  dagster-code-location:
    profiles: ["dagster"]
    build:
      context: ./dagster
      dockerfile: Dockerfile
    depends_on:
      dagster-db-init:
        condition: service_completed_successfully
      lakekeeper-warehouse-init:
        condition: service_completed_successfully
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_USER: ${POSTGRES_USER:-lakehouse}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
      # `postgresql://`, not `postgres://` — dlt's `sql_database` source
      # goes through SQLAlchemy, which (unlike `sqlx`, used for
      # `DATABASE_URL` elsewhere in this file) does not recognize the
      # `postgres://` scheme alias.
      BRONZE_SOURCE_DATABASE_URL: postgresql://${POSTGRES_USER:-lakehouse}:${POSTGRES_PASSWORD:-lakehouse}@postgres:5432/${POSTGRES_DB:-lakehouse}
      BRONZE_SOURCE_SCHEMA: ${BRONZE_SOURCE_SCHEMA:-ingest_demo}
      BRONZE_SOURCE_TABLE: ${BRONZE_SOURCE_TABLE:-orders}
      BRONZE_TABLE_NAME: ${BRONZE_TABLE_NAME:-g3a_orders}
      LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      CH_RUSTFS_S3_ENDPOINT: ${CH_RUSTFS_S3_ENDPOINT:-http://rustfs:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      LAKEHOUSE_WAREHOUSE_BUCKET: ${LAKEHOUSE_WAREHOUSE_BUCKET:-lakehouse-warehouse}
      CH_URL: ${CH_URL:-http://clickhouse:8123}
      CH_USER: ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
    command: ["dagster", "api", "grpc", "-h", "0.0.0.0", "-p", "4000", "-m", "dispar_orchestrate.definitions"]
    restart: unless-stopped

  # P3 (G3a) — webserver (GraphQL API + UI). `DAGSTER_URL` (see
  # `lakehouse-api::config::Config`) points at
  # `http://dagster-webserver:3000/graphql` from inside the compose
  # network, `http://localhost:${DAGSTER_WEBSERVER_HOST_PORT}/graphql` from
  # the host.
  dagster-webserver:
    profiles: ["dagster"]
    build:
      context: ./dagster
      dockerfile: Dockerfile
    depends_on:
      dagster-code-location:
        condition: service_started
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_USER: ${POSTGRES_USER:-lakehouse}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/app/workspace.yaml"]
    ports:
      - "${DAGSTER_WEBSERVER_HOST_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:3000/server_info"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    restart: unless-stopped

  # P3 (G3a) — daemon (schedules, sensors, run queueing). Not strictly
  # needed for a manually-triggered run (G3a triggers via
  # `POST /api/pipelines/{id}/trigger`, which calls `launchRun` directly),
  # but every real Dagster deployment runs one, and P4's maintenance
  # schedules (future) will need it — included now so the topology doesn't
  # change again in P4.
  dagster-daemon:
    profiles: ["dagster"]
    build:
      context: ./dagster
      dockerfile: Dockerfile
    depends_on:
      dagster-code-location:
        condition: service_started
    environment:
      DAGSTER_PG_HOST: postgres
      DAGSTER_PG_PORT: "5432"
      DAGSTER_PG_USER: ${POSTGRES_USER:-lakehouse}
      DAGSTER_PG_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      DAGSTER_PG_DB: ${DAGSTER_PG_DB:-dagster}
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/app/workspace.yaml"]
    restart: unless-stopped

  # P3 (G3a) — one-shot: create the Postgres table G3a's dlt pipeline
  # reads ("a real Postgres table", per the task brief), in its own
  # `ingest_demo` schema — kept out of `rust/migrations` deliberately:
  # those migrations are `lakehouse-api`'s own product schema
  # (`sqlx::migrate!`-embedded into the binary); this is throwaway demo
  # *source* data for the ingestion acceptance test, not product state.
  g3a-source-init:
    # `dagster`, not `test`: `g3a-test-runner` (below) depends on
    # `dagster-webserver`, which is itself gated behind the `dagster`
    # profile. Docker Compose validates a service's ENTIRE depends_on
    # closure against whichever profiles are active, even for an unrelated
    # `run <other-service>` invocation — so if this (and `g3a-test-runner`)
    # were tagged `test` instead, plain `--profile test run --rm
    # g1-test-runner` (the G1/G2 usage documented in
    # docs/STORAGE-COMPATIBILITY.md and exercised by `.github/workflows/
    # ci.yml`'s `g1-rustfs`/`g2-seaweedfs` jobs) would start failing with
    # "service g3a-test-runner depends on undefined service
    # dagster-webserver" the moment this file added a `dagster`-gated
    # dependency anywhere under the `test` profile. This was caught during
    # P3 verification precisely because that regression check was run.
    profiles: ["dagster"]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lakehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      PGDATABASE: ${POSTGRES_DB:-lakehouse}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -v ON_ERROR_STOP=1 -c "
        CREATE SCHEMA IF NOT EXISTS ingest_demo;
        CREATE TABLE IF NOT EXISTS ingest_demo.orders (
          id bigserial PRIMARY KEY,
          customer text NOT NULL,
          amount numeric(12,2) NOT NULL,
          created_at timestamptz NOT NULL DEFAULT now()
        );
        INSERT INTO ingest_demo.orders (customer, amount)
        SELECT 'customer_' || (g % 500), (g % 1000)::numeric + 0.5
        FROM generate_series(1, 2000) AS g
        WHERE NOT EXISTS (SELECT 1 FROM ingest_demo.orders);
        "
    restart: "no"

  # P3 (G3a) — end-to-end acceptance test (`ops/g3a/g3a_test.py`), same
  # `g1-test-runner` shape: bind-mounted script, stock base image, runs
  # INSIDE the compose network. `dagster` profile, not `test` — see
  # `g3a-source-init`'s comment on why sharing `test` with `g1-test-runner`
  # would break the unrelated G1/G2 usage.
  #
  # Usage (from a clean stack; brings `lakehouse-api` up with `DAGSTER_URL`
  # pointed at the real webserver via the `.env`/shell override below —
  # verified end-to-end against a clean stack during P3):
  #   DAGSTER_URL=http://dagster-webserver:3000/graphql \
  #     docker compose -p <project> --profile dagster up -d --build \
  #       lakehouse-api dagster-code-location dagster-webserver \
  #       dagster-daemon g3a-source-init
  #   docker compose -p <project> --profile dagster run --rm g3a-test-runner
  g3a-test-runner:
    profiles: ["dagster"]
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - ./ops/g3a:/work
    depends_on:
      lakehouse-api:
        condition: service_started
      dagster-webserver:
        condition: service_healthy
      g3a-source-init:
        condition: service_completed_successfully
    environment:
      LAKEHOUSE_API_URL: http://lakehouse-api:8080
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      DAGSTER_URL: http://dagster-webserver:3000/graphql
      CH_URL: http://clickhouse:8123
      CH_USER: ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
      CH_LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      CH_RUSTFS_S3_ENDPOINT: http://rustfs:9000
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      BRONZE_TABLE_NAME: ${BRONZE_TABLE_NAME:-g3a_orders}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "pip install -q requests && python g3a_test.py"
    restart: "no"

  # P4 (G3) — functional acceptance test for the maintenance job + the
  # `dry_run` metrics console surface (`GET /api/governance/maintenance`).
  # `docs/plans/G3-RESULT.md` has the one-time synthetic-load performance
  # measurement that decided the Trino escape hatch below; this is the
  # CI-repeatable correctness check, same `g1-test-runner`/`g3a-test-runner`
  # shape. `dagster` profile (not `test`) for the same reason
  # `g3a-source-init`'s comment gives: it depends on `dagster-webserver`,
  # itself `dagster`-gated.
  g3-maintenance-test-runner:
    profiles: ["dagster"]
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - ./ops/g3:/work
    depends_on:
      lakehouse-api:
        condition: service_started
      dagster-webserver:
        condition: service_healthy
    environment:
      LAKEHOUSE_API_URL: http://lakehouse-api:8080
      AUTH_BOOTSTRAP_EMAIL: ${AUTH_BOOTSTRAP_EMAIL:-}
      AUTH_BOOTSTRAP_PASSWORD: ${AUTH_BOOTSTRAP_PASSWORD:-}
      DAGSTER_URL: http://dagster-webserver:3000/graphql
      CH_URL: http://clickhouse:8123
      CH_USER: ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
      BRONZE_TABLE_NAME: ${BRONZE_TABLE_NAME:-g3a_orders}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "pip install -q requests && python g3_test.py"
    restart: "no"

  # P4 (G3) — the pre-authorized escape hatch (ADR 0009). ClickHouse 26.3
  # has NO working small-file-compaction path against a catalog-registered
  # Iceberg table (`OPTIMIZE` parses but always fails at runtime with an
  # S3 403 — measured, not assumed; see `docs/plans/G3-RESULT.md`), and
  # `expire_snapshots` (the one maintenance verb that DOES work) does not
  # compact files either — it reclaims old snapshots/manifests. Trino's own
  # `ALTER TABLE ... EXECUTE optimize` against the SAME Lakekeeper/RustFS
  # stack measured working (280 tiny files -> 14, one per partition,
  # restoring query-planning time to baseline). This is a coordinator-only,
  # single-node Trino, scoped to ONE catalog (`iceberg`, rendered below at
  # container start) — it never touches Silver/Gold (ClickHouse MergeTree,
  # not Iceberg).
  trino:
    profiles: ["trino"]
    image: trinodb/trino:483
    depends_on:
      lakekeeper-warehouse-init:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      CH_RUSTFS_S3_ENDPOINT: ${CH_RUSTFS_S3_ENDPOINT:-http://rustfs:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
    entrypoint: ["/bin/sh", "-c"]
    # Trino's base image has no `envsubst`/`python3` (RHEL UBI, verified
    # empirically), so the catalog properties file is written directly
    # here via an UNQUOTED heredoc — `sh` expands `$LAKEKEEPER_CATALOG_URI`
    # etc. itself (from this service's own `environment:` block above), no
    # extra tooling needed. `$$` (not `$`) in front of each variable below
    # is deliberate: it stops docker compose's OWN `${VAR}` interpolation
    # from resolving these against the host/`.env` at compose-parse time,
    # so the literal `${VAR}` reaches the container's shell instead.
    command:
      - |
        mkdir -p /etc/trino/catalog && cat > /etc/trino/catalog/iceberg.properties <<EOF
        connector.name=iceberg
        iceberg.catalog.type=rest
        iceberg.rest-catalog.uri=$${LAKEKEEPER_CATALOG_URI}
        iceberg.rest-catalog.warehouse=$${LAKEKEEPER_WAREHOUSE}
        iceberg.rest-catalog.vended-credentials-enabled=true
        fs.s3.enabled=true
        s3.endpoint=$${CH_RUSTFS_S3_ENDPOINT}
        s3.region=us-east-1
        s3.path-style-access=true
        s3.aws-access-key=$${RUSTFS_ACCESS_KEY}
        s3.aws-secret-key=$${RUSTFS_SECRET_KEY}
        EOF
        exec /usr/lib/trino/bin/run-trino
    ports:
      - "${TRINO_HOST_PORT:-8090}:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8080/v1/info"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  # P4 (G3) — the cron loop itself (`ops/trino/optimize_bronze.sh`):
  # `SHOW TABLES FROM iceberg.bronze` then `ALTER TABLE ... EXECUTE
  # optimize` per table, on `TRINO_CRON_INTERVAL_SECONDS` (default 6h).
  # Same image as `trino` (already has the `trino` CLI), no coordinator
  # role of its own.
  trino-maintenance-cron:
    profiles: ["trino"]
    image: trinodb/trino:483
    depends_on:
      trino:
        condition: service_healthy
    environment:
      TRINO_CRON_INTERVAL_SECONDS: ${TRINO_CRON_INTERVAL_SECONDS:-21600}
    volumes:
      - ./ops/trino/optimize_bronze.sh:/opt/optimize_bronze.sh:ro
    entrypoint: ["/bin/sh", "/opt/optimize_bronze.sh"]
    restart: unless-stopped

  # P5 (G4) — one-shot: create the Postgres table the demo CDC connector
  # captures. Own `p5_cdc` schema, `REPLICA IDENTITY FULL` (Debezium needs
  # this to emit full before/after images for UPDATE/DELETE, per
  # `docs/plans/P5-RESULT.md`'s measured connector config), and a
  # publication scoped to that one table — never `FOR ALL TABLES`, so a
  # demo connector cannot see product schema. `dagster` profile, not
  # `test`, mirroring `g3a-source-init`'s reasoning exactly (this service
  # sits behind `debezium-server`, which is itself `dagster`-gated below).
  g4-source-init:
    profiles: ["dagster"]
    image: postgres:16
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lakehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      PGDATABASE: ${POSTGRES_DB:-lakehouse}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >
        psql -v ON_ERROR_STOP=1 -c "
        CREATE SCHEMA IF NOT EXISTS p5_cdc;
        CREATE TABLE IF NOT EXISTS p5_cdc.orders (
          id bigint PRIMARY KEY,
          customer text NOT NULL,
          amount numeric(12,2) NOT NULL,
          updated_at timestamptz NOT NULL DEFAULT now()
        );
        ALTER TABLE p5_cdc.orders REPLICA IDENTITY FULL;
        INSERT INTO p5_cdc.orders (id, customer, amount)
        SELECT g, 'customer_' || g, (g % 100)::numeric + 0.5
        FROM generate_series(1, 5) AS g
        WHERE NOT EXISTS (SELECT 1 FROM p5_cdc.orders);
        " &&
        psql -v ON_ERROR_STOP=1 -tc
        "SELECT 1 FROM pg_publication WHERE pubname = 'p5cdc_pub'" |
        grep -q 1 ||
        psql -v ON_ERROR_STOP=1 -c
        "CREATE PUBLICATION p5cdc_pub FOR TABLE p5_cdc.orders;"
    restart: "no"

  # P5 (G4) — Debezium Server + `debezium-server-iceberg` (memiiso), pinned
  # by digest (R4: community-maintained, no versioned tag exists upstream —
  # see `docs/plans/P5-RESULT.md`). Captures `p5_cdc.orders` via Postgres
  # logical replication (`pgoutput`), upsert mode, initial snapshot then
  # streaming, straight into Bronze through the SAME Lakekeeper/RustFS
  # stack every other Bronze writer in this repo uses. This is a single,
  # statically-configured demo connector (ADR 0007: "no dynamic
  # per-connector provisioning" this phase) — it proves the config shape
  # `lakehouse_store::cdc::render_debezium_properties` designs, not a
  # production connector-management control plane.
  #
  # `LAKEKEEPER_BASE_URI` MUST be set to the in-network name
  # (`http://lakekeeper:8181`) or every REST-catalog call this container
  # makes after the first one fails with "Connection refused:
  # localhost:8181" — see `docs/plans/P5-RESULT.md`'s measured trap. Put it
  # in `.env`, not a one-off prefix (same reasoning as `DAGSTER_URL`'s
  # existing warning elsewhere in this file).
  debezium-server:
    profiles: ["dagster"]
    image: ghcr.io/memiiso/debezium-server-iceberg@sha256:c49ebdaae01762a5509804926710d6a831e45d56f70ce98cf69bac57cc6a6bf9
    depends_on:
      g4-source-init:
        condition: service_completed_successfully
      lakekeeper-warehouse-init:
        condition: service_completed_successfully
    environment:
      LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      CH_RUSTFS_S3_ENDPOINT: ${CH_RUSTFS_S3_ENDPOINT:-http://rustfs:9000}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-rustfsadmin}
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    volumes:
      - lakehouse_debezium_data:/debezium/data
    # Same reason `trino`'s command renders its catalog properties inline:
    # the base image has no templating tool, so `sh` interpolates this
    # container's own `environment:` values directly. `$$` stops compose's
    # OWN `${VAR}` interpolation at parse time so the literal reaches this
    # container's shell.
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        mkdir -p /debezium/config && cat > /debezium/config/application.properties <<EOF
        debezium.sink.type=iceberg
        debezium.sink.iceberg.catalog-name=lakekeeper
        debezium.sink.iceberg.type=rest
        debezium.sink.iceberg.uri=$${LAKEKEEPER_CATALOG_URI}
        debezium.sink.iceberg.warehouse=$${LAKEKEEPER_WAREHOUSE}
        debezium.sink.iceberg.io-impl=org.apache.iceberg.aws.s3.S3FileIO
        debezium.sink.iceberg.s3.endpoint=$${CH_RUSTFS_S3_ENDPOINT}
        debezium.sink.iceberg.s3.path-style-access=true
        debezium.sink.iceberg.s3.access-key-id=$${RUSTFS_ACCESS_KEY}
        debezium.sink.iceberg.s3.secret-access-key=$${RUSTFS_SECRET_KEY}
        debezium.sink.iceberg.client.region=us-east-1
        debezium.sink.iceberg.upsert=true
        debezium.sink.iceberg.upsert-keep-deletes=true
        debezium.sink.iceberg.destination-uppercase-table-names=false
        debezium.sink.iceberg.write.format.default=parquet
        debezium.source.connector.class=io.debezium.connector.postgresql.PostgresConnector
        debezium.source.offset.storage=org.apache.kafka.connect.storage.FileOffsetBackingStore
        debezium.source.offset.storage.file.filename=/debezium/data/p5cdc-offsets.dat
        debezium.source.offset.flush.interval.ms=0
        debezium.source.database.hostname=postgres
        debezium.source.database.port=5432
        debezium.source.database.user=$${POSTGRES_USER}
        debezium.source.database.password=$${POSTGRES_PASSWORD}
        debezium.source.database.dbname=$${POSTGRES_DB}
        debezium.source.topic.prefix=p5cdc
        debezium.source.schema.include.list=p5_cdc
        debezium.source.table.include.list=p5_cdc.orders
        debezium.source.plugin.name=pgoutput
        debezium.source.slot.name=p5cdc_slot
        debezium.source.publication.name=p5cdc_pub
        debezium.source.publication.autocreate.mode=disabled
        debezium.source.schema.history.internal=io.debezium.storage.file.history.FileSchemaHistory
        debezium.source.schema.history.internal.file.filename=/debezium/data/p5cdc-schema-history.dat
        EOF
        exec /debezium/run.sh
    restart: unless-stopped

  # P5 (G4) — end-to-end acceptance test: INSERT/UPDATE/DELETE on the
  # source are visible in ClickHouse within the agreed latency, AND
  # replication-slot cleanup on connector removal is verified. Same
  # `g1-test-runner`/`g3a-test-runner` shape (bind-mounted script, stock
  # base image, runs inside the compose network). `dagster` profile (not
  # `test`), for the same reason `g3a-source-init`'s comment gives.
  #
  # Usage (from a clean stack):
  #   docker compose -p <project> --profile dagster up -d
  #     postgres clickhouse rustfs rustfs-bucket-init lakekeeper-db-init
  #     lakekeeper-migrate lakekeeper lakekeeper-warehouse-init
  #     g4-source-init debezium-server
  #   docker compose -p <project> --profile dagster run --rm g4-test-runner
  g4-test-runner:
    profiles: ["dagster"]
    image: python:3.12-slim
    working_dir: /work
    volumes:
      - ./ops/g4:/work
      - ./ops/debezium/deprovision_connector.sh:/work/deprovision_connector.sh:ro
    depends_on:
      debezium-server:
        condition: service_started
      g4-source-init:
        condition: service_completed_successfully
    environment:
      CH_URL: http://clickhouse:8123
      CH_USER: ${CH_USER:-default}
      CH_PASSWORD: ${CH_PASSWORD:-}
      CH_LAKEKEEPER_CATALOG_URI: http://lakekeeper:8181/catalog
      CH_RUSTFS_S3_ENDPOINT: http://rustfs:9000
      LAKEKEEPER_WAREHOUSE: ${LAKEKEEPER_WAREHOUSE:-default}
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-lakehouse}
      PGPASSWORD: ${POSTGRES_PASSWORD:-lakehouse}
      PGDATABASE: ${POSTGRES_DB:-lakehouse}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - "apt-get update -qq && apt-get install -y -qq --no-install-recommends postgresql-client >/dev/null && pip install -q requests && python g4_test.py"
    restart: "no"

volumes:
  lakehouse_postgres_data:
  lakehouse_clickhouse_data:
  lakehouse_rustfs_data:
  lakehouse_seaweedfs_data:
  lakehouse_g1_cargo_registry:
  lakehouse_g1_target:
  lakehouse_debezium_data:
