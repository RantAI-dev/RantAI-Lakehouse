[project]
name = "dispar-orchestrate"
version = "0.1.0"
description = "P3 Dagster code location: dlt sql_database -> Bronze Iceberg through Lakekeeper. See docs/adr/0005-dagster-code-location-ownership-and-packaging.md."
requires-python = ">=3.11"
dependencies = [
    # Pinned exact versions (not ranges): this package has no shared
    # lockfile with the Rust workspace (ADR 0005 "versioning" section) --
    # the pin here IS the reproducibility guarantee.
    "dagster==1.13.20",
    "dagster-webserver==1.13.20",
    "dagster-postgres==0.29.20",
    "dlt[pyiceberg,s3,postgres]==1.30.0",
    # dlt[pyiceberg]==1.30.0 pulls pyiceberg via a range (>=0.9.1); pin the
    # exact version it currently resolves to (verified with `pip install
    # --dry-run "dlt[pyiceberg]==1.30.0"`) so this repo's own promise of
    # exact pins (this file's own comment above) actually covers the
    # library `dlt_pipeline.py`/`ops/g3/g3_loadgen.py` both depend on
    # directly, not just `dlt` itself.
    "pyiceberg==0.12.0",
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.36",
    "requests==2.32.3",
    # s3fs is already pulled in transitively by dlt[s3] (verified: s3fs
    # 2026.7.0 is installed in this project's venv), but
    # capacity_snapshot.py imports it directly by name — pinned here so
    # a future dlt version bump cannot silently drop or change it
    # without this file's own dependency list saying so.
    "s3fs==2026.7.0",
    # WS9 plan Task B1 -- Tier 2 ingestion adapters (mongodb, oracle, kafka
    # stream micro-batch, sftp). Verified installable for this image's
    # interpreter (python:3.12-slim, dagster/Dockerfile) via
    # `curl -s https://pypi.org/pypi/<pkg>/<ver>/json` on 2026-09-18: all
    # four releases exist and each publishes a cp312 (or pure-Python
    # py3-none-any) wheel, so none needs a source build. Newer releases
    # exist upstream today (pymongo 4.18.1, oracledb 26.0.0, paramiko
    # 5.0.0) but this plan's exact pins are still real, installable
    # releases for this interpreter, so they are kept as specified rather
    # than bumped without a reason recorded here.
    "pymongo==4.9.2",
    "oracledb==2.5.1",
    # kafka-python, NOT confluent-kafka (WS9 plan Task B1, judge review
    # K1): confluent-kafka's transport is librdkafka, a C library that
    # resolves broker hostnames through its own internal resolver, never
    # through Python's socket.getaddrinfo -- no check this codebase can
    # install in Python (ssrf_guard.pinned_resolution / checking_resolver)
    # can see or affect those lookups, and confluent-kafka's bindings
    # expose no resolver callback to hook one into. kafka-python is a pure
    # Python client whose connections (bootstrap, advertised, every
    # mid-batch reconnect) all resolve through socket.getaddrinfo, which
    # ssrf_guard.checking_resolver wraps for the whole consume batch.
    # 3.0.11, not 2.0.2 (judge review K5): 2.0.2 is the last release of an
    # unmaintained 2020-09-30 line; the project's maintained line resumed
    # in 2025 (2.0.3..3.0.11). Verified 2026-09-18: 3.0.11 is still the
    # current release on PyPI (requires_python >=3.8, ships only a
    # py3-none-any wheel and an sdist -- pure Python, no native transport
    # to link against, so no system package is needed for Kafka at all).
    "kafka-python==3.0.11",
    "paramiko==3.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dispar_orchestrate*"]
