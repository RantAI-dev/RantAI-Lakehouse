[project]
name = "dispar-orchestrate"
version = "0.1.0"
description = "P3 Dagster code location: dlt sql_database -> Bronze Iceberg through Lakekeeper. See docs/adr/0005-dagster-code-location-ownership-and-packaging.md."
requires-python = ">=3.11"
dependencies = [
    # Pinned exact versions (not ranges): this package has no shared
    # lockfile with the Rust workspace (ADR 0005 "versioning" section) --
    # the pin here IS the reproducibility guarantee.
    "dagster==1.13.20",
    "dagster-webserver==1.13.20",
    "dagster-postgres==0.29.20",
    "dlt[pyiceberg,s3,postgres]==1.30.0",
    # dlt[pyiceberg]==1.30.0 pulls pyiceberg via a range (>=0.9.1); pin the
    # exact version it currently resolves to (verified with `pip install
    # --dry-run "dlt[pyiceberg]==1.30.0"`) so this repo's own promise of
    # exact pins (this file's own comment above) actually covers the
    # library `dlt_pipeline.py`/`ops/g3/g3_loadgen.py` both depend on
    # directly, not just `dlt` itself.
    "pyiceberg==0.12.0",
    "psycopg2-binary==2.9.10",
    "sqlalchemy==2.0.36",
    "requests==2.33.0",
    # `secret_resolver.py` opens the AES-256-GCM-sealed managed connector
    # credentials (`SRC-12` decision 4) with `AESGCM`. Already installed
    # transitively in this project's venv (50.0.2, found as its
    # dist-info on 2026-10-15); named here because the orchestrator now imports it
    # directly, so a dependency bump elsewhere cannot silently drop it.
    "cryptography==50.0.2",
    # s3fs is already pulled in transitively by dlt[s3] (verified: s3fs
    # 2026.7.0 is installed in this project's venv), but
    # capacity_snapshot.py imports it directly by name — pinned here so
    # a future dlt version bump cannot silently drop or change it
    # without this file's own dependency list saying so.
    "s3fs==2026.7.0",
    # `file_ingest.py` builds Arrow record batches and (from DATA-17 T2.2) reads
    # Parquet with `pyarrow.parquet`, so it imports pyarrow directly. Already
    # installed transitively by `pyiceberg` (25.0.1 in this project's venv on
    # 2026-10-19); named here so a pyiceberg bump cannot silently drop or move it.
    "pyarrow==25.0.1",
    # `upload_formats.py` (`DATA-17` slice 4, plan AD8): the Avro container files an
    # upload may be (decision 12). `fastavro` is the Avro library with
    # wheels for this image's interpreter (1.13.1, installed and tested on 2026-10-21);
    # it decodes logical types (dates, timestamps, decimals) the way the text rules need.
    "fastavro==1.13.1",
    # `upload_formats.py`: a JSON file that is one top-level array is read element by
    # element, because `json.load` would hold the whole file (a 2 GiB array is the point
    # of the cap). `ijson` streams it (3.6.0, with its C backend `yajl2_c`, tested on
    # 2026-10-21) and hands non-integers over as `Decimal`, so `1.50` stays `1.50`.
    "ijson==3.6.0",
    # Tier 2 ingestion adapters (mongodb, oracle, kafka stream micro-batch,
    # sftp). Verified installable for this image's interpreter
    # (python:3.12-slim, dagster/Dockerfile): each publishes a cp312 (or
    # pure-Python py3-none-any) wheel, so none needs a source build --
    # `oracledb`/`paramiko` checked through PyPI's JSON API on 2026-09-18,
    # `pymongo` 4.18.2 on 2026-10-24.
    # `pymongo` moved 4.9.2 -> 4.18.2 for `SEC-52`: 4.9.2 carries two high
    # advisories -- GHSA-v4x9-3549-crwv (heap out-of-bounds write when
    # encoding a BSON document) and GHSA-vp6j-j7w5-5xjj (host injection
    # through percent-encoded delimiters in a connection string) -- plus two
    # moderate ones (GHSA-qx36-8mw2-4r3x, GHSA-8fvv-fgr5-f8ch), and 4.18.2
    # fixes all four. Checked against PyPI on 2026-10-24: 4.18.2 needs
    # Python >= 3.9 and ships the cp312 manylinux x86_64 wheel this image
    # installs. The one cost is a higher server floor: 4.14 dropped MongoDB
    # 4.0 and 4.18 dropped 4.2, so a source must run MongoDB 4.4+; the
    # adapter reads `find` and collection names, which every supported
    # release carries.
    # `oracledb` and `paramiko` stay as they are: out of `SEC-52`'s scope,
    # and `paramiko` 3.5.0's low advisory has no fixed release to move to.
    "pymongo==4.18.2",
    "oracledb==2.5.1",
    # adapters/sql.py builds mysql+pymysql / mssql+pyodbc connection
    # strings for the mysql/mariadb/mssql drivers, but neither driver
    # package was ever added here -- every Tier 2 mysql/mariadb/mssql
    # ingest failed with ModuleNotFoundError in the built image. Verified
    # installable for this image's interpreter (python:3.12-slim,
    # dagster/Dockerfile) via `pip install --dry-run "pymysql==1.2.3"
    # "pyodbc==5.3.0"` and PyPI's file listing on 2026-09-23: PyMySQL
    # ships one pure-Python wheel (no C extension, no system package
    # needed), and pyodbc 5.3.0 ships a cp312 manylinux wheel -- but
    # pyodbc also needs the Microsoft ODBC Driver 18 + unixodbc SHARED
    # LIBRARY installed in the image at runtime (dagster/Dockerfile), not
    # just this Python package; a Python-only fix here is not sufficient
    # on its own.
    "pymysql==1.2.3",
    "pyodbc==5.3.0",
    # kafka-python, NOT confluent-kafka: confluent-kafka's transport is
    # librdkafka, a C library that resolves broker hostnames through its
    # own internal resolver, never through Python's socket.getaddrinfo --
    # no check this codebase can install in Python
    # (ssrf_guard.pinned_resolution / checking_resolver) can see or affect
    # those lookups, and confluent-kafka's bindings expose no resolver
    # callback to hook one into. kafka-python is a pure Python client
    # whose connections (bootstrap, advertised, every mid-batch reconnect)
    # all resolve through socket.getaddrinfo, which
    # ssrf_guard.checking_resolver wraps for the whole consume batch.
    # 3.0.11, not 2.0.2: 2.0.2 is the last release of an unmaintained
    # 2020-09-30 line; the project's maintained line resumed in 2025
    # (2.0.3..3.0.11). Verified 2026-09-18: 3.0.11 is still the current
    # release on PyPI (requires_python >=3.8, ships only a py3-none-any
    # wheel and an sdist -- pure Python, no native transport to link
    # against, so no system package is needed for Kafka at all).
    "kafka-python==3.0.11",
    "paramiko==3.5.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["dispar_orchestrate*"]

[tool.pytest.ini_options]
# `loader` splits the suite for CI (`.github/workflows/ci.yml`): the fast job
# runs `-m "not loader"`, `dagster-loader-tests` runs `-m loader`.
# --strict-markers so a misspelt marker fails collection instead of silently
# dropping a file out of both jobs.
addopts = "--strict-markers"
markers = [
    "loader: runs a real dlt pipeline against a local Iceberg table",
]
