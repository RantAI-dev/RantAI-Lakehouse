# Dagster instance config: run/event-log/schedule storage on the EXISTING
# `postgres` compose service, via a dedicated `dagster` database
# (`dagster-db-init` mirrors `lakekeeper-db-init` exactly) — not Dagster's
# default SQLite, which cannot be shared between the webserver and daemon
# containers. See docs/adr/0005-dagster-code-location-ownership-and-packaging.md.
storage:
  postgres:
    postgres_db:
      hostname:
        env: DAGSTER_PG_HOST
      port:
        env: DAGSTER_PG_PORT
      username:
        env: DAGSTER_PG_USER
      password:
        env: DAGSTER_PG_PASSWORD
      db_name:
        env: DAGSTER_PG_DB

# Run monitoring is ON, so the orchestrator ends a run that never finishes
# (SRC-39, QA TC-1702 / LH-SRC-11-11). Off by default in dagster 1.13.20, and
# without it a run whose worker died, or one that was never launched, stays
# queued or running for good: the API refuses the connector's next run with
# 409 and the schedule sensor skips it, for days.
#
#   start_timeout_seconds  a run still NOT_STARTED or STARTING after this is
#                          failed. 600 (ten minutes) is the same number the
#                          API reads as INGEST_RUN_START_TIMEOUT_SECONDS
#                          (`lakehouse-api/src/config.rs`): whoever changes one
#                          changes both. The API leaves a STARTING run to this
#                          monitoring and holds the 409 for a run still waiting
#                          in the queue (a queued run is never ended here), so
#                          a queued run is judged by the run limit instead.
#   cancel_timeout_seconds how long a cancelled run's worker is given to stop.
#   max_resume_run_attempts 0: a run is not resumed by itself.
#   poll_interval_seconds  how often the daemon looks.
#
# No `max_runtime_seconds` here on purpose: it would cap every job of the
# instance with one number. Every job now carries its own `dagster/max_runtime`
# tag (`run_limit_tags`, OPS-35), so a run whose process died is ended by the
# run monitoring above instead of holding the queue: `ingest_job`'s from
# INGEST_RUN_MAX_RUNTIME_SECONDS (default 21600 = six hours, set in
# `dagster/dispar_orchestrate/ingest_factory.py`), every other job's from its
# own `DAGSTER_RUN_LIMIT_*_SECONDS` variable. These fields cannot be read from
# the environment (the instance schema takes plain integers), which is why
# they are written here.
run_monitoring:
  enabled: true
  start_timeout_seconds: 600
  cancel_timeout_seconds: 300
  max_resume_run_attempts: 0
  poll_interval_seconds: 60

# The run queue: how many runs may be in progress at once, and which of
# them must never overlap another run of THEMSELVES.
#
# `max_concurrent_runs: 10` is the value this instance already enforced:
# Dagster's default run coordinator is `QueuedRunCoordinator`, whose
# `max_concurrent_runs` defaults to 10. It is written here so the number
# is the repository's own instead of a library default that a version
# bump could change under us -- the near-limit warning reads it.
#
# `tag_concurrency_limits` is the serial rule (OPS-37). A run tagged
# `lakehouse/serial` waits until no run with the SAME value is in
# progress. The value is the job's own name
# (`dispar_orchestrate/ingest_factory.py::job_tags`), so the limit of one
# applies to each serial job separately: a second `bronze_maintenance_job`
# waits in the queue, while `gold_export_job` may run beside it.
# `applyLimitPerUniqueValue` is what makes the limit apply per value
# instead of per key.
#
# A run that waits stays QUEUED and is never dropped by the daemon
# (`QueuedRunCoordinatorDaemon`): it starts when its turn comes.
#
# `concurrency.runs` may not be combined with `run_queue` or
# `run_coordinator.config` -- Dagster refuses that pair. This file has
# neither.
concurrency:
  runs:
    max_concurrent_runs: 10
    tag_concurrency_limits:
      - key: lakehouse/serial
        value:
          applyLimitPerUniqueValue: true
        limit: 1
