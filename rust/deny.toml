# cargo-deny configuration for RantAI Lakehouse.
#
# Scope: `cargo deny check all` (advisories, bans, licenses, sources).
#
# A Phase 1 license audit found zero GPL/AGPL/SSPL-licensed crates across
# the 295 crates in this workspace's dependency graph. This config encodes
# the permissive set actually in use and denies anything else by default,
# so a future dependency change that pulls in a copyleft license fails CI
# instead of silently landing.
#
# The project's outbound license is AGPL-3.0-or-later (see LICENSE), so the
# 15 first-party `lakehouse-*` workspace crates declare
# `license = "AGPL-3.0-or-later"` (via `[workspace.package]` in the root
# Cargo.toml). AGPL is deliberately NOT in the global `allow` list below —
# that list governs third-party *dependencies*, which remain permissive-only
# by policy. Instead each workspace crate gets a narrow per-crate exception
# so `cargo deny check licenses` accepts our own AGPL declaration without
# opening the door to a copyleft dependency slipping in under the same
# allowance.

[graph]
targets = []

[advisories]
# RUSTSEC-2023-0071 ("Marvin Attack" timing side-channel in `rsa` 0.9.10):
# a DEV-dependency only, of `lakehouse-auth` and `lakehouse-api` (to mint an
# RSA key for OIDC and service-account test fixtures —
# crates/lakehouse-auth/tests/oidc.rs, crates/lakehouse-api/src/routes/auth.rs
# and crates/lakehouse-api/src/connector_probe/saas.rs, all inside
# `#[cfg(test)]`). Since `SEC-41` (`sqlx` 0.9 with `mysql-rsa` off)
# `cargo tree -i rsa -e normal -p lakehouse-api` prints "nothing to print":
# no shipped binary links it. Before `SEC-41` that sentence was FALSE —
# `sqlx-mysql` 0.8.6 depended on `rsa` as a normal dependency, so the old
# justification here ("pulled in solely as a dev-dependency") described a
# tree that did not exist. Upstream has published no fix ("No safe upgrade
# is available!" per the advisory); `cargo update -p rsa --dry-run` confirms
# 0.9.10 is the latest. Re-evaluate when RustCrypto/RSA ships a
# constant-time implementation.
#
# RUSTSEC-2024-0436 (`paste` is no longer maintained): an *unmaintained*
# advisory, not a vulnerability — there is no CVE and no exploit path, only a
# dead upstream. It arrives transitively and unavoidably:
#
#   paste (proc-macro) <- parquet <- iceberg <- lakehouse-iceberg
#
# `paste` is a proc-macro, so it runs at compile time and is not linked into
# any shipped binary. Removing it would mean dropping `iceberg`, which is the
# whole point of this workspace. Re-evaluate when arrow/parquet drops the
# dependency or upstream transfers maintenance.
#
# RUSTSEC-2026-0367 (SUID/SGID bits kept on extract), RUSTSEC-2026-0368
# (`ZipArchive::extract` writes symlinks outside destination), and
# RUSTSEC-2026-0369 (`extract` applies permissions through symlinks):
# all three vulnerabilities are in `zip::extract`, which writes an archive to
# disk. Fixed upstream in `zip` 9.0.0. Not reachable in this workspace:
# `calamine` 0.36.1 reads zip entries in memory using `by_name` and never calls
# `extract`. The workspace has no direct `zip` dependency and no `extract` call.
# It arrives only transitively through `calamine`:
#
#   zip <- calamine <- lakehouse-api
#
# Latest `calamine` (0.36.1) requires `zip ^8.6` and does not yet accept
# `zip` 9.0.0. Drop when `calamine` accepts `zip` >= 9.0.0; then `cargo update -p zip`.
# RUSTSEC-2026-0381 (SEC-46, bundled roots trust distrusted emSign
# intermediates) is gone from this list with `SEC-41`: it matched only
# `webpki-roots` 0.26.11, the semver shim `sqlx-core` 0.8.6 required, and
# `sqlx` 0.9 depends on `webpki-roots` 1.x directly (0.26 is no longer in
# `Cargo.lock`: `cargo tree -i webpki-roots@0.26.11` finds no package).
#
# RUSTSEC-2026-0391 (`zstd` 0.13.3: data from an abandoned stream leaks
# into the next stream on a reused context), RUSTSEC-2026-0398 and
# RUSTSEC-2026-0403 (`zstd-safe` 7.2.4: `Seekable::decompress` sets a
# `Vec` length past its capacity; a failed legacy frame extends a `Vec`
# over uninitialized memory), and RUSTSEC-2026-0410 (`zstd-sys` 2.0.16:
# the wasm32 allocator shim corrupts memory on allocation failure). Four
# advisories in one stack, each with a fixed release upstream (`zstd`
# >= 0.14.3, `zstd-safe` >= 8.2.0, `zstd-sys` >= 2.1.2) that this tree
# cannot take yet. The chain is:
#
#   zstd <- apache-avro, parquet <- iceberg <- lakehouse-iceberg
#                                <- lakehouse-api
#
# (`lakehouse-api` also depends on `apache-avro` and `parquet` directly,
# for the upload readers; `iceberg` enables `apache-avro`'s `zstandard`
# feature and depends on `zstd` itself.)
#
# There is no fix available today. `iceberg` 0.10.1 is the latest release
# and requires `zstd ^0.13.3`, `parquet ^58` and `apache-avro ^0.21`;
# `apache-avro` 0.22.0, the latest, still requires `zstd ^0.13.3`; only
# `parquet` 60 moved to `zstd` 0.14, and `iceberg` cannot take it. So no
# `cargo update` changes any of the three versions, and there is no
# patched release to wait for either.
#
# Reachability, checked against the code rather than assumed:
#
# - The API DOES decompress zstd on data it did not write. The Parquet
#   upload preview decodes the first row group of an uploaded file
#   (`lakehouse-api/src/upload_parquet.rs`, `convert_capped` ->
#   `ParquetRecordBatchReaderBuilder`), and a file whose pages are
#   ZSTD-compressed goes through `parquet`'s `ZSTDCodec` ->
#   `zstd::bulk::Decompressor`. The footer read (`inspect` ->
#   `ArrowReaderMetadata::load`) decodes thrift metadata only and
#   decompresses nothing. The uploaded Avro path is safe by
#   construction: `upload_formats::read_avro` reads the container's
#   `avro.codec` from the header and refuses every codec but `null`
#   BEFORE `apache_avro::Reader::new` (`PR #186 review BLOCKER 1`), so an
#   uploaded `zstandard` Avro is refused before a block is read.
# - None of the four advisories' affected functions is on that path.
#   0391 is `zstd::stream::raw::{Decoder,Encoder}::with_context`, the
#   only constructors that take a BORROWED context; every context in
#   this tree is created fresh and owned (`zstd::bulk::*`,
#   `zstd::stream::decode_all`, `zstd::{Encoder,Decoder}::new`), so no
#   context is ever reused across streams. 0398 is
#   `zstd_safe::seekable::Seekable::decompress`; that module is
#   `#[cfg(feature = "seekable")]`, the feature is not a default, and
#   `zstd` 0.13.3 has no `seekable` feature and no `seekable` module at
#   all, so the function is not even compiled into our binaries. 0403 is
#   `zstd_safe::DCtx::decompress_stream`, whose length extension only
#   happens for a `Vec<u8>` destination; the advisory states the read
#   decoder, `decode_all` and the bulk API are not affected, and this
#   tree uses only those (never `zstd::stream::write::Decoder`). 0410 is
#   the wasm32 allocator shim ("Affected Architectures: wasm32"); we
#   build x86_64 Linux.
# - The Iceberg side reads the same stack: `lakehouse-iceberg`'s
#   `read_all` scans Parquet data files (the Gold mart's are written by
#   this workspace and are UNCOMPRESSED, parquet's default codec; the
#   Bronze ones are written by Debezium, whose codec is its own default
#   and not ours), and `iceberg` reads the Avro manifests with
#   `apache-avro`, which would honour a `zstandard` codec if a manifest
#   declared one. Those files are written by the Iceberg clients and the
#   catalog, not by an upload.
# - So no advisory is reachable today, but the code a fix would land in
#   is a user-controlled one: an uploaded Parquet file's pages are
#   decompressed by Rust. A mitigation (refusing zstd-compressed
#   uploads in the API) is the product owner's call, tracked as `SEC-53`.
#
# Drop when `iceberg` releases a version on parquet >= 60 and
# apache-avro on zstd >= 0.14.3, then `cargo update`.
ignore = [
    "RUSTSEC-2023-0071",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    "RUSTSEC-2026-0410",
]

[licenses]
version = 2
# Anything not explicitly allowed below is a hard failure.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Zlib",
    # Public-domain dedication, compatible with distributing the combined
    # work under AGPL-3.0. Reached only transitively and unavoidably:
    # `tiny-keccak` comes in via `arrow-array -> ahash -> const-random ->
    # const-random-macro`, and `arrow` is required by `iceberg`. Allowed
    # globally rather than as a per-crate exception because CC0 is
    # public-domain-equivalent for every crate that could carry it, so a
    # narrower rule would only mean repeating this decision later.
    "CC0-1.0",
]
confidence-threshold = 0.8

# Per-crate exceptions: the 15 first-party workspace crates only. This does
# NOT add AGPL-3.0-or-later to the global `allow` list above, so a
# third-party dependency under AGPL/GPL would still fail the check.
[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-alerts"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-api"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-auth"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-bi"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-clickhouse"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-core"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-dagster"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-embed"

# `lakehousectl` (REL-2 S3-T1): the operator's install and update tool.
# Same reasoning as the others — AGPL is our own outbound license
# (CHANGELOG D4/2025-04 relicensing), accepted only for workspace
# crates, never for third-party dependencies.
[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehousectl"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-iceberg"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-llm"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-notify"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-store"

[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-test-support"

# `lakehouse-trino` (14th first-party crate, added after the 13 above
# were enumerated — SEC-8 S3). Same reasoning as the others: AGPL is
# our own outbound license (CHANGELOG D4/2025-04 relicensing), accepted
# only for workspace crates, never for third-party dependencies.
[[licenses.exceptions]]
allow = ["AGPL-3.0-or-later"]
name = "lakehouse-trino"

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
