# cargo-deny configuration for RantAI Lakehouse.
#
# Scope: `cargo deny check all` (advisories, bans, licenses, sources).
#
# A Phase 1 license audit found zero GPL/AGPL/SSPL-licensed crates across
# the 295 crates in this workspace's dependency graph. This config encodes
# the permissive set actually in use and denies anything else by default,
# so a future dependency change that pulls in a copyleft license fails CI
# instead of silently landing.

[graph]
targets = []

[advisories]
# RUSTSEC-2023-0071 ("Marvin Attack" timing side-channel in `rsa` 0.9.10):
# pulled in solely as a dev-dependency of lakehouse-auth
# (crates/lakehouse-auth/tests/oidc.rs, to mint an RSA key for OIDC test
# fixtures). It is never linked into a shipped binary, and upstream has
# published no fix ("No safe upgrade is available!" per the advisory) —
# `cargo update -p rsa --dry-run` confirms 0.9.10 is already latest.
# Re-evaluate when RustCrypto/RSA ships a constant-time implementation.
ignore = ["RUSTSEC-2023-0071"]

[licenses]
version = 2
# Anything not explicitly allowed below is a hard failure.
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "0BSD",
    "CDLA-Permissive-2.0",
    "Zlib",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "allow"
wildcards = "allow"

[sources]
unknown-registry = "warn"
unknown-git = "warn"
