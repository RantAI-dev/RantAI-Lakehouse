[toolchain]
# Pinned to the toolchain this workspace is actually built, tested, and
# linted with in CI and local dev. Since REL-9 (product-owner decision D1,
# 2026-10-17) it equals the `rust-version` floor in Cargo.toml: the floor is
# the latest stable — this release, 1.99.1 — not a compromise number a
# dependency happens to satisfy, and the CI `msrv` job proves the floor one
# patch below the pin (`cargo +1.99.0`; docs/CI.md explains why the `+` is
# needed). See README.md's MSRV note.
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "default"
