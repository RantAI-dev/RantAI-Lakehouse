[package]
name = "lakehouse-test-support"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

# NOTE: this crate is test-only infrastructure. It is intentionally a
# normal (non-dev) dependency of the crates that use it, because the
# `#[ctor]` startup hook must be linked into the final test binary; a
# `[dev-dependencies]`-only crate is linked too, but keeping this crate
# entirely free of any non-test code keeps the intent obvious.

[dependencies]
# `reusable-containers`: every test process shares one labelled Postgres
# container instead of leaving one behind per test binary (see lib.rs).
testcontainers = { version = "0.27", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15", features = ["postgres"] }
ctor = "1.0"
# The readiness wait (`wait_until_ready`): a TCP connect cannot tell a
# Postgres still starting up from a ready one, and `SELECT 1` is what the
# tests themselves need.
sqlx = { workspace = true }
tokio = { workspace = true, features = ["time"] }
tracing = { workspace = true }

[lints]
workspace = true
