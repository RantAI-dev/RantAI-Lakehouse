[package]
name = "lakehouse-iceberg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lakehouse-core = { path = "../lakehouse-core" }
# Pinned to the 0.10.x line (R6 in the plan's risk register: iceberg-rust is
# pre-1.0, API churn expected — confined to this crate so an upgrade touches
# one place). `=0.10.1` (exact), not `0.10`, because 0.10.x has already shown
# breaking changes between patch-adjacent tags on the `StorageFactory` seam
# this crate depends on directly.
iceberg = "=0.10.1"
iceberg-catalog-rest = "=0.10.1"
# S3 backend for the `StorageFactory` this crate implements itself — see
# `storage.rs`. Never a vendor SDK (`aws-sdk-s3`), never RustFS/MinIO admin
# APIs: only the plain S3 API surface `object_store::aws` speaks.
object_store = { version = "0.14", features = ["aws"] }
arrow-array = "58"
arrow-schema = "58"
parquet = "58"
typetag = "0.2"
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
futures = "0.3"
uuid = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }

[lints]
workspace = true
