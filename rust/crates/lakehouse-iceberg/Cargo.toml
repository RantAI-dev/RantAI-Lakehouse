[package]
name = "lakehouse-iceberg"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lakehouse-core = { path = "../lakehouse-core" }
# Pinned to the 0.11.0 line (R6 in the plan's risk register: iceberg-rust is
# pre-1.0, API churn expected — confined to this crate so an upgrade touches
# one place; 0.11.0's one hit here was `FileWrite::close`, see `storage.rs`).
# `=0.11.0` (exact), not `0.11`, because patch-adjacent tags have already
# broken the `StorageFactory` seam this crate depends on directly.
# `iceberg-catalog-rest` moves in lockstep: 0.11.0 requires `iceberg ^0.11`,
# so bumping one without the other puts two `iceberg` crates in the graph and
# the catalog's types stop matching (the two dependabot PRs #430/#431 could
# each only land together, as one change).
iceberg = "=0.11.0"
iceberg-catalog-rest = "=0.11.0"
# S3 backend for the `StorageFactory` this crate implements itself — see
# `storage.rs`. Never a vendor SDK (`aws-sdk-s3`), never RustFS/MinIO admin
# APIs: only the plain S3 API surface `object_store::aws` speaks.
object_store = { version = "0.14", features = ["aws"] }
arrow-array = "58"
arrow-schema = "58"
parquet = "58"
typetag = "0.2"
async-trait = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
thiserror = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
bytes = "1"
futures = "0.3"
uuid = { workspace = true }
url = "2"

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
reqwest = { workspace = true }
# rest.rs's wiremock tests exercise a real HTTP round trip against a fake
# Lakekeeper — see nine other crates (e.g. `lakehouse-clickhouse`) that
# already pin this workspace version the same way.
wiremock = { workspace = true }

[lints]
workspace = true
