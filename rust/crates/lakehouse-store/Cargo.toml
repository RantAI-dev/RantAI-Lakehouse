[package]
name = "lakehouse-store"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
# OPS-32: the integration tests are the explicit `[[test]]` target below, not
# one crate per file. `tests/it.rs` declares every file in `tests/` as a module
# and links the crate once instead of 41 times; a file that is not declared
# does not run at all, which `scripts/ci/check_test_modules.sh` fails the build
# for.
autotests = false

# OPS-32: every integration test module, in one binary.
[[test]]
name = "it"
path = "tests/it.rs"

[dependencies]
lakehouse-core = { path = "../lakehouse-core" }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
uuid = { workspace = true }
time = { workspace = true }
jiff = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

[dev-dependencies]
tokio = { workspace = true }
uuid = { workspace = true }
# `SEC-41` decision 6: `tests/migrations_upgrade.rs` recomputes the SHA-384
# checksum `sqlx` 0.8 wrote into `_sqlx_migrations`, so the fixture is a real
# 0.8-migrated database rather than an approximation. Already in the
# workspace (`sha2` 0.11), so this adds no package.
sha2 = { workspace = true }
lakehouse-test-support = { path = "../lakehouse-test-support" }

[lints]
workspace = true
