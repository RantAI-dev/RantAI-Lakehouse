[package]
name = "lakehouse-clickhouse"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
lakehouse-core = { path = "../lakehouse-core" }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
# `sync`: [`ChTableEnsured`] keeps its per-URL answer behind a
# `tokio::sync::RwLock`. The workspace's own `tokio` features cover only the
# runtime, so this crate asks for the one feature it uses.
tokio = { workspace = true, features = ["sync"] }
tokio-util = { workspace = true }

[dev-dependencies]
wiremock = { workspace = true }

[lints]
workspace = true
