[package]
name = "lakehouse-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "lakehouse_api"
path = "src/lib.rs"

[[bin]]
name = "lakehouse-api"
path = "src/main.rs"

[dependencies]
lakehouse-core = { path = "../lakehouse-core" }
lakehouse-clickhouse = { path = "../lakehouse-clickhouse" }
lakehouse-dagster = { path = "../lakehouse-dagster" }
lakehouse-alerts = { path = "../lakehouse-alerts" }
lakehouse-notify = { path = "../lakehouse-notify" }
lakehouse-bi = { path = "../lakehouse-bi" }
lakehouse-embed = { path = "../lakehouse-embed" }
lakehouse-llm = { path = "../lakehouse-llm" }
lakehouse-store = { path = "../lakehouse-store" }
lakehouse-auth = { path = "../lakehouse-auth" }
# `routes::auth::oidc_start`: PKCE's `code_challenge`
# is `BASE64URL(SHA256(code_verifier))` (RFC 7636 §4.2) and the `lh_oidc_flow`
# cookie's payload is base64url-encoded JSON — both need these directly,
# not routed through `lakehouse-auth::token` (whose hashing is SHA-256 of a
# bearer token for storage, a different job).
# `secret_manager::aws`: the SigV4 signer's HMAC-SHA256 (already in the
# workspace for `lakehouse-embed`; written here instead of the AWS SDK).
hmac = { workspace = true }
# `secret_manager::gcp`: signs the service account's RS256 JWT for the
# documented token exchange (already a workspace dependency, `aws_lc_rs`
# backend since SEC-51, as `lakehouse-auth` uses it); moved here from the
# dev-dependencies it was only in so far.
jsonwebtoken = { workspace = true }
sha2 = { workspace = true }
moka = { workspace = true }
base64 = { workspace = true }
# Builds the IdP authorize-endpoint redirect URL with `Url::query_pairs_mut`
# rather than hand-formatting a query string — see the workspace `Cargo.toml`
# entry's comment on why this needed adding: it was not already a direct
# dependency of this crate, only a transitive one via `reqwest`.
url = { workspace = true }
# `internal_hosts`: the connector SSRF allowlist's networks.
ipnet = { workspace = true }
# `routes::alerts::ApiFreshnessSource`/`ApiSilenceSource` (WS5 item C1)
# implement `lakehouse_alerts::FreshnessSource`/`SilenceSource`, both
# `#[async_trait::async_trait]` at their definition site -- any impl
# needs the same macro, in non-test code this time (not just
# `connector_probe.rs`'s dev-dependency-only use below).
async-trait = { workspace = true }
# WS2 §4 — `routes::query::run`'s `engine: "trino"` path talks to Trino's
# `/v1/statement` protocol through this crate's thin client, never directly.
lakehouse-trino = { path = "../lakehouse-trino" }
# ADR 0010 — Gold export to Iceberg happens in Rust: `routes::gold` (and
# `gold_export`, the ClickHouse-read -> Arrow -> Iceberg-append glue) is
# the first real caller of this crate. See the crate's own doc comment,
# which used to say nothing in the workspace depended on it.
lakehouse-iceberg = { path = "../lakehouse-iceberg" }
# Same exact pin `lakehouse-iceberg` uses (see that crate's Cargo.toml
# comment on why `=0.10.1`, not `0.10`) — needed directly here for
# `iceberg::spec` types and `iceberg::arrow::schema_to_arrow_schema`,
# which `lakehouse-iceberg` does not re-export.
iceberg = "=0.10.1"
rand = { workspace = true }
aes-gcm = { workspace = true }
axum = { workspace = true }
# `sync` (Mutex/OnceCell/Barrier): explicit here, not left to incidental
# workspace feature unification, because `gold_lock::MartLocks`
# (`tokio::sync::Mutex`/`OwnedMutexGuard`) and its tests
# (`tokio::sync::Barrier`) need it directly, and this crate should compile
# correctly on its own, not only as part of the whole-workspace build.
# `time`: `crate::bounded::run_with_budget` (WS2 §4) needs
# `tokio::time::{timeout_at, Instant, sleep}` to bound per-table/per-namespace
# Lakekeeper calls. `io-util`: `tokio::io::duplex` backs `routes::ai::stream_chat`'s
# NDJSON progress pipe for `POST /api/ai/chat` (`stream: true`).
tokio = { workspace = true, features = ["sync", "time", "io-util"] }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true, features = ["macros"] }
croner.workspace = true
# WS7 Phase B — `sql_rewrite`'s table-substitution rewriter parses every
# statement with a real grammar instead of scanning text, so it can
# refuse anything it does not fully understand (Hard Requirement 1/2).
# `visitor` derives `Visit`/`VisitMut` on every AST node, which WS7 item B5
# uses to find a dictGet*/joinGet* call anywhere in a statement (SELECT
# list, WHERE, nested subquery) without hand-rolling an exhaustive
# `Expr` match that a future sqlparser variant could silently bypass.
sqlparser = { workspace = true, features = ["visitor"] }
# `croner` pulls in `chrono` as its datetime backend through its default
# `chrono` feature (see `rust/Cargo.toml`'s comment on the `croner` entry); this
# crate needs `chrono` itself as a direct dependency too, for
# `crate::next_run::next_run_at`'s own `chrono::DateTime::from_timestamp`
# round trip -- `chrono` was already in `rust/Cargo.lock` as a TRANSITIVE
# dependency of something else in the tree, but this is the first direct
# use of it in this crate (WS4 item G2).
chrono = "0.4"
# BI-4 B review P-B1: the calendar day in the report time zone (the same
# workspace `jiff` and bundled database `lakehouse-store` already uses).
jiff = { workspace = true }
# Reads `.xls` and `.xlsx` for the file upload (`upload_workbook`, ADR 0014,
# amendment of 2026-10-07). MIT; it adds `atoi_simd`, `codepage`,
# `debug_unsafe`, `fast-float2`, `typed-path`, `zip` and `zopfli` to the
# lockfile, each MIT or Apache-2.0, all in `deny.toml`'s allow list. No
# features: dates are rendered from its date components, so its `chrono`
# feature is not needed.
calamine = "0.37"
uuid = { workspace = true }
sqlx = { workspace = true }
# `connector_probe`'s real S3-compatible connectivity test — same crate,
# same version, and the same `aws` feature `lakehouse-iceberg` already uses
# for RustFS. Kept as its own direct dependency (not routed through
# `lakehouse-iceberg`) because that crate's Iceberg `Storage`/catalog
# machinery is unrelated to a cheap "can this build reach this bucket"
# probe — `connector_probe` never touches a table or a catalog.
object_store = { version = "0.14", features = ["aws"] }
# Building the Arrow `RecordBatch`es `lakehouse-iceberg::GoldTable::append`
# writes from `ClickHouse` `FORMAT JSON` rows (`gold_export`). Same
# versions `lakehouse-iceberg` pins, so an Arrow upgrade only ever needs to
# happen in one place at a time.
arrow-array = "58"
arrow-schema = "58"
# Reads `.parquet` for the file upload (`upload_parquet`, ADR 0014, amendment
# of 2026-10-08). The same crate and the same default features
# `lakehouse-iceberg` already uses (so the lockfile gains no crate and no
# licence); declared here because the upload's reader is the API's own, not
# routed through the Iceberg crate.
parquet = "58"
# `DATA-17` slice 4 (plan AD8): the preview reads the Avro, gzip and zip files an upload may
# be (`upload_formats`). All three are already in `Cargo.lock` through other crates, at
# the versions below and with the features the build already unifies, so the lockfile
# gains no crate. `apache-avro` is the crate `iceberg` uses for its manifests;
# its default features are off here because codecs are not ours to choose (the preview
# accepts the `null` and `deflate` codecs the job's `fastavro` reads without extras);
# `zip` has `deflate` as `calamine` already enables it; `flate2` reads the gzip prefix.
apache-avro = { version = "0.21", default-features = false }
flate2 = "1.1"
zip = { version = "8.6", default-features = false, features = ["deflate"] }
# 0.13, not 0.12: SEC-8 — tiberius 0.12 pulls rustls 0.21 ->
# rustls-webpki 0.101.7 (RUSTSEC-2026-0098/0099/0104, no fixed 0.101.x);
# the 0.13 line is on rustls 0.23 -> webpki 0.103.15, all three fixed.
tiberius = { version = "0.13", default-features = false, features = ["tds73", "rustls", "chrono"] }
# SEC-14 part B (`pg_probe`): the Postgres connection test speaks the wire
# protocol itself, so it can refuse every authentication method but
# SCRAM-SHA-256, and always upgrades to TLS before the startup packet. See
# the workspace `Cargo.toml` entries for what each crate is and why it is
# here.
postgres-protocol = { workspace = true }
fallible-iterator = { workspace = true }
bytes = { workspace = true }
tokio-rustls = { workspace = true }
rustls = { workspace = true }
# `tiberius::Client::connect` takes a Tokio-`AsyncRead`/`AsyncWrite`
# stream wrapped for the `futures`-crate traits tiberius itself uses
# (tiberius's own doc comment, `src/lib.rs`'s "Connecting with Tokio"
# example) -- `compat` is the feature gating that wrapper. `io`:
# `tokio_util::io::ReaderStream` turns `routes::ai::stream_chat`'s
# `tokio::io::duplex` reader into the `POST /api/ai/chat` NDJSON body.
tokio-util = { workspace = true, features = ["compat", "io"] }
# SEC-15: `connector_probe`'s S3 test hands `object_store` a pinned HTTP
# client (an `HttpConnector`), and `object_store` 0.14 is built on
# `reqwest` 0.13 while the rest of this crate is on 0.12, so the client must
# be a 0.13 one to be accepted. Same version `object_store` already pulls
# (one copy in `Cargo.lock`); no TLS provider of its own beyond the `rustls`
# feature `object_store`'s `aws` feature already turns on for it.
reqwest013 = { package = "reqwest", version = "0.13", default-features = false, features = ["rustls"] }
# `SRC-13` (D2): `connector_listing` walks `object_store`'s `list` stream so a
# bucket listing can stop at its bound instead of collecting every key.
# `futures` 0.3 is already in `Cargo.lock` (`lakehouse-iceberg` depends on it),
# so this adds no package; only this crate's dependency list in the lockfile.
futures = "0.3"
# `BI-1` D6: the .xlsx writer. Pinned exactly (a download format must not change
# under a routine update); `constant_memory` mode keeps a million-row export off
# the heap. MIT OR Apache-2.0; `cargo deny check` and `cargo audit` pass with it
# (plan 2026-10-17-bi-1-export.md, section 5).
rust_xlsxwriter = { version = "=0.99.1", features = ["constant_memory"] }

[dev-dependencies]
# `BI-1` T2: the export tests open the .xlsx they wrote to read its cells and
# styles. Same version and features as `calamine` and `rust_xlsxwriter` already
# ask for, so the lockfile gains no package.
zip = { version = "8.6", default-features = false, features = ["deflate"] }
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }
uuid = { workspace = true }
lakehouse-test-support = { path = "../lakehouse-test-support" }
# `AppState::webhook_sender_override`: tests that deliver to a loopback
# `wiremock` listener need a resolver that approves it (`SEC-10` merge).
lakehouse-notify = { path = "../lakehouse-notify", features = ["test-support"] }
# connector_probe.rs's own tests (`PanicIfCalledResolver`) implement
# `lakehouse_core::secret::DynSecretResolver` directly -- that trait is
# `#[async_trait::async_trait]` at its definition site
# (`lakehouse-core/src/secret.rs`), so any impl needs the same macro.
async-trait = { workspace = true }
# `#[tokio::test(start_paused = true)]` for `bounded::run_with_budget`'s
# deterministic budget/timeout tests (WS2 §4) — a real `sleep` would make
# those tests slow and, at the margins, flaky. `net`/`io-util` are for
# `tests/sec41_verify_ca.rs`'s TLS terminator (a loopback `TcpListener` and
# `copy_bidirectional`), which is the only thing in this crate's tests that
# needs a socket of its own.
tokio = { workspace = true, features = ["test-util", "net", "io-util"] }
# `tests/gold_publication.rs` (DATA-1) proves the per-mart publication
# routes' ClickHouse-backed halves (404 for an unknown mart, skip-when-
# unchanged for `?ifChanged=true`) against a REAL `ClickHouse` — the same
# `testcontainers` arrangement `lakehouse-test-support` provides for
# Postgres, pinned to the compose file's own `26.8` tag. Versions mirror
# `lakehouse-test-support`'s own declarations so Cargo unifies on one
# build.
testcontainers = { version = "0.27", features = ["reusable-containers"] }
testcontainers-modules = { version = "0.15", features = ["clickhouse"] }
# `pipeline_source.rs`'s tests (WS4 item C2) exercise the allowlist builder
# against a real filesystem (a real `..`/absolute-path/symlink escape must
# actually resolve to a file outside a real base directory to prove
# anything, not a string containing those characters) — a real `TempDir`
# per test, auto-removed on drop, never a fixed shared path.
# `routes::auth`'s OIDC callback round-trip test signs a real id token to prove
# `oidc_callback` calls `OidcAuthenticator::authenticate_with_nonce`
# against a `wiremock` `/jwks` + `/token` pair, the same
# harness shape `lakehouse-auth/tests/oidc.rs` already uses for that
# authenticator directly — `jsonwebtoken` is a normal dependency now (see
# above, `SRC-12` part B4); `rsa` is not a workspace dependency (it is a
# direct dependency of `lakehouse-auth` only), so it is added here directly
# too, pinned to the same "0.9" `lakehouse-auth/Cargo.toml` already uses.
# `secret_manager::gcp`'s tests also generate a service-account key with it.
rsa = "0.9"

# `SEC-14` part B (dev-only): the TLS-terminating proxy in front of the
# shared test `Postgres` (`src/tls_proxy.rs`) needs a server certificate,
# and a test can only get one by generating it -- no certificate is
# committed to this repository (gitleaks reads a committed private key as a
# leak). `ring` and no `crypto` defaults, matching the workspace's one
# rustls provider story (the workspace `rustls` entry); MIT OR Apache-2.0.
# `SEC-41` decision 7 / AC1: `tests/sec41_verify_ca.rs` puts a TLS
# terminator in front of the shared test Postgres (answer `SSLRequest` with
# `S`, then rustls, then forward bytes) and needs a certificate chain per
# test. No certificate is committed to this repository: `.gitleaksignore`'s
# history (SEC-36) reads a committed private key as a leak, so the chain is
# minted at test time. `rcgen` with `ring` and no `crypto`/`pem` defaults,
# matching this workspace's one rustls provider story (the `rustls` feature
# `sqlx-core` turns on); MIT OR Apache-2.0. Its `yasna` dependency is the
# only package it adds to `Cargo.lock`.
rcgen = { version = "0.14", default-features = false, features = ["ring"] }

tempfile = { workspace = true }
# The terminator's own TLS server side, and the provider named explicitly so
# it does not depend on which rustls consumer set the process default first.
# Both are already in `Cargo.lock` (through `reqwest`/`object_store`/
# `sqlx-core`); these are the first DIRECT uses here.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }

[lints]
workspace = true
