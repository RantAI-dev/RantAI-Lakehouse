[package]
name = "lakehouse-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[lib]
name = "lakehouse_api"
path = "src/lib.rs"

[[bin]]
name = "lakehouse-api"
path = "src/main.rs"

[dependencies]
lakehouse-core = { path = "../lakehouse-core" }
lakehouse-clickhouse = { path = "../lakehouse-clickhouse" }
lakehouse-dagster = { path = "../lakehouse-dagster" }
lakehouse-alerts = { path = "../lakehouse-alerts" }
lakehouse-notify = { path = "../lakehouse-notify" }
lakehouse-bi = { path = "../lakehouse-bi" }
lakehouse-embed = { path = "../lakehouse-embed" }
lakehouse-llm = { path = "../lakehouse-llm" }
lakehouse-store = { path = "../lakehouse-store" }
lakehouse-auth = { path = "../lakehouse-auth" }
rand = { workspace = true }
axum = { workspace = true }
tokio = { workspace = true }
tower = { workspace = true }
tower-http = { workspace = true }
reqwest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
time = { workspace = true }
uuid = { workspace = true }
sqlx = { workspace = true }
# `connector_probe`'s real S3-compatible connectivity test — same crate,
# same version, and the same `aws` feature `lakehouse-iceberg` already uses
# for RustFS. Not a `lakehouse-iceberg` dependency: that crate's Iceberg
# `Storage`/catalog machinery is unrelated to a cheap "can this build reach
# this bucket" probe, and `lakehouse-api` does not otherwise depend on
# `lakehouse-iceberg` (P6 doesn't wire routes to it).
object_store = { version = "0.14", features = ["aws"] }

[dev-dependencies]
tower = { workspace = true, features = ["util"] }
wiremock = { workspace = true }
uuid = { workspace = true }
lakehouse-test-support = { path = "../lakehouse-test-support" }

[lints]
workspace = true
