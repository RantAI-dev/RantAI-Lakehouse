[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# Real floor, not the edition-2024 minimum (1.85). Verified by building
# --locked against progressively newer toolchains: 1.85 fails because
# testcontainers/testcontainers-modules require 1.88, time/time-core/
# time-macros require 1.88.0, etcetera requires 1.87.0, and ferroid
# requires 1.85.1. 1.88.0 builds clean. See docs/CI.md.
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
tower-http = { version = "0.7", features = ["trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indexmap = { version = "2", features = ["serde"] }
hmac = "0.13"
sha2 = "0.11"
base64 = "0.23"
rand = "0.8"
# `routes::auth::oidc_start` builds the IdP authorize
# redirect via `url::Url`'s query-pair encoder rather than hand-formatting
# a query string, so a param value can never break the URL's structure.
# Already present transitively (via `reqwest`, `2.5.8` in `Cargo.lock`) —
# this is the first DIRECT use, so it needs its own workspace entry.
url = "2"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "tokio1-rustls-tls"] }
wiremock = "0.6"
tempfile = "3"
tokio-util = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "mysql", "uuid", "time", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
argon2 = "0.6"
subtle = "2"
# `jsonwebtoken` 11 (PR #15) made its crypto backend pluggable and ships
# with NEITHER backend enabled by default; `CryptoProvider::get_default()`
# panics at runtime ("Could not automatically determine the process-level
# CryptoProvider...") unless exactly one of `rust_crypto`/`aws_lc_rs` is
# selected. Chose `rust_crypto` (pure-Rust, no new C dependency) to match
# every other crypto crate already in this workspace (sha2, hmac, argon2,
# rand are all RustCrypto-ecosystem).
jsonwebtoken = { version = "11", default-features = false, features = ["rust_crypto", "use_pem"] }
# `lakehouse-api::next_run` (WS4 item G2) is the first workstream to land
# this dependency -- WS5 also needs cron-next-occurrence computation and
# reuses this same entry rather than adding a second one (programme rule:
# whichever workstream lands first adds it). No feature flag: `croner`
# 2.x's plan-doc-assumed `chrono` FEATURE does not exist -- confirmed by
# reading the crate's own Cargo.toml after `cargo fetch` (a required
# hedge from this task's own plan doc, which flagged the API as
# independently unverified) -- `chrono` is croner 2.x's one, non-optional,
# always-on datetime backend; `next_run.rs`'s own doc comment has the
# full API-shape correction (`Cron::new(..).parse()`, not `FromStr`).
croner = { version = "2" }
# WS7 Phase B (`lakehouse-api::sql_rewrite`) — the enforcement-side SQL
# rewriter needs a real parser, not a regex/string scan, to apply masking
# and row-filter obligations without ever misreading a construct as safe.
# 0.62 verified latest via docs.rs/sqlparser/latest as of 2026-09-11;
# `resolver = "3"` locks the exact patch in `Cargo.lock` on first build.
sqlparser = "0.62"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
# Groups sit at negative priority so the specific lints below can override
# them. The inverse (groups last) silently defeats any future attempt to
# downgrade a single member lint.
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "deny"
unwrap_used = "deny"
expect_used = "deny"
