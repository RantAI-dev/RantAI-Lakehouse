[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
# Real floor, not the edition-2024 minimum (1.85). Verified by building
# --locked against progressively newer toolchains: 1.85 fails because
# testcontainers/testcontainers-modules require 1.88, time/time-core/
# time-macros require 1.88.0, etcetera requires 1.87.0, and ferroid
# requires 1.85.1. 1.88.0 builds clean. See docs/CI.md.
rust-version = "1.88"
license = "AGPL-3.0-or-later"

[workspace.dependencies]
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "timeout"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
indexmap = { version = "2", features = ["serde"] }
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
rand = "0.8"
time = { version = "0.3", features = ["formatting", "parsing", "serde"] }
lettre = { version = "0.11", default-features = false, features = ["smtp-transport", "rustls-tls", "builder", "tokio1-rustls-tls"] }
wiremock = "0.6"
tokio-util = "0.7"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "time", "json", "macros", "migrate"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
argon2 = "0.5"
subtle = "2"
jsonwebtoken = "11"

[workspace.lints.rust]
future-incompatible = "warn"
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
# Groups sit at negative priority so the specific lints below can override
# them. The inverse (groups last) silently defeats any future attempt to
# downgrade a single member lint.
all = { level = "deny", priority = -2 }
pedantic = { level = "warn", priority = -1 }
redundant_clone = "deny"
needless_collect = "deny"
large_enum_variant = "deny"
unwrap_used = "deny"
expect_used = "deny"
